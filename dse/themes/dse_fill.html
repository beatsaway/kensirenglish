<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill in Blanks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 8px grid system */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            
            /* Colors - refined palette */
            --color-bg: #ffffff;
            --color-surface: #f8f8f8;
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: transparent;
            color: var(--color-text);
            padding: 4px var(--space-4) 4px var(--space-2);
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            gap: var(--space-2);
            position: relative;
            border-bottom: 1px solid var(--color-border);
        }

        .header-left {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-right: var(--space-1);
        }

        .header-label {
            font-size: 14px;
            color: var(--color-text);
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.02em;
            padding: 2px 0;
            line-height: 1.2;
        }

        .header-label .separator {
            color: var(--color-text-secondary);
            margin: 0 2px;
        }

        .header-copyright {
            flex: 0 0 auto;
            font-size: 9px;
            color: var(--color-text-secondary);
            font-weight: 400;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 1px;
        }

        .header-copyright a {
            text-decoration: none;
            color: inherit;
        }

        .header-copyright a:hover {
            opacity: 0.7;
        }

        .header-right {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .randomize-checkbox {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            font-size: 12px;
            color: var(--color-text);
            cursor: pointer;
            user-select: none;
        }

        .randomize-checkbox input[type="checkbox"] {
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .filter-bar {
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-1) var(--space-4);
            display: flex;
            align-items: stretch;
            gap: 0;
            flex-shrink: 0;
        }

        .filter-bar select {
            flex: 1;
            padding: 4px var(--space-2);
            border: none;
            border-right: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s ease;
            margin: 0;
            font-family: inherit;
        }

        .filter-bar select:last-child {
            border-right: none;
        }

        .filter-bar select:focus {
            outline: none;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-height: 0;
        }

        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            padding: var(--space-3) var(--space-4);
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .exercise-item {
            width: 100%;
            padding: 0;
            background: var(--color-bg);
            display: none;
        }

        .exercise-item.active {
            display: block;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-top: 1px solid var(--color-border);
            background: var(--color-bg);
            flex-shrink: 0;
        }

        .nav-button {
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            font-weight: 400;
            transition: color 0.15s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-button:hover:not(:disabled) {
            color: var(--color-text);
        }

        .nav-button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .nav-slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: var(--space-2);
            max-width: 300px;
            min-width: 0;
        }

        .nav-slider {
            flex: 1;
            height: 2px;
            background: var(--color-border);
            border-radius: 0;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .nav-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--color-text);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .nav-slider::-webkit-slider-thumb:hover {
            background: var(--color-text-secondary);
        }

        .nav-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--color-text);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: background 0.15s ease;
        }

        .nav-slider::-moz-range-thumb:hover {
            background: var(--color-text-secondary);
        }

        .exercise-counter {
            font-size: 12px;
            color: var(--color-text-secondary);
            white-space: nowrap;
            padding: 0 var(--space-1);
            font-weight: 400;
            flex-shrink: 0;
            min-width: 45px;
            text-align: center;
        }

        .policy-title {
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: var(--space-2);
            font-size: 28px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            text-align: center;
        }

        .policy-title-chinese {
            font-weight: 600;
            color: var(--color-text);
            display: block;
            margin-bottom: var(--space-1);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .policy-title-english {
            font-weight: 400;
            color: var(--color-text);
            font-size: 20px;
            display: block;
            opacity: 0.85;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @media (max-width: 768px) {
            main {
                padding: var(--space-3) var(--space-2);
            }
            
            .policy-title {
                font-size: 24px;
            }
            
            .policy-title-chinese {
                font-size: 24px;
            }
            
            .policy-title-english {
                font-size: 18px;
            }
        }

        .theme-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text);
            margin-bottom: var(--space-2);
            display: inline-block;
            font-weight: 500;
        }

        .type-label {
            display: inline-block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-secondary);
            margin-left: var(--space-1);
            padding: 2px 6px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            font-weight: 500;
        }

        .keywords-section {
            margin-bottom: var(--space-1);
            padding: var(--space-1);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
        }

        .keywords-title {
            font-weight: 400;
            margin-bottom: var(--space-1);
            color: var(--color-text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .keywords-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .keywords-container-bottom {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-top: 1px solid var(--color-border);
            background: var(--color-bg);
            flex-shrink: 0;
            min-height: 0;
            justify-content: center;
        }

        .keyword {
            padding: 6px 12px;
            background: var(--color-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.15s ease, border-color 0.15s ease;
            border-radius: 4px;
        }

        .keyword:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }

        .keyword.selected {
            background: var(--color-surface);
            border-color: var(--color-text);
            border-width: 2px;
        }

        .paragraph-group {
            margin-bottom: var(--space-3);
        }

        .paragraph-group:last-child {
            margin-bottom: 0;
        }

        .paragraph {
            line-height: 1.5;
            font-size: 16px;
            color: var(--color-text);
            margin-bottom: var(--space-2);
            font-weight: 400;
        }

        .blank {
            display: inline-block;
            min-width: 80px;
            min-height: 24px;
            border: 1px solid var(--color-border);
            margin: 0 2px;
            padding: 2px 6px;
            background: var(--color-bg);
            position: relative;
            vertical-align: baseline;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            font-size: 16px;
            font-weight: 400;
        }

        .blank:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }

        .blank.filled {
            border-color: var(--color-text-secondary);
            cursor: pointer;
            min-width: 0;
        }

        .blank.correct {
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .blank.incorrect {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.5);
        }

        .blank-content {
            display: inline-block;
            color: var(--color-text);
            font-weight: 500;
        }

        .chinese-text {
            color: var(--color-text-secondary);
            font-size: 16px;
            margin-bottom: var(--space-1);
            line-height: 1.6;
        }

        /* Mode-based visibility */
        .mode-keyword-only .chinese-text,
        .mode-keyword-only .paragraph {
            display: none;
        }

        .mode-keyword-only .paragraph.revealed,
        .mode-keyword-only .chinese-text.revealed {
            display: block;
        }

        .mode-no-keywords .keywords-container-bottom {
            display: none;
        }

        .blank.revealed {
            background: rgba(33, 150, 243, 0.15);
            border-color: rgba(33, 150, 243, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <span class="header-label">Fill in blanks by themes<span class="separator">•✏️</span>主題填充</span>
                <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
            </div>
            <div class="header-right">
                <label class="randomize-checkbox">
                    <input type="checkbox" id="randomizeCheckbox">
                    <span>Random Order 隨機次序</span>
                </label>
            </div>
        </div>
        <div class="filter-bar">
            <select id="modeSelect">
                <option value="default">With Keywords</option>
                <option value="no-keywords">No Keywords</option>
                <option value="keyword-only">Keywords Only</option>
            </select>
            <select id="themeSelect">
                <option value="all">All Themes</option>
            </select>
        </div>
        <div class="content">
            <main>
                <div class="content-wrapper">
                    <div id="carouselWrapper"></div>
                </div>
            </main>
            <div class="keywords-container-bottom" id="keywordsContainerBottom"></div>
            <div class="nav-controls">
                <button class="nav-button" id="prevButton" aria-label="Previous">‹</button>
                <div class="nav-slider-container">
                    <input type="range" class="nav-slider" id="navSlider" min="1" max="1" value="1" aria-label="Navigate exercises">
                </div>
                <div class="exercise-counter" id="exerciseCounter">1 / 1</div>
                <button class="nav-button" id="nextButton" aria-label="Next">›</button>
            </div>
        </div>
    </div>

    <script src="exercises_data.js"></script>
    <script>

        let selectedKeyword = null;
        let currentTheme = 'all';
        let currentMode = 'default';
        let shuffledExercises = [];
        let currentIndex = 0;
        let randomizeEnabled = false;

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function init() {
            setupModeFilter();
            setupThemeFilter();
            setupRandomizeCheckbox();
            setupNavigation();
            renderExercises();
        }

        function setupRandomizeCheckbox() {
            const randomizeCheckbox = document.getElementById('randomizeCheckbox');
            randomizeCheckbox.addEventListener('change', (e) => {
                randomizeEnabled = e.target.checked;
                // Force re-render to apply randomization
                currentIndex = 0;
                renderExercises();
            });
        }

        function setupNavigation() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const navSlider = document.getElementById('navSlider');

            prevButton.addEventListener('click', () => {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateDisplay();
                }
            });

            nextButton.addEventListener('click', () => {
                if (currentIndex < shuffledExercises.length - 1) {
                    currentIndex++;
                    updateDisplay();
                }
            });

            navSlider.addEventListener('input', (e) => {
                const newIndex = parseInt(e.target.value) - 1;
                if (newIndex !== currentIndex && newIndex >= 0 && newIndex < shuffledExercises.length) {
                    currentIndex = newIndex;
                    updateDisplay();
                }
            });
        }

        function setupModeFilter() {
            const modeSelect = document.getElementById('modeSelect');
            modeSelect.addEventListener('change', (e) => {
                currentMode = e.target.value;
                selectedKeyword = null; // Reset selection when mode changes
                document.querySelectorAll('.keyword').forEach(k => k.classList.remove('selected'));
                renderExercises();
            });
        }

        function setupThemeFilter() {
            const themeSelect = document.getElementById('themeSelect');
            const themes = [...new Set(exercises.map(ex => ex.theme))];
            themes.forEach(theme => {
                const option = document.createElement('option');
                option.value = theme;
                option.textContent = theme;
                themeSelect.appendChild(option);
            });

            themeSelect.addEventListener('change', (e) => {
                currentTheme = e.target.value;
                renderExercises();
            });
        }

        function renderExercises() {
            const carouselWrapper = document.getElementById('carouselWrapper');
            carouselWrapper.innerHTML = '';

            // Apply mode class to content container
            const content = document.querySelector('.content');
            content.className = `content mode-${currentMode}`;

            // Filter exercises
            let filteredExercises = currentTheme === 'all' 
                ? [...exercises] 
                : exercises.filter(ex => ex.theme === currentTheme);
            
            // Shuffle only if randomize is enabled
            if (randomizeEnabled) {
                shuffledExercises = shuffleArray(filteredExercises);
            } else {
                // Use original order (create a new array to avoid reference issues)
                shuffledExercises = [...filteredExercises];
            }
            currentIndex = 0;

            // Create exercise items
            shuffledExercises.forEach((exercise, index) => {
                const exerciseDiv = document.createElement('div');
                exerciseDiv.className = `exercise-item ${index === 0 ? 'active' : ''}`;

                const themeLabel = document.createElement('div');
                themeLabel.className = 'theme-label';
                themeLabel.textContent = exercise.theme;
                const typeLabel = document.createElement('span');
                typeLabel.className = 'type-label';
                typeLabel.textContent = exercise.type;
                themeLabel.appendChild(typeLabel);
                exerciseDiv.appendChild(themeLabel);

                const policyTitle = document.createElement('div');
                policyTitle.className = 'policy-title';
                const titleChineseSpan = document.createElement('span');
                titleChineseSpan.className = 'policy-title-chinese';
                titleChineseSpan.textContent = exercise.title;
                policyTitle.appendChild(titleChineseSpan);
                const titleEnSpan = document.createElement('span');
                titleEnSpan.className = 'policy-title-english';
                titleEnSpan.textContent = exercise.titleEn;
                policyTitle.appendChild(titleEnSpan);
                exerciseDiv.appendChild(policyTitle);

                exercise.paragraphs.forEach((para, paraIndex) => {
                    const paragraphGroup = document.createElement('div');
                    paragraphGroup.className = 'paragraph-group';
                    
                    const chineseDiv = document.createElement('div');
                    chineseDiv.className = 'chinese-text';
                    chineseDiv.textContent = para.chinese;
                    paragraphGroup.appendChild(chineseDiv);

                    const paraDiv = document.createElement('div');
                    paraDiv.className = 'paragraph';
                    paraDiv.innerHTML = para.english;
                    paragraphGroup.appendChild(paraDiv);

                    const blanks = paraDiv.querySelectorAll('.blank');
                    blanks.forEach(blank => {
                        if (!blank.textContent.trim()) {
                            blank.innerHTML = '&nbsp;';
                        }
                        blank.addEventListener('click', () => handleBlankClick(blank));
                    });
                    
                    exerciseDiv.appendChild(paragraphGroup);
                });

                carouselWrapper.appendChild(exerciseDiv);
            });

            updateNavigation();
            updateDisplay();
        }

        function updateDisplay() {
            // Update active exercise
            const exerciseItems = document.querySelectorAll('.exercise-item');
            exerciseItems.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Update keywords container for current exercise
            updateKeywordsContainer();

            // Reset keyword selection when changing exercises
            selectedKeyword = null;

            updateNavigation();
        }

        function updateKeywordsContainer() {
            const keywordsContainerBottom = document.getElementById('keywordsContainerBottom');
            keywordsContainerBottom.innerHTML = '';

            if (shuffledExercises.length === 0 || currentIndex >= shuffledExercises.length) {
                return;
            }

            const currentExercise = shuffledExercises[currentIndex];
            if (!currentExercise || !currentExercise.keywords) {
                return;
            }

            // Randomize keywords order
            const shuffledKeywords = shuffleArray(currentExercise.keywords);
            shuffledKeywords.forEach((keyword) => {
                const keywordEl = document.createElement('div');
                keywordEl.className = 'keyword';
                keywordEl.textContent = keyword;
                keywordEl.dataset.keyword = keyword;
                keywordEl.addEventListener('click', () => handleKeywordClick(keywordEl));
                keywordsContainerBottom.appendChild(keywordEl);
            });
        }

        function updateNavigation() {
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const navSlider = document.getElementById('navSlider');
            const exerciseCounter = document.getElementById('exerciseCounter');

            // Update buttons
            prevButton.disabled = currentIndex === 0;
            nextButton.disabled = currentIndex === shuffledExercises.length - 1;

            // Update slider
            navSlider.max = shuffledExercises.length;
            navSlider.value = currentIndex + 1;

            // Update counter
            exerciseCounter.textContent = `${currentIndex + 1} / ${shuffledExercises.length}`;
        }

        function handleKeywordClick(keywordEl) {
            // Handle keywords only mode - reveal paragraphs with answers
            if (currentMode === 'keyword-only') {
                // Find the active exercise item
                const exerciseItem = document.querySelector('.exercise-item.active');
                if (!exerciseItem) return;

                // Get all paragraphs and chinese text in this exercise
                const paragraphs = exerciseItem.querySelectorAll('.paragraph');
                const chineseTexts = exerciseItem.querySelectorAll('.chinese-text');

                // Toggle reveal state
                const isRevealed = paragraphs.length > 0 && paragraphs[0].classList.contains('revealed');

                paragraphs.forEach(para => {
                    if (isRevealed) {
                        para.classList.remove('revealed');
                    } else {
                        para.classList.add('revealed');
                        // Fill all blanks with correct answers
                        const blanks = para.querySelectorAll('.blank');
                        blanks.forEach(blank => {
                            const answer = blank.dataset.answer;
                            blank.classList.add('filled', 'correct');
                            blank.innerHTML = `<span class="blank-content">${answer}</span>`;
                        });
                    }
                });

                chineseTexts.forEach(chinese => {
                    if (isRevealed) {
                        chinese.classList.remove('revealed');
                    } else {
                        chinese.classList.add('revealed');
                    }
                });

                return;
            }

            // Default and no-keywords modes
            // Toggle selection
            if (keywordEl.classList.contains('selected')) {
                keywordEl.classList.remove('selected');
                selectedKeyword = null;
            } else {
                // Deselect all other keywords
                document.querySelectorAll('.keyword').forEach(k => k.classList.remove('selected'));
                keywordEl.classList.add('selected');
                selectedKeyword = keywordEl.dataset.keyword;
            }
        }

        function handleBlankClick(blank) {
            // Handle "no keywords" mode - reveal answer on click
            if (currentMode === 'no-keywords') {
                if (blank.classList.contains('revealed')) {
                    blank.classList.remove('revealed');
                    blank.innerHTML = '&nbsp;';
                } else {
                    const answer = blank.dataset.answer;
                    blank.classList.add('revealed');
                    blank.innerHTML = `<span class="blank-content">${answer}</span>`;
                }
                return;
            }

            // Keywords only mode: paragraphs are hidden, so this shouldn't be called
            // But if it is, do nothing
            if (currentMode === 'keyword-only') {
                return;
            }

            // Default mode
            // If blank is filled, empty it
            if (blank.classList.contains('filled')) {
                blank.classList.remove('filled', 'correct', 'incorrect');
                blank.innerHTML = '&nbsp;';
                return;
            }

            // If no keyword is selected, do nothing
            if (!selectedKeyword) {
                return;
            }

            // Fill the blank with selected keyword
            const answer = blank.dataset.answer;
            blank.classList.add('filled');
            blank.innerHTML = `<span class="blank-content">${selectedKeyword}</span>`;

            // Check if correct
            if (selectedKeyword === answer) {
                blank.classList.add('correct');
                blank.classList.remove('incorrect');
            } else {
                blank.classList.add('incorrect');
                blank.classList.remove('correct');
            }
        }

        init();
    </script>
</body>
</html>
