<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE — Match practice (topics)</title>
    <link rel="stylesheet" href="../../main.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #fafbfc;
            color: #1a1a1a;
            line-height: 1.45;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 12px 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
        }
        .header-row {
            max-width: 42rem;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 16px;
        }
        .site { font-size: 13px; }
        .site a { color: #6b7280; text-decoration: none; }
        .site a:hover { color: #7c3aed; text-decoration: underline; }
        h1 { font-size: 1.15rem; font-weight: 600; color: #7c3aed; }
        main {
            flex: 1;
            padding: 24px 20px 40px;
            max-width: 42rem;
            margin: 0 auto;
            width: 100%;
        }
        .topic-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .topic-list a {
            display: block;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            text-decoration: none;
            color: #111;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .topic-list a:hover {
            border-color: #7c3aed;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.12);
        }
        .topic-title { font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>
    <header>
        <div class="header-row">
            <h1>DSE match practice</h1>
            <span class="site"><a href="../../index.html">©kensirenglish.com</a></span>
        </div>
    </header>
    <main>
        <ul class="topic-list">
            <li>
                <a href="tech_and_social_media.html">
                    <div class="topic-title">Tech &amp; social media</div>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
