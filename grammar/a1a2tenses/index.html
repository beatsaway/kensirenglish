<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9 Tenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../main.css">
  <link rel="stylesheet" href="tenses_main.css">
  <style>
    /* Minimal modern navigation - header replacement */
    .exercise-selector {
      background: transparent;
      padding: 4px var(--space-4) 4px var(--space-2);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
    }
    
    .header-select-container {
      flex: 1;
      position: relative;
    }
    
    /* Remove default header styles */
    header {
      display: none;
    }


    .exercise-selector select {
      width: auto;
      max-width: 400px;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 0;
      background-color: var(--color-bg);
      font-size: 14px;
      font-family: inherit;
      color: var(--color-text);
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .exercise-selector select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
    }

    .header-left {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-right: var(--space-1);
    }

    .header-label {
      font-size: 14px;
      color: var(--color-text);
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.02em;
      padding: 2px 0;
      line-height: 1.2;
    }

    .header-label .separator {
      color: var(--color-text-secondary);
      margin: 0 2px;
    }

    .header-copyright {
      flex: 0 0 auto;
      font-size: 9px;
      color: var(--color-text-secondary);
      font-weight: 400;
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 1px;
    }

    .header-copyright a {
      text-decoration: none;
      color: inherit;
    }

    .header-copyright a:hover {
      opacity: 0.7;
    }

    .exercise-info {
      background: transparent;
      padding: var(--space-2) 0;
      margin-bottom: var(--space-4);
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-3);
    }

    .exercise-info strong {
      color: var(--color-text);
      font-weight: 600;
      font-size: 14px;
      display: inline;
    }

    .exercise-info .step-header {
      white-space: nowrap;
      display: block;
    }

    .exercise-info .step-header strong {
      display: inline;
    }

    .exercise-info .keyword {
      color: var(--color-accent);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--color-accent);
      text-underline-offset: 2px;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .exercise-info .keyword:hover {
      opacity: 0.7;
    }

    .exercise-info .keyword.active {
      background-color: var(--color-accent-light);
      font-weight: 600;
    }

    .exercise-info .keyword-reveal {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  margin-top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      font-size: 11px;
      color: var(--color-text-secondary);
      font-style: italic;
      padding-left: var(--space-2);
    }

    .exercise-info .keyword-reveal.active {
      max-height: 100px;
      opacity: 1;
      margin-top: 4px;
    }
    
    /* Override main margins */
    main {
      margin: 0 !important;
      padding-top: var(--space-3);
    }
    
    body {
      margin: 0;
      padding: 0;
    }
    
    /* Intro section styles */
    .intro-section {
      background: transparent;
      border-radius: 0;
      padding: 0 var(--space-3) var(--space-3) var(--space-3);
      margin-bottom: var(--space-2);
    }

    .intro-section h2 {
      color: var(--color-text);
      margin-bottom: 4px;
      font-size: 15px;
      font-weight: 600;
    }

    .intro-section p {
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin-bottom: var(--space-2);
      font-size: 14px;
      font-weight: 400;
    }

    .tenses-table {
      width: 100%;
      border-collapse: collapse;
      margin: 4px 0;
      font-size: 13px;
    }

    .tenses-table th,
    .tenses-table td {
      padding: var(--space-1) var(--space-2);
      text-align: left;
    }

    .tenses-table th {
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 600;
      font-size: 12px;
    }

    .tenses-table td {
      color: var(--color-text-secondary);
    }

    .tenses-table tr:hover {
      background: rgba(74, 144, 226, 0.02);
    }

    .tenses-table td.basic-tense {
      background: rgba(74, 144, 226, 0.03);
    }

    .tenses-table th.basic-tense-header {
      background: rgba(74, 144, 226, 0.08);
    }

    .tense-example {
      font-size: 12px;
      color: var(--color-text-tertiary);
      font-style: italic;
    }

    .tips-section {
      margin-top: 4px;
      padding-top: 0;
    }

    .tips-section h3 {
      color: var(--color-text);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tips-section p {
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .tips-section ul {
      margin-left: var(--space-3);
      margin-bottom: var(--space-2);
    }

    .tips-section li {
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-1);
      font-size: 13px;
    }

    .tips-section .highlight {
      color: var(--color-text);
      font-weight: 500;
    }

    .footnote {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: var(--space-1);
      padding-left: var(--space-2);
      font-style: italic;
      line-height: 1.4;
    }

    .footnote-ref {
      font-size: 0.85em;
      vertical-align: super;
      color: var(--color-accent);
    }

    .tips-section .clickable {
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--color-accent);
      text-underline-offset: 2px;
      transition: opacity 0.2s ease;
    }

    .tips-section .clickable:hover {
      opacity: 0.7;
    }

    .tips-section .keyword {
      color: var(--color-accent);
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: var(--color-accent);
      text-underline-offset: 2px;
      transition: opacity 0.2s ease, background-color 0.2s ease;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .tips-section .keyword:hover {
      opacity: 0.7;
    }

    .tips-section .keyword.active {
      background-color: var(--color-accent-light);
      font-weight: 600;
    }

    .tips-section .keyword-reveal {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  margin-top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      font-size: 12px;
      color: var(--color-text-secondary);
      font-style: italic;
      padding-left: var(--space-3);
      margin-bottom: 2px;
    }

    .tips-section .keyword-reveal.active {
      max-height: 200px;
      opacity: 1;
      margin-top: 2px;
    }

    .nine-types-toggle {
      transition: opacity 0.2s ease, background-color 0.2s ease;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .nine-types-toggle:hover {
      opacity: 0.7;
    }

    .nine-types-toggle.active {
      background-color: var(--color-accent-light);
      font-weight: 600;
    }

    .nine-types-reveal {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  margin-top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 0;
      font-size: 12px;
      color: var(--color-text-secondary);
      font-style: italic;
      padding-left: var(--space-3);
      margin-bottom: 4px;
    }

    .nine-types-reveal.active {
      max-height: 100px;
      opacity: 1;
      margin-top: 2px;
    }

    .word-highlight {
      background: rgba(250, 173, 20, 0.4);
      padding: 2px 4px;
      border-radius: 2px;
      animation: highlightFade 5s ease-out forwards;
    }

    @keyframes highlightFade {
      0% {
        background: rgba(250, 173, 20, 0.6);
      }
      50% {
        background: rgba(250, 173, 20, 0.4);
      }
      100% {
        background: transparent;
      }
    }

    @media (max-width: 768px) {
      .exercise-selector {
        flex-wrap: wrap;
        padding: 4px var(--space-2);
        gap: var(--space-2);
        margin: 0;
      }
      
      .header-left {
        width: 100%;
        margin-bottom: var(--space-1);
      }
      
      .header-select-container {
        width: 100%;
      }

      .exercise-selector select {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      
      .copyright-link {
        width: auto;
        text-align: left;
        margin-left: auto;
      }
    }
  </style>
</head>
<body>
  <div class="exercise-selector">
    <div class="header-left">
      <span class="header-label">The 9 Tenses<span class="separator">•⏰</span>九隻時式</span>
      <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
    </div>
    <div class="header-select-container">
      <select id="exercise-select">
        <option value="intro">Intro to Tenses | 時式介紹</option>
        <option value="questions3a">KFC & Food | 食物</option>
        <option value="questions4a">Morning | 早晨</option>
        <option value="questions5b">Home Routines | 屋企日常</option>
        <option value="questions3b">School Scenarios | 學校情境</option>
        <option value="questions4b">Driving | 揸車</option>

  <main>
    <div class="exercise-panel">
      <div id="exercise-info" class="exercise-info"></div>
      <div id="exercise-content">
        <!-- Content will be generated by JavaScript -->
      </div>
      <button id="toggle-answers-btn">Show Answers</button>
    </div>
  </main>

  <!-- Load all question files -->
  <script src="kfc_food.js"></script>
  <script src="morning.js"></script>
  <script src="home_routines.js"></script>
  <script src="school_scenarios.js"></script>
  <script src="driving.js"></script>
  <script src="daily_activities.js"></script>
  <script src="living_places.js"></script>
  <script src="daily_life.js"></script>
  <script src="conversations.js"></script>
  
  <!-- Ensure variables are accessible globally -->
  <script>
    // Make sure all question arrays are accessible
    // Const variables at top level should already be global, but ensure they're on window too
    if (typeof questions3a !== 'undefined') window.questions3a = questions3a;
    if (typeof questions4a !== 'undefined') window.questions4a = questions4a;
    if (typeof questions5b !== 'undefined') window.questions5b = questions5b;
    if (typeof questions3b !== 'undefined') window.questions3b = questions3b;
    if (typeof questions4b !== 'undefined') window.questions4b = questions4b;
    if (typeof questions4c !== 'undefined') window.questions4c = questions4c;
    if (typeof questions5a !== 'undefined') window.questions5a = questions5a;
    if (typeof questions2 !== 'undefined') window.questions2 = questions2;
    if (typeof questions6a !== 'undefined') window.questions6a = questions6a;
  </script>

  <script>
    // Exercise configuration based on proposed sequence
    const exerciseSequence = [
      {
        id: 'questions3a',
        name: 'KFC & Food | 食物',
        description: 'All 9 Basic Tenses: Present/Past/Future Simple, Continuous, Perfect | 全部9種基本時式：現在/過去/將來 簡單式、進行式、完成式',
        tenses: 'Simple (Present/Past/Future), Continuous (Present/Past/Future), Perfect (Present/Past/Future)',
        tensesCantonese: '簡單式（現在/過去/將來）、進行式（現在/過去/將來）、完成式（現在/過去/將來）',
        context: 'Food & Eating | 食物同食嘢',
        questionsVar: 'questions3a',
        script: 'kfc_food.js'
      },
      {
        id: 'questions4a',
        name: 'Morning & School | 早晨同學校',
        description: 'Simple, Continuous, Perfect Tenses (Present-focused) | 簡單式、進行式、完成式（側重現在）',
        tenses: 'Present Simple, Present Continuous, Present Perfect, Past Simple, Future Simple',
        tensesCantonese: '現在簡單式、現在進行式、現在完成式、過去簡單式、將來簡單式',
        context: 'Morning routines, School, Daily activities | 早晨習慣、學校、日常活動',
        questionsVar: 'questions4a',
        script: 'morning.js'
      },
      {
        id: 'questions5b',
        name: 'Home Routines | 屋企日常',
        description: 'Imperative, Present Continuous, Present Perfect | 祈使句、現在進行式、現在完成式',
        tenses: 'Imperative, Present Continuous, Present Perfect',
        tensesCantonese: '祈使句、現在進行式、現在完成式',
        context: 'Home conversations, Daily chores | 屋企對話、日常家務',
        questionsVar: 'questions5b',
        script: 'home_routines.js'
      },
      {
        id: 'questions3b',
        name: 'School Scenarios | 學校情境',
        description: 'All Tenses in school context with multi-blank questions | 全部時式（學校情境，多個空格）',
        tenses: 'All tenses: Simple, Continuous, Perfect (Present/Past/Future)',
        tensesCantonese: '全部時式：簡單式、進行式、完成式（現在/過去/將來）',
        context: 'School, Teachers, Temperature checking | 學校、老師、檢查體溫',
        questionsVar: 'questions3b',
        script: 'school_scenarios.js'
      },
      {
        id: 'questions4b',
        name: 'Driving & News | 揸車同新聞',
        description: 'Perfect Tenses focus: Present Perfect, Past Perfect, Future Perfect | 完成式重點：現在完成式、過去完成式、將來完成式',
        tenses: 'All tenses with focus on Perfect: Present Perfect, Past Perfect, Future Perfect, Continuous forms',
        tensesCantonese: '全部時式，重點完成式：現在完成式、過去完成式、將來完成式、進行式',
        context: 'Driving, Watching news, Peppa Pig | 揸車、睇新聞、Peppa Pig',
        questionsVar: 'questions4b',
        script: 'driving.js'
      },
      {
        id: 'questions4c',
        name: 'Daily Activities | 日常活動',
        description: 'Complex Time relationships with "while" clauses | 複雜時間關係（「當...時候」）',
        tenses: 'All tenses with complex time clauses: Simple, Continuous, Perfect (all time frames)',
        tensesCantonese: '全部時式配複雜時間：簡單式、進行式、完成式（全部時間）',
        context: 'Brushing teeth, Piano practice | 刷牙、練琴',
        questionsVar: 'questions4c',
        script: 'daily_activities.js'
      },
      {
        id: 'questions5a',
        name: 'Living Places | 居住地方',
        description: 'Stative Verbs: "live" in all tenses | 狀態動詞：「住」全部時式',
        tenses: 'All tenses with stative verb "live": Simple, Continuous, Perfect (Present/Past/Future)',
        tensesCantonese: '狀態動詞「住」全部時式：簡單式、進行式、完成式（現在/過去/將來）',
        context: 'Living situations, Moving | 居住情況、搬屋',
        questionsVar: 'questions5a',
        script: 'living_places.js'
      },
      {
        id: 'questions2',
        name: 'Daily Life | 日常生活',
        description: 'Comprehensive Review: All tenses and aspects | 綜合複習：全部時式同方面',
        tenses: 'All tenses: Simple, Continuous, Perfect (Present/Past/Future) - comprehensive',
        tensesCantonese: '全部時式：簡單式、進行式、完成式（現在/過去/將來）- 綜合',
        context: 'Daily life, Various activities | 日常生活、各種活動',
        questionsVar: 'questions2',
        script: 'daily_life.js'
      },
      {
        id: 'questions6a',
        name: 'Conversations | 對話',
        description: 'Question Forms: Have/Had/Has in questions | 疑問句形式：Have/Had/Has 疑問句',
        tenses: 'Question forms with Perfect tenses: Have/Had/Has + past participle',
        tensesCantonese: '完成式疑問句：Have/Had/Has + 過去分詞',
        context: 'Library, KFC, Promises, School | 圖書館、KFC、承諾、學校',
        questionsVar: 'questions6a',
        script: 'conversations.js'
      }
    ];

    let currentExerciseIndex = 0;
    let currentQuestions = [];
    let answersShown = false;

    // Friendly share slugs → exercise ids (also accepts the raw ids)
    const exerciseShareAliases = {
      intro: 'intro',
      kfc: 'questions3a',
      questions3a: 'questions3a',
      morning: 'questions4a',
      questions4a: 'questions4a',
      home: 'questions5b',
      questions5b: 'questions5b',
      school: 'questions3b',
      questions3b: 'questions3b',
      driving: 'questions4b',
      questions4b: 'questions4b',
      daily: 'questions4c',
      daily_activities: 'questions4c',
      questions4c: 'questions4c',
      living: 'questions5a',
      questions5a: 'questions5a',
      daily_life: 'questions2',
      questions2: 'questions2',
      conversations: 'questions6a',
      questions6a: 'questions6a'
    };

    const exerciseShareSlugs = {
      intro: 'intro',
      questions3a: 'kfc',
      questions4a: 'morning',
      questions5b: 'home',
      questions3b: 'school',
      questions4b: 'driving',
      questions4c: 'daily',
      questions5a: 'living',
      questions2: 'daily_life',
      questions6a: 'conversations'
    };

    function updateExerciseUrl(exerciseId) {
      const slug = exerciseShareSlugs[exerciseId] || exerciseId;
      const url = new URL(location.href);
      url.searchParams.set('exercise', slug);
      history.replaceState(null, '', url);
    }

    function resolveExerciseFromUrl() {
      const params = new URLSearchParams(location.search);
      const raw = (params.get('exercise') || '').trim().toLowerCase();
      if (!raw) return null;
      return exerciseShareAliases[raw] || null;
    }

    // Check if all question arrays are loaded
    function checkAllLoaded() {
      return exerciseSequence.every(ex => {
        // Check window scope (should be set by the bridge script)
        return typeof window[ex.questionsVar] !== 'undefined' && Array.isArray(window[ex.questionsVar]);
      });
    }

    // Initialize the app - scripts are loaded synchronously above
    function initializeApp() {
      // Wait for all scripts to be available
      let attempts = 0;
      const maxAttempts = 50; // 5 seconds max wait
      
      function tryInitialize() {
        attempts++;
        
        if (checkAllLoaded()) {
          // All loaded, proceed with initialization
          const select = document.getElementById('exercise-select');
          select.addEventListener('change', function() {
            const selectedId = select.value;
            if (selectedId === 'intro') {
              showIntro();
            } else {
              const index = exerciseSequence.findIndex(ex => ex.id === selectedId);
              if (index !== -1) {
                currentExerciseIndex = index;
                loadExercise(index);
              }
            }
          });

          // Open shared exercise from ?exercise=slug, otherwise intro
          const fromUrl = resolveExerciseFromUrl();
          if (fromUrl === 'intro' || !fromUrl) {
            showIntro();
          } else {
            const index = exerciseSequence.findIndex(ex => ex.id === fromUrl);
            if (index !== -1) {
              loadExercise(index);
            } else {
              showIntro();
            }
          }
        } else if (attempts < maxAttempts) {
          // Not all loaded yet, wait a bit more
          setTimeout(tryInitialize, 100);
        } else {
          // Timeout - show error
          const missing = exerciseSequence.filter(ex => {
            return typeof window[ex.questionsVar] === 'undefined' || !Array.isArray(window[ex.questionsVar]);
          });
          console.error('Missing question arrays after timeout:', missing.map(m => m.questionsVar));
          console.log('Available variables:', Object.keys(window).filter(k => k.startsWith('questions')));
          document.getElementById('exercise-content').innerHTML = 
            '<p style="color: var(--color-error); padding: var(--space-3);">Some exercises failed to load. Please refresh the page.</p>';
        }
      }
      
      tryInitialize();
    }

    // Initialize when DOM is ready and scripts have loaded
    // Scripts are loaded synchronously before this script runs, so they should be available
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      // DOM already loaded, wait a moment for scripts to execute
      setTimeout(initializeApp, 50);
    }

    function loadExercise(index) {
      if (index < 0 || index >= exerciseSequence.length) return;

      currentExerciseIndex = index;
      const exercise = exerciseSequence[index];
      
      // Update selector
      document.getElementById('exercise-select').value = exercise.id;
      updateExerciseUrl(exercise.id);
      
      // Show toggle answers button
      const toggleBtn = document.getElementById('toggle-answers-btn');
      if (toggleBtn) {
        toggleBtn.style.display = '';
      }
      
      // Show and update info panel
      const infoPanel = document.getElementById('exercise-info');
      if (infoPanel) {
        infoPanel.style.display = '';
        infoPanel.innerHTML = `
        <div style="font-size: 12px; line-height: 1.5;">
          <div class="step-header" style="margin-bottom: 6px;">第一步：先用 Present Tense決定3式 (<span class="keyword" data-keyword="simple">Simple</span>, <span class="keyword" data-keyword="continuous">Continuous</span>, <span class="keyword" data-keyword="perfect">Perfect</span>)</div>
          <div class="keyword-reveal" id="reveal-simple">Simple就咁用動詞，冇特別狀態。例如：eat（食）、go（去）、study（讀書）</div>
          <div class="keyword-reveal" id="reveal-continuous">Continuous動作進行緊，有「緊」字感覺。例如：am eating（食緊）、is going（去緊）、are studying（讀緊書）</div>
          <div class="keyword-reveal" id="reveal-perfect">Perfect有完成感覺，有助語詞如「咗、完、哂、夠、齊、盡、好、掂」。例如：have eaten（食咗/食完）、have finished（做齊/做盡/做好）、have done（做掂）</div>
          <div class="step-header" style="margin-bottom: 6px;">第二步：決定時間 (<span class="keyword" data-keyword="present">Present</span>, <span class="keyword" data-keyword="past">Past</span>, <span class="keyword" data-keyword="future">Future</span>)</div>
          <div class="keyword-reveal" id="reveal-present">Present保持原樣（I eat / I am eating / I have eaten）</div>
          <div class="keyword-reveal" id="reveal-past">Past轉動詞過去式（I ate / I was eating / I had eaten）</div>
          <div class="keyword-reveal" id="reveal-future">Future前面加 will（I will eat / I will be eating / I will have eaten）。will 係 modal verb（助動詞），所以後面嘅動詞要用原形。am 變返 be（I will be eating）。</div>
        </div>
      `;
        // Setup keyword click handlers
        setupKeywordToggles();
      }

      // Load questions from window (set by bridge script)
      if (typeof window[exercise.questionsVar] !== 'undefined' && Array.isArray(window[exercise.questionsVar])) {
        currentQuestions = window[exercise.questionsVar];
        generateExercise();
        setupEventListeners();
        updateProgress();
        updateNavButtons();
      } else {
        console.error(`Questions array '${exercise.questionsVar}' not found on window!`);
        document.getElementById('exercise-content').innerHTML = 
          '<p style="color: var(--color-error); padding: var(--space-3);">Questions not loaded. Please refresh the page.</p>';
      }
    }

    function previousExercise() {
      if (currentExerciseIndex > 0) {
        loadExercise(currentExerciseIndex - 1);
      }
    }

    function nextExercise() {
      if (currentExerciseIndex < exerciseSequence.length - 1) {
        loadExercise(currentExerciseIndex + 1);
      }
    }

    function updateNavButtons() {
      // Navigation buttons removed - no action needed
    }

    function updateProgress() {
      // Progress indicator removed - no action needed
    }

    function generateExercise() {
      const content = document.getElementById('exercise-content');
      if (!content) return;
      
      // Reset answers shown state
      answersShown = false;
      const toggleBtn = document.getElementById('toggle-answers-btn');
      if (toggleBtn) {
        toggleBtn.textContent = 'Show Answers';
      }
      
      // Group questions by section
      const sections = {};
      currentQuestions.forEach((question, index) => {
        const section = question.section || 'General';
        if (!sections[section]) {
          sections[section] = [];
        }
        sections[section].push({...question, originalIndex: index});
      });
      
      let html = '';
      
      // Generate sections
      Object.keys(sections).forEach(sectionName => {
        if (sectionName && sectionName !== 'General') {
          html += `<div class="section">`;
        }
        
        sections[sectionName].forEach(question => {
          html += generateQuestionHTML(question);
        });
        
        if (sectionName && sectionName !== 'General') {
          html += `</div>`;
        }
      });
      
      content.innerHTML = html;
    }

    function generateQuestionHTML(question) {
      const questionId = `q${question.originalIndex}`;
      let html = `<div class="sentence">`;
      
      if (question.cantonese) {
        html += `<div class="cantonese">${question.cantonese}</div>`;
      }
      
      // Handle multiple blanks
      const parts = question.english.split('_____');
      const isMultipleAnswers = Array.isArray(question.answer);
      
      for (let i = 0; i < parts.length - 1; i++) {
        html += parts[i];
        
        // Create dropdown for each blank
        const blankId = `${questionId}_${i}`;
        const answer = isMultipleAnswers ? question.answer[i] : question.answer;
        
        html += `<select class="answer-dropdown" data-question-id="${blankId}" data-answer="${answer}">`;
        html += `<option value="">...</option>`;
        
        if (question.options) {
          question.options.forEach(option => {
            html += `<option value="${option}">${option}</option>`;
          });
        }
        
        html += `</select>`;
      }
      
      // Add the last part if it exists
      if (parts[parts.length - 1]) {
        html += parts[parts.length - 1];
      }
      
      html += `</div>`;
      return html;
    }

    function setupEventListeners() {
      // Toggle answers button
      const toggleBtn = document.getElementById('toggle-answers-btn');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', toggleAnswers);
      }
      
      // Dropdown change events
      const dropdowns = document.querySelectorAll('.answer-dropdown');
      dropdowns.forEach(dropdown => {
        dropdown.addEventListener('change', handleDropdownChange);
      });
    }

    function setupKeywordToggles() {
      const keywords = document.querySelectorAll('.exercise-info .keyword');
      const reveals = document.querySelectorAll('.exercise-info .keyword-reveal');
      
      keywords.forEach(keyword => {
        keyword.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          const keywordType = this.getAttribute('data-keyword');
          const targetReveal = document.getElementById(`reveal-${keywordType}`);
          const wasActive = targetReveal && targetReveal.classList.contains('active');
          
          // Remove active class from all keywords in exercise-info
          document.querySelectorAll('.exercise-info .keyword').forEach(kw => kw.classList.remove('active'));
          
          // Close all reveals in exercise-info first
          document.querySelectorAll('.exercise-info .keyword-reveal').forEach(reveal => {
            reveal.classList.remove('active');
          });
          
          // Toggle the clicked one
          if (targetReveal && !wasActive) {
            targetReveal.classList.add('active');
            this.classList.add('active');
          }
        });
      });
    }

    function setupIntroKeywordToggles() {
      const keywords = document.querySelectorAll('.intro-section .keyword, .tips-section .keyword');
      const reveals = document.querySelectorAll('.tips-section .keyword-reveal');
      
      keywords.forEach(keyword => {
        keyword.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          const keywordType = this.getAttribute('data-keyword');
          const targetReveal = document.getElementById(`intro-reveal-${keywordType}`);
          const wasActive = targetReveal && targetReveal.classList.contains('active');
          
          // Remove active class from all keywords in intro section
          document.querySelectorAll('.intro-section .keyword, .tips-section .keyword').forEach(kw => kw.classList.remove('active'));
          
          // Close all reveals in tips-section first
          document.querySelectorAll('.tips-section .keyword-reveal').forEach(reveal => {
            reveal.classList.remove('active');
          });
          
          // Close nine-types reveal
          const nineTypesReveal = document.getElementById('nine-types-reveal');
          const nineTypesToggle = document.querySelector('.nine-types-toggle');
          if (nineTypesReveal) nineTypesReveal.classList.remove('active');
          if (nineTypesToggle) nineTypesToggle.classList.remove('active');
          
          // Toggle the clicked one
          if (targetReveal && !wasActive) {
            targetReveal.classList.add('active');
            this.classList.add('active');
          }
        });
      });

      // Handle nine-types toggle
      const nineTypesToggle = document.querySelector('.nine-types-toggle');
      const nineTypesReveal = document.getElementById('nine-types-reveal');
      
      if (nineTypesToggle && nineTypesReveal) {
        nineTypesToggle.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          
          const wasActive = nineTypesReveal.classList.contains('active');
          
          // Remove active class from all keywords in intro section
          document.querySelectorAll('.intro-section .keyword, .tips-section .keyword').forEach(kw => kw.classList.remove('active'));
          
          // Close all reveals in tips-section
          document.querySelectorAll('.tips-section .keyword-reveal').forEach(reveal => {
            reveal.classList.remove('active');
          });
          
          // Toggle nine-types reveal
          if (!wasActive) {
            nineTypesReveal.classList.add('active');
            nineTypesToggle.classList.add('active');
          } else {
            nineTypesReveal.classList.remove('active');
            nineTypesToggle.classList.remove('active');
          }
        });
      }
    }

    function handleDropdownChange(e) {
      const dropdown = e.target;
      const selectedValue = dropdown.value;
      const correctAnswer = dropdown.dataset.answer;
      
      // Remove previous feedback classes
      dropdown.classList.remove('correct', 'incorrect');
      
      if (selectedValue === '') {
        // No selection made
        return;
      }
      
      // Check if correct and apply styling
      if (selectedValue === correctAnswer) {
        dropdown.classList.add('correct');
      } else {
        dropdown.classList.add('incorrect');
      }
    }

    function toggleAnswers() {
      const dropdowns = document.querySelectorAll('.answer-dropdown');
      const btn = document.getElementById('toggle-answers-btn');
      
      if (!answersShown) {
        // Show answers
        dropdowns.forEach(dropdown => {
          const correctAnswer = dropdown.dataset.answer;
          if (correctAnswer) {
            dropdown.value = correctAnswer;
            dropdown.classList.add('correct');
          }
        });
        btn.textContent = 'Hide Answers';
        answersShown = true;
      } else {
        // Hide answers
        dropdowns.forEach(dropdown => {
          dropdown.value = '';
          dropdown.classList.remove('correct', 'incorrect');
        });
        btn.textContent = 'Show Answers';
        answersShown = false;
      }
    }

            </thead>

            <div class="keyword-reveal" id="intro-reveal-simple">Simple：就咁用動詞，冇特別狀態。例如：<strong>eat</strong>（食）、<strong>go</strong>（去）、<strong>study</strong>（讀書）</div>

            <p style="margin-top: var(--space-2); margin-bottom: var(--space-2);">第二步：決定要唔要轉Past或Future (<span class="keyword" data-keyword="present">Present</span>, <span class="keyword" data-keyword="past">Past</span>, <span class="keyword" data-keyword="future">Future</span>)</p>

    // Initialize table highlighting functionality
    function initializeTableHighlights() {
      // Store original table content
      const table = document.querySelector('.tenses-table');
      if (table) {
        const cells = table.querySelectorAll('td');
        cells.forEach(cell => {
          cell.dataset.original = cell.innerHTML;
        });
      }
    }

    // Reset table to original state (remove all highlights)
    function resetTableHighlights() {
      const table = document.querySelector('.tenses-table');
      if (!table) return;
      
      const cells = table.querySelectorAll('td');
      cells.forEach((cell, index) => {
        if (!cell.dataset.original) {
          cell.dataset.original = cell.innerHTML;
        }
        // Remove existing highlights and restore original
        let text = cell.dataset.original;
        text = text.replace(/<span class="word-highlight">(.*?)<\/span>/g, '$1');
        cell.innerHTML = text;
      });
    }

    // Highlight Continuous tense words (緊)
    function highlightContinuous() {
      resetTableHighlights();
      const table = document.querySelector('.tenses-table');
      if (!table) return;
      
      const cells = table.querySelectorAll('td');
      cells.forEach(cell => {
        let text = cell.innerHTML;
        // Highlight 緊 in Cantonese examples
        text = text.replace(/(緊)/g, '<span class="word-highlight">$1</span>');
        cell.innerHTML = text;
      });
    }

    // Highlight Perfect tense words (咗、完、哂、夠、齊、盡、好、掂)
    function highlightPerfect() {
      resetTableHighlights();
      const table = document.querySelector('.tenses-table');
      if (!table) return;
      
      const cells = table.querySelectorAll('td');
      const perfectWords = ['咗', '完', '哂', '夠', '齊', '盡', '好', '掂'];
      
      cells.forEach(cell => {
        let text = cell.innerHTML;
        perfectWords.forEach(word => {
          const regex = new RegExp(`(${word})`, 'g');
          text = text.replace(regex, '<span class="word-highlight">$1</span>');
        });
        cell.innerHTML = text;
      });
    }

    // Highlight Past tense verbs (ate, was, had)
    function highlightPast() {
      resetTableHighlights();
      const table = document.querySelector('.tenses-table');
      if (!table) return;
      
      const cells = table.querySelectorAll('td');
      const pastVerbs = ['ate', 'was', 'had'];
      
      cells.forEach(cell => {
        let text = cell.innerHTML;
        pastVerbs.forEach(verb => {
          // Match whole word only, case insensitive
          const regex = new RegExp(`\\b(${verb})\\b`, 'gi');
          text = text.replace(regex, '<span class="word-highlight">$1</span>');
        });
        cell.innerHTML = text;
      });
    }

    // Highlight Future tense (will)
    function highlightFuture() {
      resetTableHighlights();
      const table = document.querySelector('.tenses-table');
      if (!table) return;
      
      const cells = table.querySelectorAll('td');
      cells.forEach(cell => {
        let text = cell.innerHTML;
        // Match "will" as whole word, case insensitive
        const regex = /\b(will)\b/gi;
        text = text.replace(regex, '<span class="word-highlight">$1</span>');
        cell.innerHTML = text;
      });
    }
  </script>
