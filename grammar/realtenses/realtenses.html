<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Tenses - Fill in the Blanks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../main.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 40px;
      --space-6: 48px;
      --color-bg: #ffffff;
      --color-surface: #f8f8f8;
      --color-text: #000000;
      --color-text-secondary: #666666;
      --color-text-tertiary: #999999;
      --color-border: #e0e0e0;
      --hat-white: #b0b0b0;
      --hat-red: #ff5252;
      --hat-black: #3a4a4b;
      --hat-yellow: #ffcc00;
      --hat-green: #4caf50;
      --hat-blue: #42a5f5;
      --max-width: 1200px;
    }

    body {
      color: var(--color-text);
      line-height: 1.3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 16px;
      font-family: Lexend, "LXGW WenKai TC", -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
    }

    .exercise-selector {
      background: transparent;
      color: var(--color-text);
      padding: 4px var(--space-4) 4px var(--space-2);
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      gap: var(--space-2);
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      border-bottom: 1px solid var(--color-border);
    }

    .header-select-container {
      flex: 1;
      position: relative;
    }

    .header-left {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      margin-right: var(--space-1);
    }

    .header-label {
      font-size: 14px;
      color: var(--color-text);
      font-weight: 500;
      white-space: nowrap;
      letter-spacing: 0.02em;
      padding: 2px 0;
      line-height: 1.2;
    }

    .header-label .separator {
      color: var(--color-text-secondary);
      margin: 0 2px;
    }

    .header-copyright {
      flex: 0 0 auto;
      font-size: 9px;
      color: var(--color-text-secondary);
      font-weight: 400;
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 1px;
    }

    .header-copyright a {
      text-decoration: none;
      color: inherit;
    }

    .header-copyright a:hover {
      margin: 0;
    }

    .header-copyright {
      flex: 0 0 auto;
      font-size: 9px;
      color: var(--color-text-secondary);
      font-weight: 400;
      white-space: nowrap;
      line-height: 1.2;
      margin-top: 1px;
    }

    .header-copyright a {
      text-decoration: none;
      color: inherit;
    }

    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      width: 100%;
      padding: var(--space-2) var(--space-4) var(--space-5) var(--space-4);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    #exercise-list {
      margin-top: 0;
    }

    .exercise-card {
      border: 1px solid var(--color-border);
      border-radius: 0;
      padding: var(--space-3);
      margin-bottom: var(--space-3);
      background: var(--color-bg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .exercise-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-2);
    }

    .exercise-title {
      font-size: 14px;
      font-weight: 600;
    }

    .source-link {
      font-size: 12px;
      color: var(--color-text);
      text-decoration: none;
      border-bottom: 1px solid var(--color-text);
      width: fit-content;
      transition: opacity 0.2s ease;
      word-break: break-all;
    }

    .source-link:hover {
      opacity: 0.6;
    }

    .exercise-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }

    .blank-input,
    .blank-select {
      display: inline-block;
      min-width: 6ch;
      width: 8ch;
      border: 1px solid var(--color-border);
      padding: 4px 6px;
      margin: 0 2px;
      border-radius: 0;
      font-size: 14px;
      font-family: inherit;
      background: var(--color-bg);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .blank-select option {
      white-space: nowrap;
      padding-right: 16px;
    }

    .blank-input:focus,
    .blank-select:focus {
      outline: none;
      border-color: var(--color-text);
      background: var(--color-bg);
    }

    .blank-input.correct,
    .blank-select.correct {
      border-color: rgba(76, 175, 80, 0.7);
      background: rgba(76, 175, 80, 0.12);
    }

    .blank-input.incorrect,
    .blank-select.incorrect {
      border-color: rgba(244, 67, 54, 0.7);
      background: rgba(244, 67, 54, 0.12);
    }

    .exercise-selector select {
      width: auto;
      max-width: 420px;
      min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 0;
      background-color: var(--color-bg);
      font-size: 14px;
      font-family: inherit;
      color: var(--color-text);
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .exercise-selector select:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
    }

    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
        padding: 4px var(--space-2);
      }

      .header-info {
        width: 100%;
      }

      main {
        padding: var(--space-3) var(--space-2) var(--space-4);
      }
    }
  </style>
</head>
<body>
  <div class="exercise-selector" style="padding: 4px 32px 4px 16px;">
    <div class="header-left">
      <span class="header-label">Real Tenses<span class="separator">•⏱️</span>真實時式</span>
      <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
    </div>
    <div class="header-select-container">
      <select id="exercise-select"></select>
    </div>
  </div>
  <br><br>
  <main>
    <div class="container">
      <div id="exercise-list"></div>
    </div>
  </main>

  <script src="realtenses.js"></script>
  <script>
    const exercises = Array.isArray(window.realTensesExercises)
      ? window.realTensesExercises
      : [];

    const measureSpan = document.createElement("span");
    measureSpan.style.position = "absolute";
    measureSpan.style.visibility = "hidden";
    measureSpan.style.whiteSpace = "pre";
    document.body.appendChild(measureSpan);

    function normalizeAnswer(value) {
      return value.trim().toLowerCase();
    }

    function measureSelectWidth(select, text) {
      const style = window.getComputedStyle(select);
      measureSpan.style.font = style.font;
      measureSpan.textContent = text || "";
      const baseWidth = measureSpan.getBoundingClientRect().width;
      return Math.ceil(baseWidth + 32);
    }

    function setSelectWidth(select) {
      const selected = select.options[select.selectedIndex];
      const displayText = selected ? selected.textContent : "";
      const width = Math.max(70, measureSelectWidth(select, displayText));
      select.style.width = `${width}px`;
    }

    function setOptionTextMode(select, mode) {
      Array.from(select.options).forEach((option) => {
        if (option.value === "") {
          option.textContent = "";
          return;
        }
        const label = option.dataset.label || option.textContent;
        const value = option.dataset.value || option.value;
        if (mode === "label") {
          const tenseName = label.split("—")[0].trim();
          option.textContent = `${value} (${tenseName})`;
        } else {
          option.textContent = value;
        }
      });
      setSelectWidth(select);
    }

    function appendTextWithBreaks(container, text) {
      const lines = text.split("\n");
      lines.forEach((line, lineIndex) => {
        container.appendChild(document.createTextNode(line));
        if (lineIndex < lines.length - 1) {
          container.appendChild(document.createElement("br"));
        }
      });
    }

    function buildExercise(exercise, index) {
      const card = document.createElement("div");
      card.className = "exercise-card";

      const header = document.createElement("div");
      header.className = "exercise-header";

      if (exercise.link) {
        const link = document.createElement("a");
        link.className = "source-link";
        link.href = exercise.link;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = exercise.link;
        header.appendChild(link);
      }

      card.appendChild(header);

      const text = document.createElement("div");
      text.className = "exercise-text";

      const parts = exercise.text.split("_____");
      const blanksNeeded = parts.length - 1;

      const useDropdowns = Array.isArray(exercise.choices);

      parts.forEach((part, i) => {
        appendTextWithBreaks(text, part);
        if (i < blanksNeeded) {
          if (useDropdowns) {
            const select = document.createElement("select");
            select.className = "blank-select";
            select.setAttribute("data-answer", exercise.answers[i] || "");
            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "";
            select.appendChild(placeholder);
            const options = exercise.choices[i] || [];
            options.forEach((optionItem) => {
              const option = document.createElement("option");
              if (typeof optionItem === "string") {
                option.value = optionItem;
                option.textContent = optionItem;
                option.dataset.label = optionItem;
                option.dataset.value = optionItem;
              } else {
                option.value = optionItem.value;
                option.textContent = optionItem.label;
                option.dataset.label = optionItem.label;
                option.dataset.value = optionItem.value;
              }
              select.appendChild(option);
            });
            select.addEventListener("change", () => {
              const answer = normalizeAnswer(select.dataset.answer || "");
              const value = normalizeAnswer(select.value || "");
              select.classList.remove("correct", "incorrect");
              if (!value) {
                return;
              }
              if (value === answer) {
                select.classList.add("correct");
              } else {
                select.classList.add("incorrect");
              }
              setOptionTextMode(select, "value");
            });
            select.addEventListener("focus", () => setOptionTextMode(select, "label"));
            select.addEventListener("blur", () => setOptionTextMode(select, "value"));
            setOptionTextMode(select, "value");
            text.appendChild(select);
          } else {
            const input = document.createElement("input");
            input.type = "text";
            input.className = "blank-input";
            input.setAttribute("data-answer", exercise.answers[i] || "");
            input.addEventListener("input", () => {
              const answer = normalizeAnswer(input.dataset.answer || "");
              const value = normalizeAnswer(input.value || "");
              input.classList.remove("correct", "incorrect");
              if (!value) {
                return;
              }
              if (value === answer) {
                input.classList.add("correct");
              } else {
                input.classList.add("incorrect");
              }
            });
            text.appendChild(input);
          }
        }
      });

      card.appendChild(text);

      return card;
    }

    function renderExercises() {
      const list = document.getElementById("exercise-list");
      list.innerHTML = "";

      const selected = document.getElementById("exercise-select")?.value;
      const toRender = selected
        ? exercises.filter((exercise) => String(exercise.id) === selected)
        : exercises;

      toRender.forEach((exercise, index) => {
        list.appendChild(buildExercise(exercise, index));
      });
    }

    function initExerciseSelect() {
      const select = document.getElementById("exercise-select");
      select.innerHTML = "";
      exercises.forEach((exercise) => {
        const option = document.createElement("option");
        option.value = String(exercise.id);
        option.textContent = exercise.title || `Exercise ${exercise.id}`;
        select.appendChild(option);
      });

      if (exercises.length > 0) {
        select.value = String(exercises[0].id);
      }

      select.addEventListener("change", renderExercises);
    }

    initExerciseSelect();
    renderExercises();
  </script>
</body>
</html>
