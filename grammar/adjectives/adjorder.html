<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjective Order Practice</title>
    <link rel="stylesheet" href="../../main.css">
    <style>
        :root {
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-surface: #f6f6f6;
            --color-text: #111111;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
            --color-success: #2e7d32;
            --color-error: #c62828;
            --color-warning: #f9a825;
            --max-width: 980px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }

        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-label {
            font-size: 14px;
            font-weight: 600;
        }

        .header-subtitle {
            font-size: 11px;
            color: var(--color-text-secondary);
        }

        main {
            flex: 1;
            padding: var(--space-3) var(--space-4);
        }

        .content-wrap {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: var(--space-2);
        }

        .rule {
            font-size: 0.98rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-3);
        }

        .category-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: var(--space-2);
        }

        .category-chip {
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            padding: 2px 8px;
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        .level-bar {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            align-items: center;
            margin-bottom: var(--space-3);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .level-bar label {
            font-weight: 600;
            color: var(--color-text);
        }

        .level-bar select {
            min-width: 200px;
        }

        .level-info {
            display: none;
        }

        .sentence-card {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: var(--space-2);
            margin-bottom: var(--space-2);
        }

        .sentence-line {
            font-size: 1rem;
            line-height: 1.6;
        }

        .blank-slot {
            display: inline-block;
            min-width: 120px;
            border-bottom: 1px solid var(--color-border);
            padding: 2px 6px;
            margin: 0 4px;
            text-align: center;
            cursor: pointer;
            background: var(--color-bg);
        }

        .blank-slot.active {
            outline: 2px solid rgba(74, 144, 226, 0.6);
            border-bottom-color: rgba(74, 144, 226, 0.6);
        }


        .sentence-card.correct {
            border-color: rgba(46, 125, 50, 0.5);
            background: rgba(46, 125, 50, 0.08);
        }

        .sentence-card.incorrect {
            border-color: rgba(198, 40, 40, 0.5);
            background: rgba(198, 40, 40, 0.08);
        }

        .sentence-card.incomplete {
            border-color: rgba(249, 168, 37, 0.5);
            background: rgba(249, 168, 37, 0.08);
        }

        .hint-line {
            margin-top: var(--space-1);
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            display: none;
        }

        .sentence-card.incorrect .hint-line {
            display: block;
        }

        .question-status {
            display: none;
        }

        .keyword-panel {
            margin-top: var(--space-2);
        }

        .keyword-title {
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: var(--color-text-secondary);
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .keyword-btn {
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            padding: 6px 10px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .keyword-btn:hover {
            background: var(--color-surface);
        }

        .nav-bar {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-3);
        }

        .nav-bar button {
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .nav-bar button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Adjective Order Practice</div>
        </div>
    </header>
    <main>
        <div class="content-wrap">
            <div class="category-legend" id="categoryLegend"></div>
            <div class="level-bar">
                <select id="levelSelect"></select>
            </div>
            <div class="level-info" id="levelInfo"></div>
            <div class="question-status" id="questionStatus"></div>
            <div id="questionCard" class="sentence-card"></div>
            <div class="keyword-panel">
                <div class="keyword-title">Keywords</div>
                <div id="keywordList" class="keyword-list"></div>
            </div>
            <div class="nav-bar">
                <button type="button" id="prevBtn">Previous</button>
                <button type="button" id="nextBtn">Next</button>
            </div>
        </div>
    </main>
    <script src="adjorder.js" defer></script>
</body>
</html>
