<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proofread Practice</title>
    <link rel="stylesheet" href="../../main.css">
    <style>
        :root {
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-surface: #f6f6f6;
            --color-text: #111111;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
            --max-width: 960px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }

        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dataset-select {
            padding: 6px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            font-size: 0.95rem;
        }

        .header-label {
            font-size: 14px;
            font-weight: 600;
        }

        .header-copyright {
            font-size: 10px;
            color: var(--color-text-secondary);
        }

        .header-copyright a {
            color: inherit;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: var(--space-3) var(--space-4);
        }

        .content-wrap {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: var(--space-3);
        }

        .exercise-card {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .prompt {
            font-size: 1rem;
            margin-bottom: var(--space-2);
        }

        .prompt-blank {
            display: inline-block;
            min-width: 80px;
            min-height: 24px;
            border: 1px solid var(--color-border);
            padding: 2px 6px;
            margin: 0 2px;
            background: var(--color-bg);
            vertical-align: baseline;
        }

        .choices {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .choice-button {
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .choice-button:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }

        .choice-button.correct {
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .choice-button.wrong {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.5);
        }

        .reason {
            margin-top: var(--space-2);
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .reason span {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Proofread</div>
            <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
        </div>
        <div class="header-controls">
            <label for="datasetSelect">Exercise</label>
            <select id="datasetSelect" class="dataset-select"></select>
        </div>
    </header>

    <main>
        <div class="content-wrap">
            <div id="exerciseList"></div>
        </div>
    </main>

    <script>
        const exerciseList = document.getElementById('exerciseList');
        const datasetSelect = document.getElementById('datasetSelect');

        const datasets = [
            { label: 'Barbecue', src: 'barbeque.js' },
            { label: 'Lost and Found', src: 'lost_and_found.js' },
            { label: 'Raina', src: 'raina.js' },
            { label: 'Labubu', src: 'labubu.js' },
            { label: 'Orchestra', src: 'orchestra.js' },
            { label: 'Birthday Letter', src: 'birthday_picnic.js' },
            { label: 'Invitation Letter', src: 'invitation_letter.js' },
            { label: 'Apology Letter', src: 'apology_letter.js' },
            { label: 'Story Writing', src: 'storywriting.js' },
            { label: 'Night Market', src: 'night_market.js' },
            { label: 'Hiking Story', src: 'hiking_story.js' },
            { label: 'Lunar New Year', src: 'lunar_new_year.js' },
            { label: 'Milky Way', src: 'milky_way.js' }
        ];

        function renderExercises() {
            if (!window.GeneralProofread) {
                exerciseList.innerHTML = '<p>Unable to load exercises.</p>';
                return;
            }

            exerciseList.innerHTML = '';
            window.GeneralProofread.forEach((item) => {
                const card = document.createElement('section');
                card.className = 'exercise-card';

                const prompt = document.createElement('div');
                prompt.className = 'prompt';
                const safePrompt = item.prompt.replace(/[&<>"]/g, (char) => {
                    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
                    return map[char] || char;
                });
                prompt.innerHTML = safePrompt.replace('____', '<span class="prompt-blank">&nbsp;</span>');

                const choices = document.createElement('div');
                choices.className = 'choices';

                const reason = document.createElement('div');
                reason.className = 'reason';
                reason.innerHTML = `
                    <span>${item.reason}</span>
                    <span>${item.creason || ''}</span>
                `;
                reason.style.display = 'none';

                item.choices.forEach((choice) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'choice-button';
                    button.textContent = choice;
                    button.addEventListener('click', () => {
                        choices.querySelectorAll('.choice-button').forEach((btn) => {
                            btn.classList.remove('correct', 'wrong');
                        });
                        const isCorrect = choice === item.answer;
                        button.classList.add(isCorrect ? 'correct' : 'wrong');
                        reason.style.display = isCorrect ? 'block' : 'none';
                    });
                    choices.appendChild(button);
                });

                card.appendChild(prompt);
                card.appendChild(choices);
                card.appendChild(reason);
                exerciseList.appendChild(card);
            });
        }

        function loadDataset(src) {
            return new Promise((resolve, reject) => {
                const existingScript = document.getElementById('datasetScript');
                if (existingScript) {
                    existingScript.remove();
                }
                window.GeneralProofread = null;
                const script = document.createElement('script');
                script.id = 'datasetScript';
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject();
                document.body.appendChild(script);
            });
        }

        function refreshExercises(src) {
            exerciseList.innerHTML = '';
            loadDataset(src)
                .then(renderExercises)
                .catch(() => {
                    exerciseList.innerHTML = '<p>Unable to load exercises.</p>';
                });
        }

        datasets.forEach((dataset) => {
            const option = document.createElement('option');
            option.value = dataset.src;
            option.textContent = dataset.label;
            datasetSelect.appendChild(option);
        });

        datasetSelect.addEventListener('change', (event) => {
            refreshExercises(event.target.value);
        });

        datasetSelect.value = datasets[0].src;
        refreshExercises(datasets[0].src);
    </script>
</body>
</html>
