<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Exercises for CEFR A2-B1 | 語法練習</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 8px grid system */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --space-5: 40px;
            --space-6: 48px;
            
            /* Colors - refined palette */
            --color-bg: #ffffff;
            --color-surface: #f8f8f8;
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-border: #e0e0e0;
            
            /* Accent colors */
            --color-accent: #4a90e2;
            --color-accent-hover: #357abd;
            --color-accent-light: rgba(74, 144, 226, 0.05);
            --color-accent-light-hover: rgba(74, 144, 226, 0.1);
            --color-accent-selected: rgba(74, 144, 226, 0.15);
            --color-success: #52c41a;
            --color-success-light: rgba(82, 196, 26, 0.1);
            --color-warning: #faad14;
            --color-error: #ff4d4f;
            --color-error-light: rgba(255, 77, 79, 0.1);
            
            --max-width: 1200px;
            --touch-target: 44px; /* Minimum touch target size */
        }

        body {
            
            /* background: var(--color-bg); - removed, controlled by main.css */
            color: var(--color-text);
            line-height: 1.3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        /* Minimal modern navigation - header replacement */
        .exercise-selector {
            background: transparent;
            padding: 4px var(--space-4) 4px var(--space-2);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            position: sticky;
            top: 0;
            z-index: 10;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .exercise-selector select {
            width: auto;
            max-width: 400px;
            min-width: 200px;
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 0;
            background-color: var(--color-bg);
            font-size: 14px;
            font-family: inherit;
            color: var(--color-text);
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 0;
        }

        .exercise-selector select:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .header-left {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-right: var(--space-1);
        }

        .header-label {
            font-size: 14px;
            color: var(--color-text);
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.02em;
            padding: 2px 0;
            line-height: 1.2;
        }

        .header-label .separator {
            color: var(--color-text-secondary);
            margin: 0 2px;
        }

        .header-copyright {
            flex: 0 0 auto;
            font-size: 9px;
            color: var(--color-text-secondary);
            font-weight: 400;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 1px;
        }

        .header-copyright a {
            text-decoration: none;
            color: inherit;
        }

        .header-copyright a:hover {
            opacity: 0.7;
        }
        
        .header-select-container {
            flex: 1;
            position: relative;
        }



        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            padding: var(--space-3) var(--space-4);
        }

        .loading {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .exercise-card {
            margin-bottom: var(--space-3);
        }

        .exercise-card:last-child {
            margin-bottom: 0;
        }

        .sentence {
            background: var(--color-surface);
            border-radius: 0;
            padding: var(--space-1) var(--space-2);
            margin-bottom: var(--space-2);
            font-size: 15px;
            line-height: 1.3;
            color: var(--color-text);
        }

        .sentence-label {
            font-weight: 500;
            color: var(--color-text);
            margin-right: var(--space-1);
        }

        .chinese-translation {
            font-size: 14px;
            color: var(--color-text-secondary);
            font-style: normal;
            margin-top: var(--space-1);
            padding-left: var(--space-2);
            font-weight: 400;
        }

        .sentence.incorrect {
            background: var(--color-surface);
            color: var(--color-text);
        }

        .sentence.correct {
            background: var(--color-surface);
            color: var(--color-text);
        }

        .answer-input {
            width: 100%;
            padding: var(--space-1) var(--space-2);
            border: none;
            border-bottom: 1px solid var(--color-border);
            border-radius: 0;
            font-size: 14px;
            transition: border-color 0.15s ease, background 0.15s ease;
            margin-bottom: var(--space-2);
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
        }

        .answer-input:focus {
            outline: none;
            border-bottom-color: var(--color-accent);
            background: var(--color-accent-light);
        }

        .answer-input:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .mc-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .mc-option {
            background: var(--color-bg);
            border: none;
            border-radius: 0;
            padding: var(--space-2) var(--space-3);
            cursor: pointer;
            transition: background 0.15s ease;
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            color: var(--color-text);
        }

        .mc-option {
            min-height: var(--touch-target);
            touch-action: manipulation;
        }

        .mc-option:hover {
            background: var(--color-accent-light-hover);
        }

        .mc-option:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .mc-option.selected {
            background: var(--color-accent-selected);
            color: var(--color-accent);
            border-color: var(--color-accent);
            font-weight: 500;
        }

        .mc-option.correct {
            background: var(--color-success-light);
            color: var(--color-text);
        }

        .mc-option.incorrect {
            background: var(--color-error-light);
            color: var(--color-text);
        }

        .btn {
            margin-bottom: var(--space-2);
            padding: var(--space-1) var(--space-2);
            min-height: var(--touch-target);
            border: none;
            border-radius: 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 400;
            transition: background 0.15s ease, color 0.15s ease;
            flex: 1;
            font-family: inherit;
            background: transparent;
            color: var(--color-text-secondary);
            touch-action: manipulation; /* Prevent double-tap zoom */
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .btn-primary:hover {
            background: var(--color-accent-light-hover);
            color: var(--color-accent);
        }

        .btn-secondary:hover,
        .btn-success:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .explanation {
            background: var(--color-surface);
            padding: var(--space-1);
            border-radius: 0;
            margin-top: var(--space-1);
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: var(--color-text);
            margin-bottom: var(--space-1);
            font-size: 13px;
            font-weight: 500;
        }

        .explanation p {
            color: var(--color-text-secondary);
            line-height: 1.3;
            font-size: 13px;
            font-weight: 400;
        }

        .topic-summary {
            background: var(--color-accent-light);
            border-radius: 0;
            padding: var(--space-2);
            margin-bottom: var(--space-3);
            text-align: left;
            border-left: 3px solid var(--color-accent);
        }

        .topic-summary p {
            color: var(--color-text-secondary);
            font-size: 14px;
            margin: 0;
            font-weight: 400;
            line-height: 1.5;
        }

        .topic-summary strong {
            color: var(--color-text);
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--color-border);
            border-radius: 0;
            overflow: hidden;
            margin-bottom: var(--space-3);
        }

        .progress-fill {
            height: 100%;
            background: var(--color-text);
            transition: width 0.3s ease;
        }

        .welcome-screen {
            text-align: left;
            padding: var(--space-1) 0;
        }

        .welcome-screen h2 {
            color: var(--color-text);
            margin-bottom: var(--space-1);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .welcome-screen p {
            color: var(--color-text-secondary);
            font-size: 14px;
            margin-bottom: var(--space-1);
            font-weight: 400;
        }

        .start-btn {
            background: transparent;
            color: var(--color-text-secondary);
            padding: var(--space-2) var(--space-4);
            border: none;
            border-radius: 0;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
            font-family: inherit;
        }

        .start-btn:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }

        .topics-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
            gap: var(--space-1);
            margin-top: var(--space-1);
            padding: var(--space-1) 0;
            width: 100%;
        }

        .topic-link {
            background: var(--color-bg);
            border-radius: 0;
            padding: var(--space-2);
            cursor: pointer;
            transition: background 0.15s ease;
            text-align: left;
            min-height: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .topic-link:hover {
            background: var(--color-accent-light);
            border-left: 3px solid var(--color-accent);
        }

        .topic-link:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .topic-link h3 {
            color: var(--color-text);
            margin-bottom: var(--space-1);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .topic-link p {
            color: var(--color-text-secondary);
            font-size: 12px;
            line-height: 1.4;
            margin: 0;
            white-space: pre-line;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .exercise-selector {
                flex-wrap: wrap;
                padding: 4px var(--space-2);
                gap: var(--space-2);
                margin: 0;
            }
            
            .header-left {
                width: 100%;
                margin-bottom: var(--space-1);
            }
            
            .header-select-container {
                width: 100%;
            }

            .exercise-selector select {
                width: 100%;
                max-width: 100%;
                min-width: 0;
            }
            
            .topics-list {
                gap: var(--space-1);
                margin-top: var(--space-1);
            }
            
            .topic-link h3 {
                font-size: 13px;
                margin-bottom: var(--space-1);
            }
            
            .topic-link p {
                font-size: 11px;
                line-height: 1.3;
            }
            
            .main-content {
                padding: var(--space-1);
                max-height: calc(100vh - 100px);
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: var(--space-1);
                max-height: calc(100vh - 80px);
            }

            .exercise-card {
                padding: var(--space-1);
            }
            
            .sentence {
                font-size: 14px;
                padding: var(--space-1);
            }
            
            .answer-input {
                font-size: 14px;
                padding: var(--space-1);
            }
            
            .btn {
                font-size: 12px;
                padding: var(--space-1);
            }

            .mc-options {
                grid-template-columns: 1fr;
                gap: var(--space-1);
            }

            .mc-option {
                font-size: 14px;
                padding: var(--space-1) var(--space-2);
            }
        }
    </style>
    <link rel="stylesheet" href="../../main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>
<body>
    <div class="exercise-selector">
        <div class="header-left">
            <span class="header-label">General Grammar<span class="separator">•📚</span>綜合文法</span>
            <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
        </div>
        <div class="header-select-container">
            <select id="topic-select">
                <option value="">Select a grammar topic... | 選擇文法主題...</option>
                <!-- Topics will be populated here -->
            </select>
        </div>
    </div>
    
    <div class="main-content" id="exerciseArea">
        <div class="loading">
            <p>Loading exercises...</p>
        </div>
    </div>

    <script src="js/topics/articles.js"></script>
    <script src="js/topics/prepositions.js"></script>
    <script src="js/topics/tenses.js"></script>
    <script src="js/topics/subject-verb-agreement.js"></script>
    <script src="js/topics/subject-verb-agreement-2.js"></script>
    <script src="js/topics/subject-verb-agreement-3.js"></script>
    <script src="js/topics/countable-uncountable.js"></script>
    <script src="js/topics/word-order.js"></script>
    <script src="js/topics/comparatives.js"></script>
    <script src="js/topics/comparatives2.js"></script>
    <script src="js/topics/comparatives3.js"></script>
    <script src="js/topics/modal-verbs-1.js"></script>
    <script src="js/topics/modal-verbs-2.js"></script>
    <script src="js/topics/modal-verbs-3.js"></script>
    <script src="js/topics/gerunds-infinitives.js"></script>
    <script src="js/topics/conditionals.js"></script>
    <script src="js/topics/passive-voice.js"></script>
    <script src="js/topics/passive-voice2.js"></script>
    <script src="js/topics/reported-speech.js"></script>
    <script src="js/topics/phrasal-verbs.js"></script>
    <script src="js/topics/collocations-verb-noun.js"></script>
    <script src="js/topics/collocations-adjective-noun.js"></script>
    <script src="js/topics/collocations-verb-preposition.js"></script>
    <script src="js/topics/collocations-adverb-adjective.js"></script>
    <script src="js/topics/participles1.js"></script>
    <script src="js/topics/participles2.js"></script>
    <script src="js/topics/participles3.js"></script>
    <script src="js/topic-manager.js"></script>
    <script>
        let currentExercise = null;
        let userAnswer = '';
        let isAnswered = false;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadTopicList();
            // Show welcome screen instead of auto-loading
            showWelcomeScreen();
        });

        // Read ?topic=xxx from URL for shareable links
        function getTopicFromUrl() {
            const params = new URLSearchParams(location.search);
            return params.get('topic') || params.get('Topic') || null;
        }

        // Update URL with ?topic=xxx when a topic is selected (for easy link sharing)
        function setTopicInUrl(topicId) {
            const url = new URL(location.href);
            if (topicId) {
                url.searchParams.set('topic', topicId);
            } else {
                url.searchParams.delete('topic');
            }
            history.replaceState(null, '', url);
        }

        // Load topic list into select dropdown
        function loadTopicList() {
            const topicSelect = document.getElementById('topic-select');
            const topics = window.topicManager.getAvailableTopics();
            
            // Clear existing options except the first one
            topicSelect.innerHTML = '<option value="">Select a grammar topic... | 選擇文法主題...</option>';
            
            // Add topics to dropdown
            topics.forEach(topic => {
                const option = document.createElement('option');
                option.value = topic.id;
                option.textContent = topic.name;
                topicSelect.appendChild(option);
            });
            
            // Add change event listener (updates URL when user picks a topic)
            topicSelect.addEventListener('change', function() {
                const selectedTopicId = this.value;
                if (selectedTopicId) {
                    loadTopic(selectedTopicId);
                } else {
                    setTopicInUrl(null);
                    showWelcomeScreen();
                }
            });
            
            // If URL has ?topic=xxx, open that topic for shareable links
            const topicFromUrl = getTopicFromUrl();
            if (topicFromUrl && topics.some(t => t.id === topicFromUrl)) {
                topicSelect.value = topicFromUrl;
                loadTopic(topicFromUrl);
            }
        }

        // Show welcome screen
        function showWelcomeScreen() {
            // Reset select dropdown
            const topicSelect = document.getElementById('topic-select');
            if (topicSelect) {
                topicSelect.value = '';
            }
            
            const exerciseArea = document.getElementById('exerciseArea');
            const topics = window.topicManager.getAvailableTopics();
            
            let topicsHTML = topics.map(topic => `
                <div class="topic-link" onclick="loadTopic('${topic.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();loadTopic('${topic.id}')}">
                    <h3>${topic.name}</h3>
                    <p>${topic.introduction.replace(/<br>/g, '\n')}</p>
                </div>
            `).join('');
            
            exerciseArea.innerHTML = `
                <div class="topics-list">
                    ${topicsHTML}
                </div>
            `;
        }

        // Show topic list (fallback)
        function showTopicList() {
            showWelcomeScreen();
        }

        // Load a specific topic
        async function loadTopic(topicId) {
            try {
                // Update URL for easy link sharing
                setTopicInUrl(topicId);
                
                // Update select dropdown
                const topicSelect = document.getElementById('topic-select');
                if (topicSelect) {
                    topicSelect.value = topicId;
                }
                
                // Show loading
                showLoading();

                // Load topic
                await window.topicManager.loadTopic(topicId);
                
                // Load exercises
                loadCurrentExercise();
                
            } catch (error) {
                console.error('Error loading topic:', error);
                showError('Failed to load topic. Please try again.');
            }
        }

        // Show loading state
        function showLoading() {
            const exerciseArea = document.getElementById('exerciseArea');
            exerciseArea.innerHTML = `
                <div class="loading">
                    <p>Loading exercises...</p>
                </div>
            `;
        }

        // Show error message
        function showError(message) {
            const exerciseArea = document.getElementById('exerciseArea');
            exerciseArea.innerHTML = `
                <div class="welcome-screen">
                    <h2>Error</h2>
                    <p>${message}</p>
                    <button class="start-btn" onclick="showTopicList()">Try Again</button>
                </div>
            `;
        }

        // Grammar tips for each topic
        const grammarTips = {
            'articles': '<strong>💡 Tips:</strong> Use "a/an" for general things (第一次提到). Use "the" for specific things (已經知道係邊個). Remember: "an" before vowels (a, e, i, o, u).',
            'prepositions': '<strong>💡 Tips:</strong> "in" = 入面/月份/年份, "on" = 上面/日期/星期, "at" = 地點/時間點. "for" = 目的/時間長度, "with" = 同/用.',
            'tenses': '<strong>💡 Tips:</strong> Present = 現在/習慣, Past = 過去完成咗, Future = 將來會發生. Continuous = 進行緊, Perfect = 完成咗.',
            'subject-verb-agreement': '<strong>💡 Tips:</strong> Singular subject (he/she/it) → singular verb (is/has/goes). Plural subject (they/we) → plural verb (are/have/go).',
            'subject-verb-agreement-2': '<strong>💡 Tips:</strong> "one of + plural noun" uses a singular verb. "Some/most/all of + plural noun" uses a plural verb. Uncountable nouns take singular verbs.',
            'subject-verb-agreement-3': '<strong>💡 Tips:</strong> "Either of" and "neither of" are usually singular in formal English, so use singular verbs (is/has/makes).',
            'countable-uncountable': '<strong>💡 Tips:</strong> Countable = 可以數 (book/books), use "many/few". Uncountable = 唔可以數 (water/money), use "much/little".',
            'word-order': '<strong>💡 Tips:</strong> Basic order: Subject → Verb → Object. Adjectives before nouns. Adverbs can go before verbs or at the end.',
            'comparatives': '<strong>💡 Tips:</strong> Short adjectives use "-er" (tall → taller). Long adjectives use "more" (interesting → more interesting). Irregular: good → better, bad → worse.',
            'comparatives-2': '<strong>💡 Tips:</strong> Superlatives use "-est" or "the most". Use "the least" for the lowest degree. "as ... as" shows equality.',
            'comparatives-3': '<strong>💡 Tips:</strong> Adverbs can compare actions: fast → faster, carefully → more carefully. Superlative adverbs use "the most".',
            'modal-verbs-1': '<strong>💡 Tips:</strong> Modals take base verbs (no "to", no "-s"). "can/could" show ability; "should" gives advice.',
            'modal-verbs-2': '<strong>💡 Tips:</strong> "must/have to" = strong obligation, "mustn’t" =禁止, "can/may" = permission.',
            'modal-verbs-3': '<strong>💡 Tips:</strong> "might/may/could" show possibility. "could/would" make requests more polite.',
            'gerunds-infinitives': '<strong>💡 Tips:</strong> Some verbs need "-ing" (enjoy doing, finish doing). Some need "to + verb" (want to do, decide to do). Some can use both with different meanings.',
            'conditionals': '<strong>💡 Tips:</strong> Type 1 (real): If + present → will + base verb. Type 2 (unreal): If + past → would + base verb. Type 3 (past): If + past perfect → would have + past participle.',
            'passive-voice': '<strong>💡 Tips:</strong> Active = Subject does action (I eat an apple). Passive = Subject receives action (An apple is eaten by me). Use "be" + past participle.',
            'passive-voice-2': '<strong>💡 Tips:</strong> Active uses a doer. Passive uses "be" + past participle. -ed adjectives describe feelings (bored), -ing adjectives describe things (boring).',
            'reported-speech': '<strong>💡 Tips:</strong> Present → Past (say → said, is → was). Past → Past Perfect (went → had gone). "will" → "would". Change pronouns and time words too.',
            'phrasal-verbs': '<strong>💡 Tips:</strong> Phrasal verbs = verb + preposition/adverb. Meaning can change completely (look = 睇, look after = 照顧). Learn them as complete phrases.',
            'collocations-verb-noun': '<strong>💡 Tips:</strong> Verb + noun collocations are very common (take a risk, make progress). Learn them as chunks.',

        // Load all exercises for current topic
        function loadCurrentExercise() {
            const topicInfo = window.topicManager.getCurrentTopicInfo();
            if (!topicInfo) {
                showError('No exercises available for this topic.');
                return;
            }

            const exerciseArea = document.getElementById('exerciseArea');
            const exercises = topicInfo.exercises;
            
            const tips = grammarTips[topicInfo.id] || '<strong>💡 Tips:</strong> Read each question carefully and think about the grammar rules!';
            
            let exercisesHTML = `
                <div class="topic-summary">
                    <p>${tips}</p>
                </div>
            `;

            exercises.forEach((exercise, index) => {
                const shuffledOptions = shuffleArray([...exercise.options]);
                exercisesHTML += `
                    <div class="exercise-card" id="exercise-${index}">
                        <div class="sentence">
                            ${exercise.question}
                            ${exercise.chineseTranslation ? `<div class="chinese-translation">${exercise.chineseTranslation}</div>` : ''}
                        </div>
                        
                        <div class="mc-options" id="mcOptions-${index}">
                            ${shuffledOptions.map((option, optionIndex) => `
                                <div class="mc-option" 
                                     onclick="selectOption(${index}, ${optionIndex})"
                                     data-option="${option}">
                                    ${option}
                                </div>
                            `).join('')}
                        </div>
                        
                        <button class="btn btn-primary" onclick="checkAnswer(${index})" id="checkBtn-${index}">
                            Check Answer
                        </button>
                        
                        <div class="explanation" id="explanation-${index}">
                            <h4>Explanation:</h4>
                            <p>${exercise.explanation}</p>
                        </div>
                    </div>
                `;
            });

            exerciseArea.innerHTML = exercisesHTML;
        }

        // Shuffle array in place (Fisher-Yates)
        function shuffleArray(items) {
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            return items;
        }

        // Select an option
        function selectOption(exerciseIndex, optionIndex) {
            const mcOptions = document.getElementById(`mcOptions-${exerciseIndex}`);
            const options = mcOptions.querySelectorAll('.mc-option');
            
            // Remove previous selection
            options.forEach(option => option.classList.remove('selected'));
            
            // Add selection to clicked option
            options[optionIndex].classList.add('selected');
            
            // Store the selected answer
            options[optionIndex].setAttribute('data-selected', 'true');
        }

        // Check user's answer
        function checkAnswer(exerciseIndex) {
            const mcOptions = document.getElementById(`mcOptions-${exerciseIndex}`);
            const explanation = document.getElementById(`explanation-${exerciseIndex}`);
            const checkBtn = document.getElementById(`checkBtn-${exerciseIndex}`);
            const showBtn = document.getElementById(`showBtn-${exerciseIndex}`);
            
            // Check if already answered
            if (checkBtn.disabled) return;
            
            // Get the topic info to access the exercise data
            const topicInfo = window.topicManager.getCurrentTopicInfo();
            const exercise = topicInfo.exercises[exerciseIndex];
            
            // Find selected option
            const selectedOption = mcOptions.querySelector('.mc-option.selected');
            if (!selectedOption) {
                alert('Please select an answer first!');
                return;
            }
            
            const userAnswer = selectedOption.getAttribute('data-option');
            const correctAnswer = exercise.correctAnswers[0]; // For now, handle single correct answer
            
            const isCorrect = userAnswer === correctAnswer;
            
            // Show result
            if (isCorrect) {
                selectedOption.classList.add('correct');
                checkBtn.textContent = 'Correct! ✓';
                checkBtn.className = 'btn btn-success';
            } else {
                selectedOption.classList.add('incorrect');
                // Also highlight the correct answer
                const options = mcOptions.querySelectorAll('.mc-option');
                options.forEach(option => {
                    if (option.getAttribute('data-option') === correctAnswer) {
                        option.classList.add('correct');
                    }
                });
                checkBtn.textContent = 'Incorrect ✗';
                checkBtn.className = 'btn btn-secondary';
            }
            
            checkBtn.disabled = true;
            explanation.classList.add('show');
        }


    </script>
