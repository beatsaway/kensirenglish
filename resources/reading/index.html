<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Practice | 閱讀練習</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            /* 8px grid system */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --space-5: 40px;
            --space-6: 48px;
            
            /* Colors - refined palette */
            --color-bg: #ffffff;
            --color-surface: #f8f8f8;
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-border: #e0e0e0;
            
            /* Accent colors */
            --color-accent: #4a90e2;
            --color-accent-hover: #357abd;
            --color-accent-light: rgba(74, 144, 226, 0.08);
            --color-success: #52c41a;
            --color-success-light: rgba(82, 196, 26, 0.12);
            --color-error: #ff4d4f;
            --color-error-light: rgba(255, 77, 79, 0.12);
            
            --max-width: 1200px;
            --touch-target: 44px; /* Minimum touch target size */
        }

        body {
            /* background: var(--color-bg); - removed, controlled by main.css */
            color: var(--color-text);
            line-height: 1.4;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        header {
            background: transparent;
            padding: 4px var(--space-4) 4px var(--space-2);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .header-left {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-right: var(--space-1);
        }

        .header-label {
            font-size: 14px;
            color: var(--color-text);
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.02em;
            padding: 2px 0;
            line-height: 1.2;
        }

        .header-label .separator {
            color: var(--color-text-secondary);
            margin: 0 2px;
        }

        .header-copyright {
            flex: 0 0 auto;
            font-size: 9px;
            color: var(--color-text-secondary);
            font-weight: 400;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 1px;
        }

        .header-copyright a {
            text-decoration: none;
            color: inherit;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-left: auto;
        }

        .header-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            text-decoration: none;
            font-size: 13px;
            line-height: 1.1;
            white-space: nowrap;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .header-button:hover {
            background: var(--color-accent-light);
            border-color: var(--color-accent);
        }

        .header-button-subtitle {
            font-size: 11px;
            color: var(--color-text-secondary);
        }

        .dataset-select {
            padding: 6px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            font-size: 14px;
            font-family: inherit;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            padding: var(--space-2) var(--space-3);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: var(--space-2);
        }

        .reading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--space-3);
        }

        .reading-focus {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .reading-card {
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            padding: var(--space-2);
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .reading-title {
            font-size: 17px;
            font-weight: 600;
        }

        .reading-author {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .reading-description {
            font-size: 16px;
            color: var(--color-text);
        }

        .cdesc-word {
            cursor: pointer;
        }

        .cdesc-tooltip {
            position: absolute;
            display: none;
            max-width: 240px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
            z-index: 1000;
            pointer-events: none;
        }

        .cdesc-word.is-active {
            background: #ffe8a3;
            border-radius: 3px;
        }

        .reading-quote {
            font-size: 13px;
            color: var(--color-text-secondary);
            border-left: 3px solid var(--color-border);
            padding-left: var(--space-1);
            font-style: italic;
        }

        .reading-source {
            font-size: 12px;
            color: var(--color-text-tertiary);
        }

        .question-card {
            background: var(--color-bg);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .question-progress {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        .question-text {
            font-size: 15px;
            font-weight: 500;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 6px;
        }

        .option {
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
            font-size: 14px;
            text-align: center;
            min-height: var(--touch-target);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .option:hover {
            background: var(--color-accent-light);
            border-color: var(--color-accent);
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.18);
            transform: translateY(-1px);
        }

        .option.selected {
            background: var(--color-accent-light);
            color: var(--color-accent);
            font-weight: 500;
        }

        .option.correct {
            background: var(--color-success-light);
            color: var(--color-text);
            border-color: rgba(82, 196, 26, 0.4);
        }

        .option.incorrect {
            background: var(--color-error-light);
            color: var(--color-text);
            border-color: rgba(255, 77, 79, 0.4);
        }

        .btn-check {
            align-self: center;
            background: transparent;
            color: var(--color-text-secondary);
            border: none;
            padding: var(--space-1) var(--space-2);
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .btn-check:hover {
            background: var(--color-accent-light);
            color: var(--color-accent);
        }

        .question-nav {
            display: flex;
            gap: var(--space-1);
            align-items: center;
        }

        .nav-button {
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            color: var(--color-text);
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .nav-button:hover:not(:disabled) {
            background: var(--color-accent-light);
            border-color: var(--color-accent);
        }

        .nav-button:disabled {
            color: var(--color-text-tertiary);
            border-color: var(--color-border);
            cursor: not-allowed;
        }

        .explanation {
            font-size: 13px;
            color: var(--color-text-secondary);
            display: none;
        }

        .question-card.answered .explanation {
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: var(--space-1) var(--space-2);
            }

            .options {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .option {
                padding: 12px 10px;
                font-size: 13px;
                min-height: 40px;
            }
        }
    </style>
    <link rel="stylesheet" href="../../main.css">
</head>
<body>
    <header>
        <div class="header-left">
            <span class="header-label">Reading Practice<span class="separator">•📖</span>閱讀練習</span>
            <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
        </div>
        <div class="header-controls">
            <select id="datasetSelect" class="dataset-select"></select>
            <a href="../booklist/index.html" class="header-button">
                Booklist
                <span class="header-button-subtitle">書單</span>
            </a>
        </div>
    </header>

    <div class="main-content">
        <div class="container">
            <section>
                <div id="readingBlocks" class="reading-focus"></div>
            </section>

            <section>
                <div id="questionList"></div>
            </section>
        </div>
    </div>

    <script>
        const readingBlocks = document.getElementById('readingBlocks');
        const questionList = document.getElementById('questionList');
        const datasetSelect = document.getElementById('datasetSelect');
        let currentQuestionIndex = 0;
        const cdescTooltip = document.createElement('div');
        cdescTooltip.className = 'cdesc-tooltip';
        cdescTooltip.setAttribute('role', 'tooltip');
        document.body.appendChild(cdescTooltip);

        const datasets = [
            { label: 'Reviews: Films', src: 'reading_reviews_films.js' },
            { label: 'Reviews: Festivals', src: 'reading_reviews_festivals.js' },
            { label: 'Figures: Scenery', src: 'reading_figures_scenery.js' },
            { label: 'Figures: Actions', src: 'reading_figures_actions.js' },
            { label: 'Figures: Feelings', src: 'reading_figures_feelings.js' },
            { label: 'Figures: Sounds', src: 'reading_figures_sounds.js' },
            { label: 'Senses: Sight', src: 'reading_senses_sight.js' },
            { label: 'Senses: Sound', src: 'reading_senses_sound.js' },
            { label: 'Senses: Touch', src: 'reading_senses_touch.js' },
            { label: 'Senses: Smell', src: 'reading_senses_smell.js' },
            { label: 'Senses: Taste', src: 'reading_senses_taste.js' }
        ];

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildDescriptionMarkup(block) {
            if (!block || !block.description) {
                return '';
            }
            if (!block.cdescription) {
                return escapeHtml(block.description);
            }
            const descriptionWords = block.description.split(' ');
            const cdescriptionWords = block.cdescription.split(' ');
            if (descriptionWords.length !== cdescriptionWords.length) {
                return escapeHtml(block.description);
            }
            return descriptionWords.map((word, index) => {
                const translated = cdescriptionWords[index] || '';
                return `<span class="cdesc-word" data-cdesc="${escapeHtml(translated)}">${escapeHtml(word)}</span>`;
            }).join(' ');
        }

        function hideCdescTooltip() {
            cdescTooltip.style.display = 'none';
            cdescTooltip.textContent = '';
        }

        function showCdescTooltip(target, text) {
            if (!text) {
                hideCdescTooltip();
                return;
            }
            cdescTooltip.textContent = text;
            cdescTooltip.style.display = 'block';
            const rect = target.getBoundingClientRect();
            const tooltipRect = cdescTooltip.getBoundingClientRect();
            const padding = 4;
            let left = rect.left + rect.width / 2;
            let top = rect.top - tooltipRect.height - padding;
            if (top < padding) {
                top = rect.bottom + padding;
            }
            const minLeft = padding + tooltipRect.width / 2;
            const maxLeft = window.innerWidth - padding - tooltipRect.width / 2;
            left = Math.min(Math.max(left, minLeft), maxLeft);
            cdescTooltip.style.left = `${left + window.scrollX}px`;
            cdescTooltip.style.top = `${top + window.scrollY}px`;
        }

        function renderBlock(blockIndex) {
            if (!window.readingData) {
                readingBlocks.innerHTML = '<p>Unable to load passages.</p>';
                return;
            }
            const block = window.readingData.blocks[blockIndex];
            if (!block) {
                readingBlocks.innerHTML = '<p>Unable to find the related passage.</p>';
                return;
            }
            const authorMarkup = block.author ? `<div class="reading-author">${block.author}</div>` : '';
            const quoteMarkup = block.quote ? `<div class="reading-quote">"${block.quote}"</div>` : '';
            const sourceMarkup = block.source ? `<div class="reading-source">${block.source}</div>` : '';
            const descriptionMarkup = buildDescriptionMarkup(block);
            readingBlocks.innerHTML = `
                <div class="reading-card">
                    <div class="reading-title">${block.title}</div>
                    ${authorMarkup}
                    <div class="reading-description">${descriptionMarkup}</div>
                    ${quoteMarkup}
                    ${sourceMarkup}
                </div>
            `;
        }

        function renderCurrentQuestion() {
            if (!window.readingData) {
                questionList.innerHTML = '<p>Unable to load questions.</p>';
                return;
            }
            const question = window.readingData.questions[currentQuestionIndex];
            if (!question) {
                questionList.innerHTML = '<p>No questions available.</p>';
                return;
            }
            renderBlock(typeof question.blockIndex === 'number' ? question.blockIndex : 0);
            questionList.innerHTML = `
                <div class="question-card" data-index="${currentQuestionIndex}">
                    <div class="question-header">
                        <div class="question-progress">Question ${currentQuestionIndex + 1} of ${window.readingData.questions.length}</div>
                        <div class="question-nav">
                            <button id="prevQuestion" class="nav-button">Previous</button>
                            <button id="nextQuestion" class="nav-button">Next</button>
                        </div>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div class="options">
                        ${question.options.map(option => `
                            <div class="option" data-option="${option}">${option}</div>
                        `).join('')}
                    </div>
                    <button class="btn-check" data-index="${currentQuestionIndex}">Check Answer</button>
                    <div class="explanation">${question.explanation}</div>
                </div>
            `;
            updateNavState();
        }

        function selectOption(optionEl) {
            const card = optionEl.closest('.question-card');
            if (card.classList.contains('answered')) {
                return;
            }
            const options = card.querySelectorAll('.option');
            options.forEach(option => option.classList.remove('selected'));
            optionEl.classList.add('selected');
        }

        function checkAnswer(card) {
            if (card.classList.contains('answered')) {
                return;
            }
            const index = Number(card.dataset.index);
            const question = window.readingData.questions[index];
            const selected = card.querySelector('.option.selected');
            if (!selected) {
                return;
            }
            const selectedValue = selected.dataset.option;
            card.querySelectorAll('.option').forEach(option => {
                if (option.dataset.option === question.answer) {
                    option.classList.add('correct');
                } else if (option.dataset.option === selectedValue) {
                    option.classList.add('incorrect');
                }
            });
            card.classList.add('answered');
        }

        function updateNavState() {
            const total = window.readingData.questions.length;
            const prevButton = questionList.querySelector('#prevQuestion');
            const nextButton = questionList.querySelector('#nextQuestion');
            if (!prevButton || !nextButton) {
                return;
            }
            prevButton.disabled = currentQuestionIndex <= 0;
            nextButton.disabled = currentQuestionIndex >= total - 1;
        }

        function setQuestionIndex(index) {
            if (!window.readingData) {
                return;
            }
            const total = window.readingData.questions.length;
            const nextIndex = Math.min(Math.max(index, 0), total - 1);
            currentQuestionIndex = nextIndex;
            renderCurrentQuestion();
        }

        function loadDataset(src) {
            return new Promise((resolve, reject) => {
                const existingScript = document.getElementById('datasetScript');
                if (existingScript) {
                    existingScript.remove();
                }
                window.readingData = null;
                const script = document.createElement('script');
                script.id = 'datasetScript';
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject();
                document.body.appendChild(script);
            });
        }

        function refreshExercises(src) {
            readingBlocks.innerHTML = '';
            questionList.innerHTML = '';
            loadDataset(src)
                .then(() => {
                    currentQuestionIndex = 0;
                    renderCurrentQuestion();
                })
                .catch(() => {
                    readingBlocks.innerHTML = '<p>Unable to load passages.</p>';
                    questionList.innerHTML = '<p>Unable to load questions.</p>';
                });
        }

        questionList.addEventListener('click', (event) => {
            const option = event.target.closest('.option');
            if (option) {
                selectOption(option);
                return;
            }
            const button = event.target.closest('.btn-check');
            if (button) {
                const card = button.closest('.question-card');
                checkAnswer(card);
            }
        });

        readingBlocks.addEventListener('click', (event) => {
            const word = event.target.closest('.cdesc-word');
            if (!word) {
                hideCdescTooltip();
                return;
            }
            const translation = word.dataset.cdesc || '';
            readingBlocks.querySelectorAll('.cdesc-word.is-active').forEach((node) => {
                node.classList.remove('is-active');
            });
            word.classList.add('is-active');
            showCdescTooltip(word, translation);
            event.stopPropagation();
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.cdesc-word')) {
                hideCdescTooltip();
                readingBlocks.querySelectorAll('.cdesc-word.is-active').forEach((node) => {
                    node.classList.remove('is-active');
                });
            }
        });

        window.addEventListener('scroll', hideCdescTooltip, true);
        window.addEventListener('resize', hideCdescTooltip);

        questionList.addEventListener('click', (event) => {
            if (event.target.id === 'prevQuestion') {
                setQuestionIndex(currentQuestionIndex - 1);
                return;
            }
            if (event.target.id === 'nextQuestion') {
                setQuestionIndex(currentQuestionIndex + 1);
            }
        });

        datasets.forEach((dataset) => {
            const option = document.createElement('option');
            option.value = dataset.src;
            option.textContent = dataset.label;
            datasetSelect.appendChild(option);
        });

        datasetSelect.addEventListener('change', (event) => {
            refreshExercises(event.target.value);
        });

        datasetSelect.value = datasets[0].src;
        refreshExercises(datasets[0].src);
    </script>
</body>
</html>
