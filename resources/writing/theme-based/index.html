<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme-based Writing</title>
    <link rel="stylesheet" href="../../../main.css">
    <style>
        :root {
            --space-2: 16px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: inherit; background: var(--color-bg); color: #111; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }
        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-label { font-size: 14px; font-weight: 600; }
        .header-copyright { font-size: 10px; color: var(--color-text-secondary); }
        .header-copyright a { color: inherit; text-decoration: none; }
        main { padding: 24px; max-width: 720px; margin: 0 auto; }
        .theme-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .theme-row select { padding: 6px 10px; border: 1px solid #ddd; font-size: 14px; }
        .task-card {
            border: 1px solid #ddd;
            background: #f8f8f8;
            padding: 16px;
            margin-bottom: 16px;
        }
        .task-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .task-title { font-size: 1.1rem; font-weight: 600; }
        .task-watch { font-size: 0.9rem; }
        .task-watch a { color: var(--color-text-secondary); text-decoration: none; }
        .task-watch a:hover { text-decoration: underline; color: #2563eb; }
        .task-context { font-size: 14px; color: #444; margin-bottom: 10px; }
        .task-questions-list { padding-left: 1.4rem; }
        .task-questions-list li { margin-bottom: 8px; font-size: 14px; }
        .question-video-link { margin-left: 6px; color: #2563eb; text-decoration: none; font-size: 13px; }
        .question-video-link:hover { text-decoration: underline; }
        .task-instructions { font-size: 14px; padding: 12px; background: #fff; border-left: 3px solid #2563eb; }
        .task-vocab-title { font-size: 0.8rem; font-weight: 400; margin-top: 12px; margin-bottom: 8px; }
        .task-vocab-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .task-vocab-item {
            padding: 4px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .task-vocab-item:hover { background: #eee; border-color: var(--color-text-secondary); }
        .task-vocab-item .vocab-cn { color: var(--color-text-secondary); margin-left: 6px; display: none; }
        .task-vocab-item.show-cn .vocab-cn { display: inline; }
        .reference-links { margin-bottom: 20px; padding: 12px; background: #f0f4f8; border: 1px solid var(--color-border); }
        .reference-links-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        .reference-links-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .reference-links-list a { font-size: 0.9rem; color: #2563eb; text-decoration: none; padding: 4px 0; }
        .reference-links-list a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Theme-based Writing</div>
            <div class="header-copyright"> <a href="../../../index.html">©kensirenglish.com</a></div>
        </div>
    </header>

    <main>
        <div class="theme-row">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect"></select>
        </div>
        <div id="taskCards"></div>
    </main>

    <script src="winter.js"></script>
    <script src="olympics.js"></script>
    <script src="astrology.js"></script>
    <script src="monalisa.js"></script>
    <script src="MakingObby.js"></script>
    <script>
        const themes = { winter: window.themeBasedWinter, olympics: window.themeBasedOlympics, astrology: window.themeBasedAstrology, monalisa: window.themeBasedMonalisa, makingObby: window.themeBasedMakingObby };
        const themeSelect = document.getElementById("themeSelect");
        const taskCards = document.getElementById("taskCards");

        const themeKeys = Object.keys(themes);
        themeKeys.forEach((key) => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = themes[key].theme;
            themeSelect.appendChild(opt);
        });

        const params = new URLSearchParams(location.search);
        const themeFromUrl = params.get("theme");
        themeSelect.value = themeKeys.includes(themeFromUrl) ? themeFromUrl : "olympics";

        function render(data) {
            taskCards.innerHTML = "";
            if (!data || !data.tasks || !data.tasks.length) return;
            if (data.referenceLinks && data.referenceLinks.length > 0) {
                const refBlock = document.createElement("div");
                refBlock.className = "reference-links";
                refBlock.innerHTML = "<div class=\"reference-links-title\">Reference (optional)</div>";
                const list = document.createElement("div");
                list.className = "reference-links-list";
                data.referenceLinks.forEach((item) => {
                    const a = document.createElement("a");
                    a.href = item.url;
                    a.target = "_blank";
                    a.rel = "noopener";
                    a.textContent = item.label;
                    list.appendChild(a);
                });
                refBlock.appendChild(list);
                taskCards.appendChild(refBlock);
            }
            data.tasks.forEach((task) => {
                const card = document.createElement("section");
                card.className = "task-card";
                const videoUrl = escapeHtml(task.videoUrl || "");
                let html = `<div class="task-title-row"><h2 class="task-title">${escapeHtml(task.title)}</h2>`;
                if (task.videoUrl) {
                    html += `<span class="task-watch"><a href="${videoUrl}" target="_blank" rel="noopener">watch video</a></span>`;
                }
                if (task.learnMoreUrl) {
                    const learnUrl = task.learnMoreUrl.replace(/"/g, "&quot;");
                    html += `<span class="task-watch"><a href="${learnUrl}" target="_blank" rel="noopener">learn more</a></span>`;
                }
                html += `</div>`;
                if (task.instructions) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<div class="task-instructions">${escapeHtml(task.instructions)}</div>`;
                } else if (task.questions && task.questions.length) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<ol class="task-questions-list">`;
                    task.questions.forEach((q) => {
                        const questionText = typeof q === "string" ? q : (q.text || "");
                        const link = typeof q === "object" && q && q.link;
                        const linkLabel = (typeof q === "object" && q && q.linkLabel) ? q.linkLabel : "Watch video";
                        let li = "<li><span class=\"question-text\">" + escapeHtml(questionText) + "</span>";
                        if (link) {
                            const safeUrl = (link + "").replace(/"/g, "&quot;");
                            const safeLabel = escapeHtml(linkLabel);
                            li += " <a href=\"" + safeUrl + "\" target=\"_blank\" rel=\"noopener\" class=\"question-video-link\">" + safeLabel + "</a>";
                        }
                        li += "</li>";
                        html += li;
                    });
                    html += `</ol>`;
                }
                card.innerHTML = html;
                if (task.vocab && task.vocab.length) {
                    const vocabTitle = document.createElement("div");
                    vocabTitle.className = "task-vocab-title";
                    vocabTitle.textContent = "Useful words";
                    card.appendChild(vocabTitle);
                    const vocabList = document.createElement("div");
                    vocabList.className = "task-vocab-list";
                    task.vocab.forEach((item) => {
                        const span = document.createElement("span");
                        span.className = "task-vocab-item";
                        span.innerHTML = escapeHtml(item.en) + '<span class="vocab-cn">' + escapeHtml(item.cn) + "</span>";
                        span.addEventListener("click", () => span.classList.toggle("show-cn"));
                        vocabList.appendChild(span);
                    });
                    card.appendChild(vocabList);
                }
                taskCards.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        themeSelect.addEventListener("change", () => {
            const theme = themeSelect.value;
            const url = new URL(location.href);
            url.searchParams.set("theme", theme);
            history.replaceState(null, "", url);
            render(themes[theme]);
        });
        render(themes[themeSelect.value]);
    </script>
</body>
</html>
