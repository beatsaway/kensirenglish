<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme-based Writing</title>
    <link rel="stylesheet" href="../../../main.css">
    <style>
        :root {
            --space-2: 16px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: inherit; background: var(--color-bg); color: #111; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }
        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-label { font-size: 14px; font-weight: 600; }
        .header-copyright { font-size: 10px; color: var(--color-text-secondary); }
        .header-copyright a { color: inherit; text-decoration: none; }
        main { padding: 24px; max-width: 720px; margin: 0 auto; }
        .theme-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .theme-row select { padding: 6px 10px; border: 1px solid #ddd; font-size: 14px; }
        .task-card {
            border: 1px solid #ddd;
            background: #f8f8f8;
            padding: 16px;
            margin-bottom: 16px;
        }
        .task-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .task-title { font-size: 1.1rem; font-weight: 600; }
        .task-title a { color: #111; text-decoration: none; }
        .task-title a:hover { text-decoration: underline; color: #2563eb; }
        .task-watch { font-size: 0.9rem; }
        .task-watch a { color: var(--color-text-secondary); text-decoration: none; }
        .task-watch a:hover { text-decoration: underline; color: #2563eb; }
        .task-context { font-size: 14px; color: #444; margin-bottom: 10px; }
        .task-questions-list { padding-left: 1.4rem; }
        .task-questions-list li { margin-bottom: 4px; font-size: 14px; }
        .task-instructions { font-size: 14px; padding: 12px; background: #fff; border-left: 3px solid #2563eb; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Theme-based Writing</div>
            <div class="header-copyright"> <a href="../../../index.html">©kensirenglish.com</a></div>
        </div>
    </header>

    <main>
        <div class="theme-row">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect"></select>
        </div>
        <div id="taskCards"></div>
    </main>

    <script src="winter.js"></script>
    <script>
        const themes = { winter: window.themeBasedWinter };
        const themeSelect = document.getElementById("themeSelect");
        const taskCards = document.getElementById("taskCards");

        Object.keys(themes).forEach((key) => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = themes[key].theme;
            themeSelect.appendChild(opt);
        });

        function render(data) {
            taskCards.innerHTML = "";
            if (!data || !data.tasks || !data.tasks.length) return;
            data.tasks.forEach((task) => {
                const card = document.createElement("section");
                card.className = "task-card";
                const videoUrl = escapeHtml(task.videoUrl);
                let html = `<div class="task-title-row"><h2 class="task-title"><a href="${videoUrl}" target="_blank" rel="noopener">${escapeHtml(task.title)}</a></h2><span class="task-watch"><a href="${videoUrl}" target="_blank" rel="noopener">watch video</a></span></div>`;
                if (task.instructions) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<div class="task-instructions">${escapeHtml(task.instructions)}</div>`;
                } else if (task.questions && task.questions.length) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<ol class="task-questions-list">`;
                    task.questions.forEach((q) => { html += `<li>${escapeHtml(q)}</li>`; });
                    html += `</ol>`;
                }
                card.innerHTML = html;
                taskCards.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        themeSelect.addEventListener("change", () => {
            render(themes[themeSelect.value]);
        });
        render(themes[themeSelect.value]);
    </script>
</body>
</html>
