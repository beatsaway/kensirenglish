<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme-based Writing</title>
    <link rel="stylesheet" href="../../../main.css">
    <style>
        :root {
            --space-2: 16px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: inherit; background: var(--color-bg); color: #111; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }
        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .header-label { font-size: 14px; font-weight: 600; }
        .header-copyright { font-size: 10px; color: var(--color-text-secondary); }
        .header-copyright a { color: inherit; text-decoration: none; }
        main { padding: 24px; max-width: 720px; margin: 0 auto; }
        .theme-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .theme-row > label { padding-top: 8px; flex-shrink: 0; }
        .theme-combobox { position: relative; flex: 1; min-width: 200px; max-width: 420px; }
        .theme-combobox input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--color-border);
            font-size: 14px;
            background: var(--color-bg);
        }
        .theme-combobox input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }
        .theme-dropdown {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 2px);
            max-height: min(320px, 70vh);
            overflow-y: auto;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        .theme-dropdown.is-open { display: block; }
        .theme-option {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f0f0f0;
            text-align: left;
            width: 100%;
            background: none;
            font-family: inherit;
            color: inherit;
        }
        .theme-option:last-child { border-bottom: none; }
        .theme-option:hover,
        .theme-option:focus {
            background: #f0f4f8;
            outline: none;
        }
        .theme-option.is-selected {
            font-weight: 600;
            background: #eef4ff;
        }
        .theme-dropdown-empty {
            padding: 12px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .task-card {
            border: 1px solid #ddd;
            background: #f8f8f8;
            padding: 16px;
            margin-bottom: 16px;
        }
        .task-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .task-title { font-size: 1.1rem; font-weight: 600; }
        .task-watch { font-size: 0.9rem; }
        .task-watch a { color: var(--color-text-secondary); text-decoration: none; }
        .task-watch a:hover { text-decoration: underline; color: #2563eb; }
        .task-context { font-size: 14px; color: #444; margin-bottom: 10px; }
        .task-questions-list { padding-left: 1.4rem; }
        .task-questions-list li { margin-bottom: 8px; font-size: 14px; }
        .question-video-link { margin-left: 6px; color: #2563eb; text-decoration: none; font-size: 13px; }
        .question-video-link:hover { text-decoration: underline; }
        .task-instructions { font-size: 14px; padding: 12px; background: #fff; border-left: 3px solid #2563eb; white-space: pre-line; }
        .task-success-title { font-size: 0.85rem; font-weight: 600; margin-top: 12px; margin-bottom: 6px; color: #444; }
        .task-success-list { padding-left: 1.4rem; margin-bottom: 4px; }
        .task-success-list li { font-size: 14px; margin-bottom: 4px; color: #444; }
        .task-vocab-title { font-size: 0.8rem; font-weight: 400; margin-top: 12px; margin-bottom: 8px; }
        .task-vocab-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .task-vocab-item {
            padding: 4px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .task-vocab-item:hover { background: #eee; border-color: var(--color-text-secondary); }
        .task-vocab-item .vocab-cn { color: var(--color-text-secondary); margin-left: 6px; display: none; }
        .task-vocab-item.show-cn .vocab-cn { display: inline; }
        .reference-links { margin-bottom: 20px; padding: 12px; background: #f0f4f8; border: 1px solid var(--color-border); }
        .reference-links-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        .reference-links-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .reference-links-list a { font-size: 0.9rem; color: #2563eb; text-decoration: none; padding: 4px 0; }
        .reference-links-list a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Theme-based Writing</div>
            <div class="header-copyright"> <a href="../../../index.html">©kensirenglish.com</a></div>
        </div>
    </header>

    <main>
        <div class="theme-row">
            <label for="themeSearchInput">Theme</label>
            <div class="theme-combobox" id="themeCombobox">
                <input
                    type="text"
                    id="themeSearchInput"
                    autocomplete="off"
                    spellcheck="false"
                    aria-autocomplete="list"
                    aria-controls="themeDropdown"
                    aria-expanded="false"
                    placeholder=""
                />
                <div class="theme-dropdown" id="themeDropdown" role="listbox" aria-label="Themes A–Z"></div>
            </div>
        </div>
        <div id="taskCards"></div>
    </main>

    <script src="winter.js"></script>
    <script src="olympics.js"></script>
    <script src="astrology.js"></script>
    <script src="monalisa.js"></script>
    <script src="gamedesign.js"></script>
    <script src="communication.js"></script>
    <script src="memeculture.js"></script>
    <script src="commentaries.js"></script>
    <script src="dse_school_rules_voice.js"></script>
    <script src="dse_school_services.js"></script>
    <script src="dse_society_community.js"></script>
    <script src="kowloon_walled_city.js"></script>
    <script src="titanic.js"></script>
    <script src="homelessness.js"></script>
    <script src="dse_personal_family.js"></script>
    <script src="blackdeath.js"></script>
    <script src="parasites.js"></script>
    <script src="darkhumour.js"></script>
    <script src="letters_of_advice.js"></script>
    <script src="dreams.js"></script>
    <script src="table_manners.js"></script>
    <script src="privacy_data.js"></script>
    <script src="viruses_vaccines.js"></script>
    <script src="antarctica.js"></script>
    <script src="gene_editing.js"></script>
    <script src="online_censorship.js"></script>
    <script src="weird_sports.js"></script>
    <script src="atlantis_oceans.js"></script>
    <script src="global_warming.js"></script>
    <script src="hitlernazi.js"></script>
    <script src="australia.js"></script>
    <script src="africa2026.js"></script>
    <script src="futurewarfare.js"></script>
    <script src="cryptography.js"></script>
    <script src="breakfast.js"></script>
    <script src="celebritygossip.js"></script>
    <script src="tea.js"></script>
    <script>
        const themes = {
            winter: window.themeBasedWinter,
            olympics: window.themeBasedOlympics,
            astrology: window.themeBasedAstrology,
            monalisa: window.themeBasedMonalisa,
            gamedesign: window.themeBasedGamedesign,
            communication: window.themeBasedCommunication,
            memeculture: window.themeBasedMemeculture,
            commentaries: window.themeBasedCommentaries,
            schoolrulesvoice: window.themeBasedSchoolRulesVoice,
            schoolservices: window.themeBasedSchoolServices,
            societycommunity: window.themeBasedSocietyCommunity,
            kowloonwalledcity: window.themeBasedKowloonWalledCity,
            titanic: window.themeBasedTitanic,
            homelessness: window.themeBasedHomelessness,
            personalfamily: window.themeBasedPersonalFamily,
            blackdeath: window.themeBasedBlackDeath,
            parasites: window.themeBasedParasites,
            darkhumour: window.themeBasedDarkHumour,
            lettersofadvice: window.themeBasedLettersOfAdvice,
            dreams: window.themeBasedDreams,
            tablemanners: window.themeBasedTableManners,
            privacydata: window.themeBasedPrivacyData,
            virusesvaccines: window.themeBasedVirusesVaccines,
            antarctica: window.themeBasedAntarctica,
            geneediting: window.themeBasedGeneEditing,
            onlinecensorship: window.themeBasedOnlineCensorship,
            weirdsports: window.themeBasedWeirdSports,
            atlantisoceans: window.themeBasedAtlantisOceans,
            globalwarming: window.themeBasedGlobalWarming,
            hitlernazi: window.themeBasedHitlerNazi,
            australia: window.themeBasedAustralia,
            africa2026: window.themeBasedAfrica2026,
            futurewarfare: window.themeBasedFutureWarfare,
            cryptography: window.themeBasedCryptography,
            breakfast: window.themeBasedBreakfast,
            celebritygossip: window.themeBasedCelebrityGossip,
            tea: window.themeBasedTea
        };
        const themeSearchInput = document.getElementById("themeSearchInput");
        const themeDropdown = document.getElementById("themeDropdown");
        const taskCards = document.getElementById("taskCards");

        const themeKeys = Object.keys(themes);
        const themesSorted = themeKeys
            .map((key) => ({ key, label: themes[key].theme || key }))
            .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: "base" }));

        const params = new URLSearchParams(location.search);
        const themeFromUrl = params.get("theme");
        let selectedKey = themeKeys.includes(themeFromUrl) ? themeFromUrl : "olympics";

        function setInputClosedLabel() {
            themeSearchInput.value = themes[selectedKey] ? themes[selectedKey].theme : "";
            themeSearchInput.placeholder = "Click to search themes (A–Z)…";
        }

        function openDropdown() {
            themeDropdown.classList.add("is-open");
            themeSearchInput.setAttribute("aria-expanded", "true");
            themeSearchInput.value = "";
            themeSearchInput.placeholder = "Type to filter…";
            renderDropdownOptions(themeSearchInput.value);
        }

        function closeDropdown() {
            themeDropdown.classList.remove("is-open");
            themeSearchInput.setAttribute("aria-expanded", "false");
            setInputClosedLabel();
        }

        function renderDropdownOptions(filterText) {
            themeDropdown.innerHTML = "";
            const q = (filterText || "").trim().toLowerCase();
            const filtered = q
                ? themesSorted.filter((t) => t.label.toLowerCase().includes(q))
                : themesSorted;

            if (filtered.length === 0) {
                const empty = document.createElement("div");
                empty.className = "theme-dropdown-empty";
                empty.textContent = "No themes match your search.";
                themeDropdown.appendChild(empty);
                return;
            }

            filtered.forEach((t) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "theme-option" + (t.key === selectedKey ? " is-selected" : "");
                btn.setAttribute("role", "option");
                btn.setAttribute("aria-selected", t.key === selectedKey ? "true" : "false");
                btn.textContent = t.label;
                btn.dataset.key = t.key;
                btn.addEventListener("mousedown", (e) => {
                    e.preventDefault();
                    selectTheme(t.key);
                });
                themeDropdown.appendChild(btn);
            });
        }

        function selectTheme(key) {
            if (!themes[key]) return;
            selectedKey = key;
            const url = new URL(location.href);
            url.searchParams.set("theme", key);
            history.replaceState(null, "", url);
            render(themes[key]);
            closeDropdown();
            themeSearchInput.blur();
        }

        themeSearchInput.addEventListener("focus", () => {
            openDropdown();
        });

        themeSearchInput.addEventListener("input", () => {
            if (themeDropdown.classList.contains("is-open")) {
                renderDropdownOptions(themeSearchInput.value);
            }
        });

        themeSearchInput.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                e.preventDefault();
                closeDropdown();
                themeSearchInput.blur();
            }
        });

        document.addEventListener("click", (e) => {
            const combo = document.getElementById("themeCombobox");
            if (combo && !combo.contains(e.target)) {
                closeDropdown();
            }
        });

        function render(data) {
            taskCards.innerHTML = "";
            if (!data || !data.tasks || !data.tasks.length) return;
            if (data.referenceLinks && data.referenceLinks.length > 0) {
                const refBlock = document.createElement("div");
                refBlock.className = "reference-links";
                refBlock.innerHTML = "<div class=\"reference-links-title\">Reference (optional)</div>";
                const list = document.createElement("div");
                list.className = "reference-links-list";
                data.referenceLinks.forEach((item) => {
                    const a = document.createElement("a");
                    a.href = item.url;
                    a.target = "_blank";
                    a.rel = "noopener";
                    a.textContent = item.label;
                    list.appendChild(a);
                });
                refBlock.appendChild(list);
                taskCards.appendChild(refBlock);
            }
            data.tasks.forEach((task) => {
                const card = document.createElement("section");
                card.className = "task-card";
                const videoUrl = escapeHtml(task.videoUrl || "");
                let html = `<div class="task-title-row"><h2 class="task-title">${escapeHtml(task.title)}</h2>`;
                if (task.watchLinks && task.watchLinks.length) {
                    task.watchLinks.forEach((item) => {
                        const url = (item.url || "").replace(/"/g, "&quot;");
                        const label = escapeHtml(item.label || "Link");
                        html += `<span class="task-watch"><a href="${url}" target="_blank" rel="noopener">${label}</a></span>`;
                    });
                } else {
                    if (task.videoUrl) {
                        html += `<span class="task-watch"><a href="${videoUrl}" target="_blank" rel="noopener">watch video</a></span>`;
                    }
                    if (task.learnMoreUrl) {
                        const learnUrl = task.learnMoreUrl.replace(/"/g, "&quot;");
                        html += `<span class="task-watch"><a href="${learnUrl}" target="_blank" rel="noopener">learn more</a></span>`;
                    }
                }
                html += `</div>`;
                if (task.instructions) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<div class="task-instructions">${escapeHtml(task.instructions)}</div>`;
                    if (task.successCriteria && task.successCriteria.length) {
                        html += `<div class="task-success-title">Success criteria</div><ul class="task-success-list">`;
                        task.successCriteria.forEach((item) => {
                            html += `<li>${escapeHtml(item)}</li>`;
                        });
                        html += `</ul>`;
                    }
                } else if (task.questions && task.questions.length) {
                    if (task.context) html += `<p class="task-context">${escapeHtml(task.context)}</p>`;
                    html += `<ol class="task-questions-list">`;
                    task.questions.forEach((q) => {
                        const questionText = typeof q === "string" ? q : (q.text || "");
                        const link = typeof q === "object" && q && q.link;
                        const linkLabel = (typeof q === "object" && q && q.linkLabel) ? q.linkLabel : "Watch video";
                        let li = "<li><span class=\"question-text\">" + escapeHtml(questionText) + "</span>";
                        if (link) {
                            const safeUrl = (link + "").replace(/"/g, "&quot;");
                            const safeLabel = escapeHtml(linkLabel);
                            li += " <a href=\"" + safeUrl + "\" target=\"_blank\" rel=\"noopener\" class=\"question-video-link\">" + safeLabel + "</a>";
                        }
                        li += "</li>";
                        html += li;
                    });
                    html += `</ol>`;
                }
                if (task.referenceLinks && task.referenceLinks.length) {
                    const refTitle = escapeHtml(task.referenceLinksTitle || "Reference (optional)");
                    html += `<div class="reference-links"><div class="reference-links-title">${refTitle}</div><div class="reference-links-list">`;
                    task.referenceLinks.forEach((item) => {
                        const url = (item.url || "").replace(/"/g, "&quot;");
                        const label = escapeHtml(item.label || "Link");
                        html += `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
                    });
                    html += `</div></div>`;
                }
                card.innerHTML = html;
                if (task.vocab && task.vocab.length) {
                    const vocabTitle = document.createElement("div");
                    vocabTitle.className = "task-vocab-title";
                    vocabTitle.textContent = "Useful words";
                    card.appendChild(vocabTitle);
                    const vocabList = document.createElement("div");
                    vocabList.className = "task-vocab-list";
                    task.vocab.forEach((item) => {
                        const span = document.createElement("span");
                        span.className = "task-vocab-item";
                        span.innerHTML = escapeHtml(item.en) + '<span class="vocab-cn">' + escapeHtml(item.cn) + "</span>";
                        span.addEventListener("click", () => span.classList.toggle("show-cn"));
                        vocabList.appendChild(span);
                    });
                    card.appendChild(vocabList);
                }
                taskCards.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        setInputClosedLabel();
        render(themes[selectedKey]);
    </script>
</body>
</html>
