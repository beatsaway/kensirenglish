<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE 主題詞彙 + 寫作 | 英文</title>
    <link rel="stylesheet" href="../../../main.css">
    <style>
        :root {
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --color-bg: #ffffff;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
            --accent: #0f766e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: inherit; background: var(--color-bg); color: #111; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px 32px;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }
        .header-left { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .header-label { font-size: 14px; font-weight: 600; }
        .header-copyright { font-size: 10px; color: var(--color-text-secondary); }
        .header-copyright a { color: inherit; text-decoration: none; }
        main { padding: 24px 24px 48px; max-width: 800px; margin: 0 auto; width: 100%; }
        .intro-bi { font-size: 0.95rem; margin-bottom: 20px; }
        .intro-bi .intro-line-en { display: block; color: var(--color-text-secondary); }
        .intro-bi .intro-line-zh { display: block; margin-top: 6px; color: #4a4a4a; line-height: 1.45; }
        .theme-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 24px; }
        .theme-row label { font-size: 14px; font-weight: 600; }
        .theme-row select { padding: 8px 12px; border: 1px solid #ddd; font-size: 14px; min-width: 220px; }

        .theme-hero { margin-bottom: 20px; }
        .theme-hero h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
        .theme-hero-title-en { display: block; color: #111; }
        .theme-hero-title-zh { display: block; font-size: 1.08rem; font-weight: 600; color: #1f2937; }
        .theme-hero p.theme-hero-sub { font-size: 0.9rem; color: var(--color-text-secondary); margin: 6px 0 0; }
        .theme-hero p.theme-hero-sub-zh { font-size: 0.9rem; color: #4b5563; line-height: 1.5; margin: 6px 0 0; }

        .vocab-section { margin-bottom: 20px; }
        .vocab-section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--color-text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
        }
        .vocab-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0; border-bottom: 1px solid var(--color-border); padding-bottom: 0; }
        .vocab-tabs button {
            appearance: none;
            font: inherit;
            font-size: 0.9rem;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-bottom: none;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            margin-bottom: -1px;
        }
        .vocab-tabs button:hover { background: #e8e8e8; }
        .vocab-tabs button[aria-selected="true"] {
            background: #fafafa;
            color: #111;
            font-weight: 600;
            border-bottom: 1px solid #fafafa;
            z-index: 1;
        }
        .vocab-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .vocab-panel {
            border: 1px solid var(--color-border);
            border-top: 1px solid var(--color-border);
            background: #fafafa;
            padding: 16px;
            min-height: 8rem;
        }
        .vocab-panel[hidden] { display: none !important; }
        .vocab-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .vocab-table { width: 100%; min-width: 28rem; border-collapse: collapse; font-size: 14px; }
        .vocab-table th,
        .vocab-table td { border: 1px solid var(--color-border); padding: 8px 10px; text-align: left; vertical-align: top; }
        .vocab-table th { background: #f0f0f0; font-weight: 600; }
        .vocab-bi { display: flex; flex-direction: column; gap: 4px; }
        .vocab-line-en { font-weight: 500; color: #0a4d40; }
        .vocab-line-zh { font-size: 0.88em; color: #4a4a4a; line-height: 1.45; }

        .vocab-list { list-style: none; font-size: 14px; }
        .vocab-list li { border-bottom: 1px solid #e8e8e8; padding: 10px 0; }
        .vocab-list li:last-child { border-bottom: none; }
        .vocab-term-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 4px; }
        .vocab-term-en { font-weight: 500; }
        .vocab-term-zh { font-size: 0.9em; color: #0a4d40; }
        .vocab-mean-block { display: flex; flex-direction: column; gap: 2px; padding-left: 0; }
        .vocab-mean-en { }
        .vocab-mean-zh { font-size: 0.9em; color: #4a4a4a; line-height: 1.45; }

        .topic-sentences { list-style: none; font-size: 14px; }
        .topic-sentences li {
            padding: 10px 12px 10px 14px;
            margin-bottom: 8px;
            background: #fff;
            border-left: 3px solid var(--accent);
        }
        .topic-sentences .vocab-line-en { display: block; color: #111; font-weight: 400; }
        .topic-sentences .vocab-line-zh { display: block; margin-top: 6px; color: #444; }

        .task-subhead { font-size: 0.8rem; color: var(--color-text-secondary); margin-top: 24px; margin-bottom: 12px; }

        .task-card {
            border: 1px solid var(--color-border);
            background: #f8f8f8;
            padding: 16px;
            margin-bottom: 16px;
        }
        .task-meta { font-size: 0.8rem; color: var(--color-text-secondary); margin-bottom: 6px; }
        .task-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
        .task-context { font-size: 14px; color: #444; margin-bottom: 10px; }
        .task-instructions { font-size: 14px; padding: 12px; background: #fff; border-left: 3px solid #2563eb; white-space: pre-line; }
        .task-vocab-hint {
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px 12px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-left: 3px solid #166534;
            color: #111827;
        }
        .task-vocab-hint strong {
            color: #0f172a;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .task-vocab-apply-bi {
            display: block;
            color: #111827;
            line-height: 1.55;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">DSE 主題詞彙 + 寫作</div>
            <div class="header-copyright"><a href="../../../index.html">©kensirenglish.com</a> · <a href="../index.html">Writing 寫作</a></div>
        </div>
    </header>

    <main>
        <p class="intro-bi">
            <span class="intro-line-en" lang="en">Choose a DSE-style theme, study the bilingual vocabulary in the tabs, then try the Paper 2–style practice tasks below.</span>
            <span class="intro-line-zh" lang="zh-Hant">選定一個 DSE 常考主題，於分頁內研習雙語詞彙，再依序完成下方參考卷二寫作而設的模擬練習。</span>
        </p>
        <div class="theme-row">
            <label for="themeSelect">Theme 主題</label>
            <select id="themeSelect" aria-label="Choose a writing theme"></select>
        </div>
        <div id="vocabAndTasks"></div>
    </main>

    <script src="social_media.js"></script>
    <script src="environment_climate.js"></script>
    <script src="education_school.js"></script>
    <script src="globalization_culture.js"></script>
    <script src="health_mind_care.js"></script>
    <script src="technology_future.js"></script>
    <script src="housing_city_life.js"></script>
    <script>
        (function () {
            const themes = {
                socialmedia: window.dseVocabSocialMedia,
                environment: window.dseVocabEnvironmentClimate,
                education: window.dseVocabEducationSchool,
                globalculture: window.dseVocabGlobalizationCulture,
                health: window.dseVocabHealthMindCare,
                techfuture: window.dseVocabTechnologyFuture,
                housing: window.dseVocabHousingCityLife
            };
            const themeSelect = document.getElementById("themeSelect");
            const root = document.getElementById("vocabAndTasks");

            const themeKeys = Object.keys(themes);
            themeKeys.forEach((key) => {
                const opt = document.createElement("option");
                opt.value = key;
                opt.textContent = (themes[key] && themes[key].theme) ? themes[key].theme : key;
                themeSelect.appendChild(opt);
            });

            const params = new URLSearchParams(location.search);
            const themeFromUrl = params.get("theme");
            themeSelect.value = themeKeys.includes(themeFromUrl) ? themeFromUrl : themeKeys[0];

            function escapeHtml(text) {
                if (text == null) return "";
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            function biCell(en, zh) {
                return (
                    "<div class=\"vocab-bi\">" +
                    "<span class=\"vocab-line-en\">" + escapeHtml(en) + "</span>" +
                    "<span class=\"vocab-line-zh\" lang=\"zh-Hant\">" + escapeHtml(zh || "") + "</span>" +
                    "</div>"
                );
            }

            function buildVerbsTableHTML(verbs) {
                if (!verbs || !verbs.length) return "<p class=\"vocab-line-zh\">（此主題暫無動詞表）</p>";
                let html =
                    "<p class=\"vocab-section-title\">High-frequency verbs 常用動詞</p>" +
                    "<div class=\"vocab-table-wrap\">" +
                    "<table class=\"vocab-table\"><thead><tr>" +
                    "<th>Word 詞彙</th><th>Meaning 意義</th><th>Example 例句／片語</th>" +
                    "</tr></thead><tbody>";
                verbs.forEach((r) => {
                    const wz = r.wordZh != null ? r.wordZh : "";
                    const mz = r.meaningZh != null ? r.meaningZh : "";
                    const ez = r.exampleZh != null ? r.exampleZh : "";
                    const exEn = '"' + r.example + '"';
                    html += "<tr><td>" + biCell(r.word, wz) + "</td><td>" + biCell(r.meaning, mz) + "</td><td>" + biCell(exEn, ez) + "</td></tr>";
                });
                html += "</tbody></table></div>";
                return html;
            }

            function buildNounOrAdjListHTML(items) {
                if (!items || !items.length) return "<p class=\"vocab-line-zh\">（暫無）</p>";
                let html = "<ul class=\"vocab-list\">";
                items.forEach((r) => {
                    const wz = r.wordZh != null ? r.wordZh : "";
                    const mz = r.meaningZh != null ? r.meaningZh : "";
                    html += "<li>" +
                        "<div class=\"vocab-term-row\">" +
                        "<span class=\"vocab-term-en\">" + escapeHtml(r.word) + "</span>" +
                        (wz ? "<span class=\"vocab-term-zh\" lang=\"zh-Hant\">" + escapeHtml(wz) + "</span>" : "") +
                        "</div>" +
                        "<div class=\"vocab-mean-block\">" +
                        "<span class=\"vocab-mean-en\">" + escapeHtml(r.meaning) + "</span>" +
                        (mz ? "<span class=\"vocab-mean-zh\" lang=\"zh-Hant\">" + escapeHtml(mz) + "</span>" : "") +
                        "</div>" +
                        "</li>";
                });
                html += "</ul>";
                return html;
            }

            function parseTopic(s) {
                if (s && typeof s === "object" && s.en) return { en: s.en, zh: s.zh || "" };
                if (typeof s === "string") return { en: s, zh: "" };
                return { en: "", zh: "" };
            }

            function buildTopicSentencesHTML(sentences) {
                if (!sentences || !sentences.length) return "<p class=\"vocab-line-zh\">（暫無）</p>";
                let html = "<ul class=\"topic-sentences\">";
                sentences.forEach((s) => {
                    const t = parseTopic(s);
                    html += "<li>" +
                        "<span class=\"vocab-line-en\" lang=\"en\">" + escapeHtml(t.en) + "</span>" +
                        (t.zh ? "<span class=\"vocab-line-zh\" lang=\"zh-Hant\">" + escapeHtml(t.zh) + "</span>" : "") +
                        "</li>";
                });
                html += "</ul>";
                return html;
            }

            function initVocabTabs(sectionEl) {
                const tablist = sectionEl.querySelector('[role="tablist"]');
                if (!tablist) return;
                const tabs = Array.prototype.slice.call(tablist.querySelectorAll('[role="tab"]'));
                const tabIds = tabs.map(function (t) { return t.getAttribute("aria-controls"); });
                const panels = tabIds.map(function (id) { return document.getElementById(id); }).filter(Boolean);

                function focusTab(index) {
                    const i = (index + tabs.length) % tabs.length;
                    tabs.forEach(function (tab, j) {
                        const selected = j === i;
                        tab.setAttribute("aria-selected", selected ? "true" : "false");
                        tab.setAttribute("tabindex", selected ? "0" : "-1");
                        if (panels[j]) {
                            if (selected) panels[j].removeAttribute("hidden");
                            else panels[j].setAttribute("hidden", "hidden");
                        }
                    });
                    tabs[i].focus();
                }

                function onTabKeydown(e) {
                    const idx = tabs.indexOf(document.activeElement);
                    if (idx < 0) return;
                    var next = idx;
                    if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); next = idx + 1; }
                    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); next = idx - 1; }
                    else if (e.key === "Home") { e.preventDefault(); next = 0; }
                    else if (e.key === "End") { e.preventDefault(); next = tabs.length - 1; }
                    else return;
                    focusTab(next);
                }

                tablist.addEventListener("keydown", onTabKeydown);
                tabs.forEach(function (tab, i) {
                    tab.addEventListener("click", function () { focusTab(i); });
                });
            }

            function buildVocabSectionHTML(b) {
                if (!b) return "";
                return (
                    "<section class=\"vocab-section\" aria-label=\"Theme vocabulary 主題詞彙\">" +
                    "<p class=\"vocab-section-title\">Vocabulary 詞彙</p>" +
                    "<div role=\"tablist\" aria-label=\"Vocabulary sections 詞彙分類\">" +
                    "<button type=\"button\" role=\"tab\" id=\"dse-vocab-tab-verbs\" aria-selected=\"true\" aria-controls=\"dse-vocab-panel-verbs\" tabindex=\"0\">常用動詞 · Verbs</button>" +
                    "<button type=\"button\" role=\"tab\" id=\"dse-vocab-tab-nouns\" aria-selected=\"false\" aria-controls=\"dse-vocab-panel-nouns\" tabindex=\"-1\">重要名詞 · Nouns</button>" +
                    "<button type=\"button\" role=\"tab\" id=\"dse-vocab-tab-adj\" aria-selected=\"false\" aria-controls=\"dse-vocab-panel-adj\" tabindex=\"-1\">實用形容詞 · Adjectives</button>" +
                    "<button type=\"button\" role=\"tab\" id=\"dse-vocab-tab-ph\" aria-selected=\"false\" aria-controls=\"dse-vocab-panel-ph\" tabindex=\"-1\">實用句 · Phrases</button>" +
                    "</div>" +
                    "<div id=\"dse-vocab-panel-verbs\" role=\"tabpanel\" aria-labelledby=\"dse-vocab-tab-verbs\" class=\"vocab-panel\">" + buildVerbsTableHTML(b.verbs) + "</div>" +
                    "<div id=\"dse-vocab-panel-nouns\" role=\"tabpanel\" aria-labelledby=\"dse-vocab-tab-nouns\" class=\"vocab-panel\" hidden>" +
                    "<p class=\"vocab-section-title\">Key nouns 重要名詞</p>" + buildNounOrAdjListHTML(b.nouns) + "</div>" +
                    "<div id=\"dse-vocab-panel-adj\" role=\"tabpanel\" aria-labelledby=\"dse-vocab-tab-adj\" class=\"vocab-panel\" hidden>" +
                    "<p class=\"vocab-section-title\">Useful adjectives 實用形容詞</p>" + buildNounOrAdjListHTML(b.adjectives) + "</div>" +
                    "<div id=\"dse-vocab-panel-ph\" role=\"tabpanel\" aria-labelledby=\"dse-vocab-tab-ph\" class=\"vocab-panel\" hidden>" +
                    "<p class=\"vocab-section-title\">Useful phrases (topic / thesis sentences) 實用句子</p>" + buildTopicSentencesHTML(b.topicSentences) + "</div>" +
                    "</section>"
                );
            }

            function render(data) {
                root.innerHTML = "";
                if (!data) return;
                const hero = document.createElement("div");
                hero.className = "theme-hero";
                const h1 = document.createElement("h1");
                h1.setAttribute("lang", "en");
                const titleEn = document.createElement("span");
                titleEn.className = "theme-hero-title-en";
                titleEn.textContent = data.theme || "Theme";
                h1.appendChild(titleEn);
                if (data.themeZh) {
                    const titleZh = document.createElement("span");
                    titleZh.className = "theme-hero-title-zh";
                    titleZh.setAttribute("lang", "zh-Hant");
                    titleZh.textContent = data.themeZh;
                    h1.appendChild(titleZh);
                }
                hero.appendChild(h1);
                if (data.tagline) {
                    const subEn = document.createElement("p");
                    subEn.className = "theme-hero-sub";
                    subEn.setAttribute("lang", "en");
                    subEn.textContent = data.tagline;
                    hero.appendChild(subEn);
                }
                if (data.taglineZh) {
                    const subZh = document.createElement("p");
                    subZh.className = "theme-hero-sub-zh";
                    subZh.setAttribute("lang", "zh-Hant");
                    subZh.textContent = data.taglineZh;
                    hero.appendChild(subZh);
                }
                root.appendChild(hero);

                const b = data.bank;
                if (b) {
                    const wrap = document.createElement("div");
                    wrap.innerHTML = buildVocabSectionHTML(b).trim();
                    const sec = wrap.firstElementChild;
                    if (sec) {
                        root.appendChild(sec);
                        initVocabTabs(sec);
                    }
                }

                if (data.tasks && data.tasks.length) {
                    const h = document.createElement("div");
                    h.className = "task-subhead";
                    h.textContent = "✍  Writing practice (Paper 2 style)  ·  參考卷二寫作之模擬練習（可配合上方詞彙）";
                    root.appendChild(h);
                    data.tasks.forEach((task) => {
                        const card = document.createElement("section");
                        card.className = "task-card";
                        const meta = [task.part, task.genre].filter(Boolean).join(" · ");
                        const metaLine = document.createElement("p");
                        metaLine.className = "task-meta";
                        metaLine.textContent = meta;
                        const t = document.createElement("h2");
                        t.className = "task-title";
                        t.id = String(task.id || "");
                        t.textContent = task.title || "Task";
                        card.appendChild(metaLine);
                        card.appendChild(t);
                        if (task.context) {
                            const c = document.createElement("p");
                            c.className = "task-context";
                            c.textContent = task.context;
                            card.appendChild(c);
                        }
                        if (task.instructions) {
                            const ins = document.createElement("div");
                            ins.className = "task-instructions";
                            ins.textContent = task.instructions;
                            card.appendChild(ins);
                        }
                        if (task.vocabToApply) {
                            const v = document.createElement("p");
                            v.className = "task-vocab-hint";
                            const head = document.createElement("strong");
                            head.textContent = "Vocab to work into your piece 建議用詞";
                            v.appendChild(head);
                            const line = document.createElement("span");
                            line.className = "task-vocab-apply-bi";
                            line.setAttribute("lang", "zxx");
                            line.textContent = task.vocabToApply;
                            v.appendChild(line);
                            card.appendChild(v);
                        }
                        root.appendChild(card);
                    });
                }
            }

            themeSelect.addEventListener("change", () => {
                const k = themeSelect.value;
                const url = new URL(location.href);
                url.searchParams.set("theme", k);
                history.replaceState(null, "", url);
                render(themes[k]);
            });

            render(themes[themeSelect.value]);
        })();
    </script>
</body>
</html>
