<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing | 寫作</title>
    <link rel="stylesheet" href="../../main.css">
    <style>
        :root {
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-surface: #f6f6f6;
            --color-text: #111111;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
            --max-width: 960px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }

        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-label {
            font-size: 14px;
            font-weight: 600;
        }

        .header-copyright {
            font-size: 10px;
            color: var(--color-text-secondary);
        }

        .header-copyright a {
            color: inherit;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: var(--space-3) var(--space-4);
        }

        .content-wrap {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .option-card {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: var(--space-3);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .option-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .option-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .option-link {
            align-self: flex-start;
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            text-decoration: none;
            color: inherit;
            font-size: 0.95rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .option-link:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Writing <span style="color: var(--color-text-secondary);">•</span> 寫作</div>
            <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
        </div>
    </header>

    <main>
        <div class="content-wrap">
            <section class="option-card">
                <div class="option-title">Four-Panel Comic</div>
                <div class="option-desc">Choose a 4-panel image set to plan and write a story.</div>
                <a class="option-link" href="4frame/index.html">Open</a>
            </section>
        </div>
    </main>
</body>
</html>
