<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informal Letters</title>
    <link rel="stylesheet" href="../../../main.css">
    <style>
        :root {
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --color-bg: #ffffff;
            --color-surface: #f6f6f6;
            --color-text: #111111;
            --color-text-secondary: #666666;
            --color-border: #dddddd;
            --max-width: 960px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: inherit;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: 6px var(--space-4);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg);
        }

        .header-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dataset-select {
            padding: 6px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            font-size: 0.95rem;
        }

        .header-label {
            font-size: 14px;
            font-weight: 600;
        }

        .header-copyright {
            font-size: 10px;
            color: var(--color-text-secondary);
        }

        .header-copyright a {
            color: inherit;
            text-decoration: none;
        }

        main {
            flex: 1;
            padding: var(--space-3) var(--space-4);
        }

        .content-wrap {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .prompt-card {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            padding: var(--space-3);
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .prompt-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .prompt-desc {
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }

        .story-lines {
            margin: 0;
            border: none;
            background: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .story-note {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }

        .story-line {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }

        .story-line-cn {
            font-size: 0.95rem;
        }

        .story-line-en {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            display: none;
        }

        .story-line.show-en .story-line-en {
            display: block;
        }

        .vocab-section {
            margin-top: 0;
        }

        .vocab-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: var(--space-2);
        }

        .vocab-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .vocab-item {
            padding: 4px 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg);
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .vocab-item:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }

        .vocab-cn {
            color: var(--color-text-secondary);
            margin-left: 6px;
            display: none;
        }

        .vocab-item.show-cn .vocab-cn {
            display: inline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="header-label">Informal Letters</div>
            <div class="header-copyright"><a href="../../../index.html">©kensirenglish.com</a></div>
        </div>
        <div class="header-controls">
            <select id="promptSelect" class="dataset-select"></select>
        </div>
    </header>

    <main>
        <div class="content-wrap">
            <section class="prompt-card">
                <div id="promptTitle" class="prompt-title"></div>
                <div id="promptDescCn" class="prompt-desc"></div>
                <div id="promptDescEn" class="prompt-desc"></div>
            </section>
            <section class="vocab-section" id="vocabSection">
                <div class="vocab-title">Vocabulary 詞彙</div>
                <div id="vocabList" class="vocab-list"></div>
            </section>
            <div id="storyLines" class="story-lines"></div>
        </div>
    </main>

    <script src="batch1.js"></script>
    <script>
        const promptSelect = document.getElementById('promptSelect');
        const promptTitle = document.getElementById('promptTitle');
        const promptDescCn = document.getElementById('promptDescCn');
        const promptDescEn = document.getElementById('promptDescEn');
        const storyLines = document.getElementById('storyLines');
        const vocabSection = document.getElementById('vocabSection');
        const vocabList = document.getElementById('vocabList');
        const batchData = window.informalLettersBatch1 || { prompts: [] };
        const prompts = batchData.prompts || [];

        function renderLines(lines) {
            storyLines.innerHTML = '';
            if (!lines.length) {
                storyLines.style.display = 'none';
                return;
            }
            storyLines.style.display = 'flex';
            const noteEl = document.createElement('div');
            noteEl.className = 'story-note';
            noteEl.textContent = 'For reference only 僅供參考';
            storyLines.appendChild(noteEl);
            lines.forEach((line) => {
                const lineEl = document.createElement('div');
                lineEl.className = 'story-line';
                lineEl.innerHTML = `
                    <div class="story-line-cn">${line.cn}</div>
                    <div class="story-line-en">${line.en.replace(/^[^\p{L}\p{N}]+/u, '')}</div>
                `;
                lineEl.addEventListener('click', () => {
                    lineEl.classList.toggle('show-en');
                });
                storyLines.appendChild(lineEl);
            });
        }

        function renderVocab(vocab) {
            vocabList.innerHTML = '';
            if (!vocab.length) {
                vocabSection.style.display = 'none';
                return;
            }
            vocabSection.style.display = 'block';
            vocab.forEach((item) => {
                const vocabEl = document.createElement('span');
                vocabEl.className = 'vocab-item';
                vocabEl.innerHTML = `${item.en}<span class="vocab-cn">${item.cn}</span>`;
                vocabEl.addEventListener('click', () => {
                    vocabEl.classList.toggle('show-cn');
                });
                vocabList.appendChild(vocabEl);
            });
        }

        function setPrompt(prompt) {
            promptTitle.textContent = prompt.label;
            promptDescCn.textContent = prompt.prompt?.cn || '';
            promptDescEn.textContent = prompt.prompt?.en || '';
            renderLines(prompt.lines || []);
            renderVocab(prompt.vocab || []);
        }

        prompts.forEach((prompt) => {
            const option = document.createElement('option');
            option.value = prompt.label;
            option.textContent = prompt.label;
            promptSelect.appendChild(option);
        });

        promptSelect.addEventListener('change', (event) => {
            const selected = prompts.find((prompt) => prompt.label === event.target.value);
            if (selected) {
                setPrompt(selected);
            }
        });

        const initialIndex = prompts.length ? Math.floor(Math.random() * prompts.length) : 0;
        const initialPrompt = prompts[initialIndex];
        if (initialPrompt) {
            promptSelect.value = initialPrompt.label;
            setPrompt(initialPrompt);
        }
    </script>
</body>
</html>
