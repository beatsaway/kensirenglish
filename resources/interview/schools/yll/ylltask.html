<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Box From 100×100 cm Sheet (Simple)</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f6f7fb;
        color: #111;
        width: 100%;
        overflow-x: hidden;
      }
      header {
        padding: 16px 20px 0 20px;
      }
      h1 {
        margin: 0 0 6px 0;
        font-size: 20px;
      }
      .panel {
        background: transparent;
        border-radius: 0;
        padding: 14px;
        box-shadow: none;
        margin: 0;
        font-size: 14px;
      }
      .panel-info {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 5vh;
        z-index: 2;
        margin-top: 0;
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.9);
      }
      label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }
      input[type="range"] {
        width: 70%;
      }
      .row {
        margin-top: 8px;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .value {
        font-weight: 700;
      }
      .highlight-base {
        color: #1c62f2;
        font-weight: 700;
      }
      .highlight-height {
        color: #eb3b5a;
        font-weight: 700;
      }
      .highlight-x {
        color: #20bf6b;
        font-weight: 700;
      }
      .reveal-line {
        margin: 6px 0;
      }
      .reveal-cn {
        color: #555;
        font-size: 14px;
      }
      #revealBtn {
        position: fixed;
        left: 0;
        bottom: env(safe-area-inset-bottom, 0px);
        width: 100vw;
        height: 5vh;
        margin: 0;
        border-radius: 0;
        z-index: 3;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal {
        background: #fff;
        border-radius: 10px;
        padding: 16px;
        width: min(360px, 90vw);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .modal h2 {
        margin: 0 0 8px 0;
        font-size: 18px;
      }
      .modal p {
        margin: 6px 0;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }
      .modal-close {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #1c62f2;
        color: #fff;
        cursor: pointer;
      }
      .reveal-hidden {
        display: none;
      }
      button {
        margin-top: 8px;
        padding: 8px 12px;
        border: 0;
        border-radius: 6px;
        background: #1c62f2;
        color: #fff;
        cursor: pointer;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
      }
      @media (max-width: 900px) {
        .panel {
          padding: 12px;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
    </header>

    <div id="scene"></div>

    <div class="panel panel-info">
        <div id="revealLines"></div>
        <div id="step-cut" class="reveal-hidden">
          <div class="slider-row">
            <input id="cut" type="range" min="1" max="99" step="0.1" value="66.7" />
            <button id="maxBtn">Set</button>
          </div>
        </div>
        <div id="step-x" class="row reveal-hidden">
          <span class="highlight-x">x</span> =
          <span id="xValue" class="value">66.7</span> cm
        </div>
        <div id="step-base" class="row reveal-hidden">
          <span class="highlight-base">Base</span> =
          <span class="highlight-x">x</span>² =
          <span id="baseValue" class="value">66.7</span> cm ×
          <span id="baseValue2" class="value">66.7</span> cm
        </div>
        <div id="step-height" class="row reveal-hidden">
          <span class="highlight-height">Height</span> = (100 −
          <span class="highlight-x">x</span>) / 2 =
          <span id="heightValue" class="value">16.7</span> cm
        </div>
        <div id="step-volume" class="row reveal-hidden">
          Volume =
          <span id="volBase" class="value">66.7</span>
          ×
          <span id="volHeight" class="value">16.7</span> =
          <span id="volValue" class="value">74074.1</span>
          cm³
        </div>
        <div id="step-buttons" class="reveal-hidden">
          <button id="unfoldBtn">fold</button>
        </div>
        <button id="revealBtn" aria-label="Show next line">▶</button>
        <div id="panelBottomAnchor"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

      const SHEET_SIZE = 100;
      const computeMaxX = () => 50;

      const xInput = document.getElementById("cut");
      const xValue = document.getElementById("xValue");
      const baseValue = document.getElementById("baseValue");
      const baseValue2 = document.getElementById("baseValue2");
      const heightValue = document.getElementById("heightValue");
      const volValue = document.getElementById("volValue");
      const volBase = document.getElementById("volBase");
      const volHeight = document.getElementById("volHeight");
      const maxBtn = document.getElementById("maxBtn");
      const unfoldBtn = document.getElementById("unfoldBtn");
      const stepCut = document.getElementById("step-cut");
      const stepX = document.getElementById("step-x");
      const stepBase = document.getElementById("step-base");
      const stepHeight = document.getElementById("step-height");
      const stepVolume = document.getElementById("step-volume");
      const stepButtons = document.getElementById("step-buttons");
      const revealLines = document.getElementById("revealLines");
      const revealBtn = document.getElementById("revealBtn");
      const panelInfo = document.querySelector(".panel-info");
      const panelBottomAnchor = document.getElementById("panelBottomAnchor");

      const modalBackdrop = document.createElement("div");
      modalBackdrop.className = "modal-backdrop";
      modalBackdrop.innerHTML = `
        <div class="modal" role="dialog" aria-modal="true">
          <h2>Max Value</h2>
          <p id="modalText"></p>
          <div class="modal-actions">
            <button class="modal-close" id="modalClose">OK</button>
          </div>
        </div>
      `;
      document.body.appendChild(modalBackdrop);
      const modalText = modalBackdrop.querySelector("#modalText");
      const modalClose = modalBackdrop.querySelector("#modalClose");
      const openModal = (text) => {
        modalText.textContent = text;
        modalBackdrop.style.display = "flex";
      };
      const closeModal = () => {
        modalBackdrop.style.display = "none";
      };
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });
      modalClose.addEventListener("click", closeModal);

      const steps = [
        {
          type: "text",
          en: "Given that material is 100 × 100 cm, we need to make the biggest box with double layered base.",
          cn: "材料係 100 × 100 cm，題目要求同學做一個最大體積嘅雙層底嘅盒。",
        },
        {
          type: "text",
          en: "Let the box base side be x.",
          cn: "首先設盒底邊長係 x。",
          onShow: () => setBaseEdgeHighlight(true),
        },
        {
          type: "text",
          en: "Height of the box will be (100 − x) / 2.",
          cn: "咁盒嘅高度就會係 (100 − x) / 2。",
          onShow: () => setCornerEdgeHighlight(true),
        },
        {
          type: "text",
          en: "Box base area will be x².",
          cn: "盒底面積就係 x²。",
          onShow: () => setBasePlaneHighlight(true),
        },
        {
          type: "text",
          en: "Box volume will be base × height = x²(100 − x) / 2.",
          cn: "盒體積所以就係底乘高 = x²(100 − x) / 2。",
        },
        {
          type: "text",
          en: "Since the base is double layered, the base area should equal the total area of the 4 small squares.",
          cn: "因為盒底要做雙層，底面積要等於四個小正方形嘅總面積。",
          onShow: () => {
            setCornerPlaneHighlight(true);
            animateSliderTo(50);
          },
        },
        {
          type: "text",
          en: "x² = 4 × [ (100 − x) / 2 ]²",
          cn: "",
          noCn: true,
        },
        {
          type: "text",
          en: "x = 50 cm",
          cn: "",
          noCn: true,
          scrollBottom: true,
        },
        {
          type: "showGroup",
          els: [stepBase, stepHeight, stepVolume, stepCut, stepButtons],
          onShow: () => {
            location.hash = "#unfoldBtn";
          },
        },
      ];
      let revealIndex = 0;
      let isTyping = false;
      let skipTyping = false;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let sliderAnimating = false;
      const animateSliderTo = (target) => {
        if (sliderAnimating) return;
        sliderAnimating = true;
        const start = parseFloat(xInput.value);
        const duration = 2500;
        const startTime = performance.now();
        const step = (now) => {
          const t = Math.min(1, (now - startTime) / duration);
          const value = start + (target - start) * t;
          xInput.value = value.toFixed(1);
          update();
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            sliderAnimating = false;
          }
        };
        requestAnimationFrame(step);
      };
      const typeText = async (el, text, delay) => {
        el.textContent = "";
        for (let i = 0; i < text.length; i += 1) {
          if (skipTyping) {
            el.textContent = text;
            return;
          }
          el.textContent += text[i];
          await sleep(delay);
        }
      };
      const highlightLine = (text) =>
        text
          .replace("base", '<span class="highlight-base">base</span>')
          .replace(/\bheight\b/g, '<span class="highlight-height">height</span>')
          .replace("Height", '<span class="highlight-height">Height</span>')
          .replace(/\bx\b/g, '<span class="highlight-x">x</span>');
      const renderNextLine = async () => {
        if (revealIndex >= steps.length) return;
        if (isTyping) {
          skipTyping = true;
          return;
        }
        isTyping = true;
        const step = steps[revealIndex];
        if (step.type === "text") {
          const wrapper = document.createElement("div");
          wrapper.id = `line-${revealIndex}`;
          wrapper.className = "reveal-line";
          wrapper.innerHTML = `
            <div class="reveal-en"></div>
            <div class="reveal-cn"></div>
          `;
          revealLines.appendChild(wrapper);
          const enEl = wrapper.querySelector(".reveal-en");
          const cnEl = wrapper.querySelector(".reveal-cn");
          await typeText(enEl, step.en, 30);
          enEl.innerHTML = highlightLine(step.en);
          if (step.noCn) {
            cnEl.textContent = "";
          } else {
            await typeText(cnEl, step.cn, 30);
          }
          if (step.scrollBottom && panelInfo && panelBottomAnchor) {
            panelInfo.scrollTop = panelBottomAnchor.offsetTop;
          } else {
            location.hash = `#${wrapper.id}`;
          }
          if (step.onShow) step.onShow();
        } else if (step.type === "show") {
          step.el.classList.remove("reveal-hidden");
        } else if (step.type === "showGroup") {
          for (const el of step.els) {
            el.classList.remove("reveal-hidden");
          }
          if (step.onShow) step.onShow();
        }
        revealIndex += 1;
        skipTyping = false;
        if (revealIndex >= steps.length) {
          revealBtn.remove();
          isTyping = false;
          return;
        }
        isTyping = false;
      };
      revealBtn.addEventListener("click", renderNextLine);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf6f7fb);

      const camera = new THREE.PerspectiveCamera(45, 1, 1, 1000);
      camera.position.set(190.2, 167.7, 71.7);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      const container = document.getElementById("scene");
      container.appendChild(renderer.domElement);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(35.1, -17.8, 11.7);

      window.addEventListener("keydown", (e) => {
        if (e.key.toLowerCase() !== "c") return;
        const p = camera.position;
        const t = controls.target;
        console.log(
          `camera.position.set(${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)});`
        );
        console.log(`controls.target.set(${t.x.toFixed(1)}, ${t.y.toFixed(1)}, ${t.z.toFixed(1)});`);
      });

      const light = new THREE.DirectionalLight(0xffffff, 0.9);
      light.position.set(1, 2, 1);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));


      const boxGroup = new THREE.Group();
      boxGroup.position.y = 20;
      scene.add(boxGroup);

      const planeMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.6,
        metalness: 0.0,
        side: THREE.DoubleSide,
      });
      const basePlaneMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.6,
        metalness: 0.0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.3,
      });
      const cornerPlaneMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.6,
        metalness: 0.0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.3,
      });
      const edgeMaterial = new THREE.LineBasicMaterial({
        color: 0x000000,
        linewidth: 1,
      });
      const baseEdgeMaterial = new THREE.LineBasicMaterial({
        color: 0x000000,
        linewidth: 2,
      });
      const cornerEdgeMaterial = new THREE.LineBasicMaterial({
        color: 0x000000,
        linewidth: 2,
      });

      const sidePivots = [];
      const cornerSquares = [];
      const cornerEdgeLines = [];
      let cornerStart = [];
      let cornerTarget = [];
      let isUnfolded = true;
      let targetAngle = 0;

      const addEdges = (mesh, material = edgeMaterial) => {
        const edges = new THREE.EdgesGeometry(mesh.geometry);
        const line = new THREE.LineSegments(edges, material);
        mesh.add(line);
        return line;
      };

      const updateCornerVisibility = () => {
        for (const sq of cornerSquares) {
          sq.visible = true;
        }
      };

      const setCornerEdgeHighlight = (enabled) => {
        cornerEdgeOn = enabled;
        cornerEdgeMaterial.color.set(enabled ? 0xeb3b5a : 0x000000);
      };

      const updateCornerTransforms = (progress) => {
        const lift = Math.sin(progress * Math.PI) * 12;
        const baseLift = 1.5 * progress;
        for (let i = 0; i < cornerSquares.length; i += 1) {
          const sq = cornerSquares[i];
          const s = cornerStart[i];
          const t = cornerTarget[i];
          const x = s.x + (t.x - s.x) * progress;
          const z = s.z + (t.z - s.z) * progress;
          sq.position.set(x, s.y + baseLift + lift, z);
        }
      };

      let baseEdgeLine = null;
      let basePlane = null;
      let baseEdgeOn = false;
      let basePlaneOn = false;
      let cornerEdgeOn = false;
      let cornerPlaneOn = false;
      const setBaseEdgeHighlight = (enabled) => {
        baseEdgeOn = enabled;
        if (!baseEdgeLine) return;
        baseEdgeLine.material.color.set(enabled ? 0x20bf6b : 0x000000);
      };
      const setBasePlaneHighlight = (enabled) => {
        basePlaneOn = enabled;
        if (!basePlane) return;
        basePlane.material.color.set(enabled ? 0x1c62f2 : 0xffffff);
        basePlane.material.opacity = enabled ? 0.3 : 1;
      };
      const setCornerPlaneHighlight = (enabled) => {
        cornerPlaneOn = enabled;
        cornerPlaneMaterial.color.set(enabled ? 0xeb3b5a : 0xffffff);
        cornerPlaneMaterial.opacity = enabled ? 0.3 : 1;
      };

      const makeBox = (baseSide) => {
        while (boxGroup.children.length) {
          boxGroup.remove(boxGroup.children[0]);
        }
        sidePivots.length = 0;
        cornerSquares.length = 0;
        cornerEdgeLines.length = 0;
        cornerStart = [];
        cornerTarget = [];
        baseEdgeLine = null;

        const base = baseSide;
        const height = (SHEET_SIZE - baseSide) / 2;

        const bottom = new THREE.Mesh(
          new THREE.PlaneGeometry(base, base),
          basePlaneMaterial
        );
        bottom.rotation.x = -Math.PI / 2;
        baseEdgeLine = addEdges(bottom, baseEdgeMaterial);
        boxGroup.add(bottom);
        basePlane = bottom;
        setBaseEdgeHighlight(baseEdgeOn);
        setBasePlaneHighlight(basePlaneOn);

        const sideGeo = new THREE.PlaneGeometry(base, height);

        const frontPivot = new THREE.Group();
        frontPivot.position.set(0, 0, base / 2);
        const front = new THREE.Mesh(sideGeo, planeMaterial);
        front.position.set(0, height / 2, 0);
        addEdges(front);
        frontPivot.add(front);
        boxGroup.add(frontPivot);
        sidePivots.push({ pivot: frontPivot, axis: "x", sign: -1 });

        const backPivot = new THREE.Group();
        backPivot.position.set(0, 0, -base / 2);
        const back = new THREE.Mesh(sideGeo, planeMaterial);
        back.position.set(0, height / 2, 0);
        back.rotation.y = Math.PI;
        addEdges(back);
        backPivot.add(back);
        boxGroup.add(backPivot);
        sidePivots.push({ pivot: backPivot, axis: "x", sign: 1 });

        const leftPivot = new THREE.Group();
        leftPivot.position.set(-base / 2, 0, 0);
        const left = new THREE.Mesh(sideGeo, planeMaterial);
        left.position.set(0, height / 2, 0);
        left.rotation.y = Math.PI / 2;
        addEdges(left);
        leftPivot.add(left);
        boxGroup.add(leftPivot);
        sidePivots.push({ pivot: leftPivot, axis: "z", sign: -1 });

        const rightPivot = new THREE.Group();
        rightPivot.position.set(base / 2, 0, 0);
        const right = new THREE.Mesh(sideGeo, planeMaterial);
        right.position.set(0, height / 2, 0);
        right.rotation.y = -Math.PI / 2;
        addEdges(right);
        rightPivot.add(right);
        boxGroup.add(rightPivot);
        sidePivots.push({ pivot: rightPivot, axis: "z", sign: 1 });

        const cornerGeo = new THREE.PlaneGeometry(height, height);
        const offset = base / 2 + height / 2;
        const corners = [
          [offset, 0, offset],
          [offset, 0, -offset],
          [-offset, 0, offset],
          [-offset, 0, -offset],
        ];
        for (const [cx, cy, cz] of corners) {
          const corner = new THREE.Mesh(cornerGeo, cornerPlaneMaterial);
          corner.position.set(cx, cy, cz);
          corner.rotation.x = -Math.PI / 2;
          const edgeLine = addEdges(corner, cornerEdgeMaterial);
          cornerEdgeLines.push(edgeLine);
          boxGroup.add(corner);
          cornerSquares.push(corner);
          cornerStart.push(new THREE.Vector3(cx, cy, cz));
          cornerTarget.push(
            new THREE.Vector3(
              Math.sign(cx) * (height / 2),
              0,
              Math.sign(cz) * (height / 2)
            )
          );
        }

        targetAngle = isUnfolded ? -Math.PI / 2 : 0;
        applySideAngle(targetAngle);
        updateCornerVisibility();
        updateCornerTransforms(isUnfolded ? 0 : 1);
        setCornerEdgeHighlight(cornerEdgeOn);
        setCornerPlaneHighlight(cornerPlaneOn);
      };

      const applySideAngle = (angle) => {
        for (const side of sidePivots) {
          if (side.axis === "x") {
            side.pivot.rotation.x = angle * side.sign;
          } else {
            side.pivot.rotation.z = angle * side.sign;
          }
        }
      };

      const update = () => {
        const x = parseFloat(xInput.value);
        const base = x;
        const height = (SHEET_SIZE - x) / 2;
        const volume = height * base * base;

        xValue.textContent = x.toFixed(1);
        baseValue.textContent = base.toFixed(1);
        baseValue2.textContent = base.toFixed(1);
        heightValue.textContent = height.toFixed(1);
        volBase.textContent = base.toFixed(1);
        volHeight.textContent = height.toFixed(1);
        volValue.textContent = volume.toFixed(1);
        makeBox(base);
        maxBtn.style.display = Math.abs(x - 50) < 0.05 ? "none" : "inline-block";
      };

      const resize = () => {
        const width = container.clientWidth;
        const height = container.clientHeight;
        renderer.setSize(width, height, false);
        renderer.setScissorTest(false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      };

      xInput.addEventListener("input", update);
      maxBtn.addEventListener("click", () => {
        const maxX = computeMaxX();
        animateSliderTo(maxX);
      });
      unfoldBtn.addEventListener("click", () => {
        isUnfolded = !isUnfolded;
        targetAngle = isUnfolded ? -Math.PI / 2 : 0;
        unfoldBtn.textContent = isUnfolded ? "Fold" : "Unfold";
        updateCornerVisibility();
      });

      update();
      resize();
      window.addEventListener("resize", resize);

      const animate = () => {
        boxGroup.rotation.y += 0.001;
        const current = sidePivots[0]?.axis === "x"
          ? sidePivots[0].pivot.rotation.x * sidePivots[0].sign
          : 0;
        const step = 0.015;
        const next =
          Math.abs(targetAngle - current) < step
            ? targetAngle
            : current + Math.sign(targetAngle - current) * step;
        applySideAngle(next);
        const progress = (next + Math.PI / 2) / (Math.PI / 2);
        updateCornerTransforms(progress);
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };
      animate();
    </script>
  </body>
</html>
