<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Styling Vocabulary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 8px grid system */
            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
            --space-5: 40px;
            --space-6: 48px;
            
            /* Colors - refined palette */
            --color-bg: #ffffff;
            --color-surface: #f8f8f8;
            --color-text: #000000;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            --color-border: #e0e0e0;
            
            --max-width: 1200px;
        }

        body {
            
            /* background: var(--color-bg); - removed, controlled by main.css */
            color: var(--color-text);
            line-height: 1.3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 16px;
        }

        header {
            background: transparent;
            color: var(--color-text);
            padding: 4px var(--space-4) 4px var(--space-2);
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            gap: var(--space-2);
            position: relative;
            border-bottom: 1px solid var(--color-border);
        }

        .header-left {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-right: var(--space-1);
        }

        .header-label {
            font-size: 14px;
            color: var(--color-text);
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.02em;
            padding: 2px 0;
            line-height: 1.2;
        }

        .header-label .separator {
            color: var(--color-text-secondary);
            margin: 0 2px;
        }

        .header-copyright {
            flex: 0 0 auto;
            font-size: 9px;
            color: var(--color-text-secondary);
            font-weight: 400;
            white-space: nowrap;
            line-height: 1.2;
            margin-top: 1px;
        }

        .header-copyright a {
            text-decoration: none;
            color: inherit;
        }

        .header-copyright a:hover {
            opacity: 0.7;
        }

        .header-search-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: stretch;
            margin: 0;
            padding: 0;
            align-self: stretch;
        }

        .header-search {
            width: 100%;
            padding: 0 var(--space-2);
            margin: 0;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 0;
            color: var(--color-text);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.2;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
            height: 100%;
            min-height: 100%;
        }

        .header-search::placeholder {
            color: var(--color-text-secondary);
        }

        .header-search:focus {
            outline: none;
            border-color: var(--color-text);
            background: var(--color-bg);
        }

        .header-search-dropdown {
            position: absolute;
            top: calc(100% + var(--space-1));
            left: 0;
            width: 100%;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 0;
            display: none;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-height: 400px;
            overflow-y: auto;
        }

        .header-search-dropdown.active {
            display: block;
        }

        .header-search-dropdown a {
            display: block;
            padding: var(--space-2);
            background: var(--color-bg);
            border: none;
            border-bottom: 1px solid var(--color-border);
            text-decoration: none;
            color: var(--color-text);
            font-size: 14px;
            transition: background 0.15s ease;
        }

        .header-search-dropdown a:last-child {
            border-bottom: none;
        }

        .header-search-dropdown a:hover {
            background: var(--color-surface);
        }


        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            padding: var(--space-1) var(--space-4) var(--space-3) var(--space-4);
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            margin-top: 0;
            margin-bottom: var(--space-1);
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text);
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            letter-spacing: -0.02em;
        }

        .item-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-3);
        }

        .item-dropdown-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 800px;
        }

        .item-dropdown {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            cursor: pointer;
            padding: calc(var(--space-1) * 0.75) var(--space-1);
            font-size: 14px;
            font-weight: 400;
            color: var(--color-text);
            letter-spacing: 0.02em;
            line-height: 1.3;
            transition: border-color 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-dropdown:hover {
            border-color: var(--color-text);
        }

        .item-dropdown-title {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: var(--space-1);
            align-items: center;
        }

        .item-dropdown-title .ctitle {
            text-align: right;
            flex: 1;
        }

        .item-dropdown-title .separator {
            color: var(--color-text-secondary);
            flex-shrink: 0;
            padding: 0 var(--space-1);
        }

        .item-dropdown-title .etitle {
            text-align: left;
            flex: 1;
        }

        .item-dropdown-arrow {
            margin-left: var(--space-2);
            flex-shrink: 0;
        }

        .item-dropdown-menu {
            position: absolute;
            top: calc(100% + var(--space-1));
            left: 0;
            right: 0;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .item-dropdown-menu.active {
            display: block;
        }

        .item-dropdown-option {
            padding: calc(var(--space-1) * 0.75) var(--space-1);
            cursor: pointer;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            gap: var(--space-1);
            align-items: center;
            transition: background 0.15s ease;
            font-size: 14px;
        }

        .item-dropdown-option:last-child {
            border-bottom: none;
        }

        .item-dropdown-option:hover {
            background: var(--color-surface);
        }

        .item-dropdown-option .ctitle {
            text-align: right;
            flex: 1;
        }

        .item-dropdown-option .separator {
            color: var(--color-text-secondary);
            flex-shrink: 0;
            padding: 0 var(--space-1);
        }

        .item-dropdown-option .etitle {
            text-align: left;
            flex: 1;
        }

        .number-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .number-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--color-text);
            background: var(--color-bg);
            color: var(--color-text);
            border-radius: 0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .number-btn:hover {
            background: var(--color-surface);
        }

        .number-btn.active {
            background: var(--color-text);
            color: var(--color-bg);
        }

        .lang-toggle {
            display: flex;
            gap: 5px;
            background: var(--color-surface);
            padding: 5px;
            border-radius: 0;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 0;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
        }

        .content-area {
            display: flex;
            justify-content: center;
            min-height: 500px;
        }

        .card {
            padding: var(--space-4);
            display: flex;
            flex-direction: column;
            height: fit-content;
            max-width: 700px;
            width: 100%;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--color-text);
            margin-top: 0;
            margin-bottom: var(--space-1);
            padding-top: 0;
            padding-bottom: var(--space-1);
            border-bottom: 1px solid var(--color-border);
            letter-spacing: -0.02em;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.2s ease;
            animation: pulseShrink 1.5s ease-in-out infinite;
        }

        @keyframes pulseShrink {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.99);
            }
        }

        .card-title:hover {
            opacity: 0.7;
        }

        .card-text {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--color-text);
            margin-bottom: var(--space-1);
            flex-grow: 1;
        }

        .card-text p {
            margin-bottom: 15px;
        }

        .vocab-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 0;
        }

        .vocab-item {
            padding: var(--space-1) var(--space-2);
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .vocab-item:hover {
            background: var(--color-surface);
        }

        .vocab-item.selected {
            background: var(--color-text);
            color: var(--color-bg);
            border-color: var(--color-text);
        }

        /* Override colors when selected (but not if matched) */
        .vocab-item.selected:not(.matched-pair) {
            background: var(--color-text) !important;
            color: var(--color-bg) !important;
        }

        /* Make matched pairs non-interactable */
        .vocab-item.matched-pair,
        .text-word.matched {
            pointer-events: none;
            cursor: default;
        }

        .card-text .text-word {
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .card-text .text-word:hover {
            text-decoration: underline;
            text-decoration-color: var(--color-text-secondary);
        }

        .card-text .text-word.matched {
            font-weight: 500;
            text-decoration: none;
        }

        /* Colorblind-friendly color palette (6 colors) - cycles for label IDs */
        .vocab-item.matched-pair[data-label-id="0"],
        .text-word[data-label-id="0"].matched {
            background-color: rgba(0, 102, 204, 0.15);
            color: #0066CC;
        }

        .vocab-item.matched-pair[data-label-id="1"],
        .text-word[data-label-id="1"].matched {
            background-color: rgba(255, 102, 0, 0.15);
            color: #FF6600;
        }

        .vocab-item.matched-pair[data-label-id="2"],
        .text-word[data-label-id="2"].matched {
            background-color: rgba(0, 204, 204, 0.15);
            color: #00CCCC;
        }

        .vocab-item.matched-pair[data-label-id="3"],
        .text-word[data-label-id="3"].matched {
            background-color: rgba(204, 0, 204, 0.15);
            color: #CC00CC;
        }

        .vocab-item.matched-pair[data-label-id="4"],
        .text-word[data-label-id="4"].matched {
            background-color: rgba(0, 204, 0, 0.15);
            color: #00CC00;
        }

        .vocab-item.matched-pair[data-label-id="5"],
        .text-word[data-label-id="5"].matched {
            background-color: rgba(204, 153, 0, 0.15);
            color: #CC9900;
        }


        .card-text .blank {
            display: inline-block;
            min-width: 80px;
            min-height: 24px;
            border: 1px solid var(--color-border);
            margin: 0 2px;
            padding: 2px 6px;
            background: var(--color-bg);
            position: relative;
            vertical-align: baseline;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .card-text .blank:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }

        .card-text .blank.filled {
            border-color: var(--color-text-secondary);
            cursor: pointer;
        }

        .card-text .blank.correct {
            background: rgba(76, 175, 80, 0.15);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .card-text .blank.wrong {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.5);
        }

        .card-text .blank .vocab-blank-content {
            display: inline-block;
            color: var(--color-text);
            font-weight: 400;
        }

        #englishVocab .vocab-item.selected {
            background: var(--color-text);
            color: var(--color-bg);
            border-color: var(--color-text);
        }

        .vocab-definition {
            margin-top: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: var(--color-surface);
            font-size: 0.9rem;
            color: var(--color-text);
            border-left: 3px solid var(--color-text);
            display: none;
        }

        .vocab-definition.show {
            display: block;
        }

        .simple-nav {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }


        .hidden {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="../../main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    </head>
<body>
    <header>
        <div class="header-left">
            <span class="header-label">CodeSwitch<span class="separator">•🤸</span>反轉中英</span>
            <div class="header-copyright"><a href="../../index.html">©kensirenglish.com</a></div>
        </div>
        <div class="header-search-container">
            <input type="text" class="header-search" id="headerSearch" placeholder="Search topics..." />
            <div class="header-search-dropdown" id="headerSearchDropdown"></div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-title">
                <h1>Hair Styling</h1>
            </div>

            <div class="item-navigation">
                <div class="item-dropdown-wrapper">
                    <div class="item-dropdown" id="itemDropdown">
                        <div class="item-dropdown-title">
                            <span class="ctitle"></span>
                            <span class="separator">•</span>
                            <span class="etitle"></span>
                        </div>
                        <span class="item-dropdown-arrow">▼</span>
                    </div>
                    <div class="item-dropdown-menu" id="itemDropdownMenu"></div>
                </div>
            </div>

            <div class="content-area">
                <div class="card" id="mainCard">
                    <h2 class="card-title" id="cardTitle"></h2>
                    <div class="card-text" id="cardText"></div>
                    <div id="cardVocab"></div>
                    <div class="vocab-definition" id="cardDef"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Topic mapping: display name -> JS filename
        const topics = [
            { name: "Hair Styling", file: "HairStyling.js", varName: "HairStyling" },
            { name: "Animals", file: "Animals.js", varName: "Animals" }
        ];

        // Initialize with first item
        let currentIndex = 0;
        let selectedVocabIndex = null;
        let selectedEnglishVocabIndex = null;
        let definitionVisible = false;
        let currentLanguage = 'cantonese'; // 'cantonese' or 'english'
        let currentData = null; // Current loaded data array
        let currentScript = null; // Current loaded script
        let matchedPairs = new Set(); // Track matched label IDs

        // Custom dropdown elements
        const itemDropdown = document.getElementById('itemDropdown');
        const itemDropdownMenu = document.getElementById('itemDropdownMenu');
        const itemDropdownCtitle = itemDropdown.querySelector('.ctitle');
        const itemDropdownEtitle = itemDropdown.querySelector('.etitle');

        function initializeItemDropdown(data) {
            // Clear existing options
            itemDropdownMenu.innerHTML = '';
            
            // Create dropdown menu options
            data.forEach((item, index) => {
            const option = document.createElement('div');
            option.className = 'item-dropdown-option';
            option.dataset.index = index;
            option.innerHTML = `
                <span class="ctitle">${item.ctitle}</span>
                <span class="separator">•</span>
                <span class="etitle">${item.etitle}</span>
            `;
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectItem(index);
                    itemDropdownMenu.classList.remove('active');
                });
                itemDropdownMenu.appendChild(option);
            });
        }

        function loadTopic(topic) {
            // Remove previous script if exists
            if (currentScript) {
                currentScript.remove();
                // Clear the global variable name - we'll need to know the variable name from the topic
                // For now, HairStyling.js uses 'HairStyling', but in future we might have different names
            }

            // Load new script
            currentScript = document.createElement('script');
            currentScript.src = topic.file;
            currentScript.onload = () => {
                // Topic files attach their data to window via varName
                const data = topic.varName && window[topic.varName] ? window[topic.varName] : null;
                
                if (data && data.length > 0) {
                    currentData = data;
                    currentIndex = 0;
                    // Update page title and header title for the selected topic
                    document.title = `${topic.name} Vocabulary`;
                    const pageTitle = document.querySelector('.page-title h1');
                    if (pageTitle) {
                        pageTitle.textContent = topic.name;
                    }
                    initializeItemDropdown(data);
                    selectItem(0); // This will update dropdown title and content
                } else {
                    console.error('Error loading topic data');
                }
            };
            currentScript.onerror = () => {
                console.error('Error loading topic file');
            };
            document.head.appendChild(currentScript);
        }

        // Toggle dropdown menu
        itemDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
            itemDropdownMenu.classList.toggle('active');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!itemDropdown.contains(e.target) && !itemDropdownMenu.contains(e.target)) {
                itemDropdownMenu.classList.remove('active');
            }
        });

        // Header search functionality
        const headerSearch = document.getElementById('headerSearch');
        const headerSearchDropdown = document.getElementById('headerSearchDropdown');

        function renderHeaderSearchResults(topicsToShow) {
            headerSearchDropdown.innerHTML = '';
            
            if (topicsToShow.length > 0) {
                headerSearchDropdown.classList.add('active');
                topicsToShow.forEach(topic => {
                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = topic.name;
                    link.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        loadTopic(topic);
                        headerSearch.value = '';
                        headerSearchDropdown.classList.remove('active');
                        headerSearchDropdown.innerHTML = '';
                    });
                    headerSearchDropdown.appendChild(link);
                });
            } else {
                headerSearchDropdown.classList.remove('active');
            }
        }

        headerSearch.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            if (searchTerm.length === 0) {
                renderHeaderSearchResults(topics);
            } else {
                const matchingTopics = topics.filter(topic => 
                    topic.name.toLowerCase().includes(searchTerm)
                );
                renderHeaderSearchResults(matchingTopics);
            }
        });

        headerSearch.addEventListener('focus', () => {
            if (headerSearch.value.trim().length === 0) {
                renderHeaderSearchResults(topics);
            }
        });

        let isClickingDropdown = false;
        
        headerSearchDropdown.addEventListener('mousedown', () => {
            isClickingDropdown = true;
        });

        headerSearch.addEventListener('blur', (e) => {
            setTimeout(() => {
                if (!isClickingDropdown) {
                    headerSearchDropdown.classList.remove('active');
                    headerSearchDropdown.innerHTML = '';
                }
                isClickingDropdown = false;
            }, 200);
        });

        // Close header search dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.header-search-container')) {
                headerSearchDropdown.classList.remove('active');
                headerSearchDropdown.innerHTML = '';
            }
        });

        function selectItem(index) {
            if (!currentData || index >= currentData.length) return;
            
            currentIndex = index;
            definitionVisible = false; // Reset definition visibility
            
            // Update dropdown display
            const item = currentData[index];
            itemDropdownCtitle.textContent = item.ctitle;
            itemDropdownEtitle.textContent = item.etitle;
            
            // Update content
            updateContent();
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'cantonese' ? 'english' : 'cantonese';
            updateContent();
        }

        function updateContent() {
            if (!currentData || currentIndex >= currentData.length) return;
            
            const item = currentData[currentIndex];
            selectedVocabIndex = null; // Reset selection when changing items
            selectedEnglishVocabIndex = null; // Reset English selection
            definitionVisible = false; // Reset definition visibility
            matchedPairs.clear(); // Clear matched pairs when changing items
            
            const cardTitle = document.getElementById('cardTitle');
            const cardText = document.getElementById('cardText');
            const cardVocab = document.getElementById('cardVocab');
            const cardDef = document.getElementById('cardDef');
            
            if (currentLanguage === 'cantonese') {
                // Show Cantonese content
                cardTitle.textContent = item.ctitle;
                cardText.innerHTML = formatTextWithMatches(item.ctext, item.cbracketstuff, item.etext);
                cardVocab.innerHTML = formatVocab(item.cvocab, 'cantonese');
                cardDef.classList.remove('show');
                cardDef.textContent = '';
                
                // Add event listeners
                setupVocabListeners(item);
                setupTextWordListeners(item);
                setupEtextToggles();
            } else {
                // Show English content
                cardTitle.textContent = item.etitle;
                cardText.innerHTML = formatTextWithBlanks(item.etext, item.evocab, item.ctext);
                cardVocab.innerHTML = formatVocab(item.evocab, 'english');
                cardDef.classList.remove('show');
                cardDef.textContent = '';
                
                // Add event listeners
                setupEnglishVocabListeners(item);
                setupBlankListeners(item);
                setupCtextToggles();
            }
        }

        function setupVocabListeners(item) {
            const vocabItems = document.querySelectorAll('#cardVocab .vocab-item');
            vocabItems.forEach((vocabItem) => {
                vocabItem.addEventListener('click', () => {
                    // Get label ID from the vocab item
                    const labelId = parseInt(vocabItem.getAttribute('data-label-id'));
                    
                    // Don't allow selection if already matched
                    if (matchedPairs.has(labelId)) {
                        return;
                    }
                    
                    // Remove previous selection (but keep matched pairs)
                    document.querySelectorAll('#cardVocab .vocab-item').forEach(item => {
                        if (!item.classList.contains('matched-pair')) {
                            item.classList.remove('selected');
                        }
                    });
                    
                    // Set new selection using label ID
                    selectedVocabIndex = labelId;
                    vocabItem.classList.add('selected');
                });
            });
        }

        function setupEnglishVocabListeners(item) {
            const vocabItems = document.querySelectorAll('#cardVocab .vocab-item');
            const defElement = document.getElementById('cardDef');
            const evocabItems = item.evocab.split(',').map(item => item.trim());
            const edefItems = item.edef ? item.edef.split('|').map(item => item.trim()) : [];
            
            vocabItems.forEach((vocabItem) => {
                vocabItem.addEventListener('click', () => {
                    // Get label ID from the vocab item
                    const labelId = parseInt(vocabItem.getAttribute('data-label-id'));
                    
                    // If clicking the same selected item, toggle definition
                    if (selectedEnglishVocabIndex === labelId) {
                        definitionVisible = !definitionVisible;
                        if (definitionVisible && edefItems[labelId]) {
                            // Extract definition text (format: "Word: definition")
                            const defText = edefItems[labelId].split(':').slice(1).join(':').trim();
                            defElement.textContent = defText || edefItems[labelId];
                            defElement.classList.add('show');
                        } else {
                            defElement.classList.remove('show');
                        }
                    } else {
                        // Remove previous selection
                        document.querySelectorAll('#cardVocab .vocab-item').forEach(item => {
                            item.classList.remove('selected');
                        });
                        
                        // Set new selection using label ID
                        selectedEnglishVocabIndex = labelId;
                        vocabItem.classList.add('selected');
                        
                        // Don't show definition on first click - user needs to click again
                        definitionVisible = false;
                        defElement.classList.remove('show');
                    }
                });
            });
        }

        function setupBlankListeners(item) {
            const blanks = document.querySelectorAll('#cardText .blank');
            const evocabItems = item.evocab.split(',').map(item => item.trim());
            
            // Initialize empty blanks
            blanks.forEach(blank => {
                if (!blank.textContent.trim()) {
                    blank.innerHTML = '&nbsp;';
                }
            });
            
            // Helper function to check if words match (handles different parts of speech)
            function wordsMatch(word1, word2) {
                const w1 = word1.toLowerCase().replace(/[()]/g, '').trim();
                const w2 = word2.toLowerCase().replace(/[()]/g, '').trim();
                
                // Exact match
                if (w1 === w2) return true;
                
                // Check if one is a variation of the other (e.g., "fade" vs "faded", "trim" vs "trimmed")
                const base1 = w1.replace(/(ed|ing|s|es|er|est)$/, '');
                const base2 = w2.replace(/(ed|ing|s|es|er|est)$/, '');
                
                return base1 === base2 || w1.startsWith(base2) || w2.startsWith(base1);
            }
            
            blanks.forEach(blank => {
                blank.addEventListener('click', () => {
                    if (selectedEnglishVocabIndex === null) {
                        return;
                    }
                    
                    const blankVocabIndex = parseInt(blank.getAttribute('data-vocab-index'));
                    const answerText = blank.getAttribute('data-answer-text'); // Get the stored answer text from etext
                    const selectedVocab = evocabItems[selectedEnglishVocabIndex];
                    const expectedVocab = evocabItems[blankVocabIndex];
                    
                    // Check if it's correct (match by index OR by word similarity)
                    if (selectedEnglishVocabIndex === blankVocabIndex || wordsMatch(selectedVocab, expectedVocab)) {
                        // Fill with the stored answer text from etext (with correct capitalization/form)
                        blank.innerHTML = `<span class="vocab-blank-content">${answerText}</span>`;
                        blank.classList.remove('wrong');
                        blank.classList.add('filled', 'correct');
                    } else {
                        // Wrong answer - show feedback but don't reveal answer
                        blank.innerHTML = `<span class="vocab-blank-content">${selectedVocab}</span>`;
                        blank.classList.add('filled', 'wrong');
                        blank.classList.remove('correct');
                        
                        // Reset to blank after showing wrong feedback
                        setTimeout(() => {
                            blank.innerHTML = '&nbsp;';
                            blank.classList.remove('filled', 'wrong', 'correct');
                        }, 1000);
                    }
                });
                
                // Allow double-click to clear/reset blank
                blank.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    blank.innerHTML = '&nbsp;';
                    blank.classList.remove('filled', 'correct', 'wrong');
                });
            });
        }

        function setupTextWordListeners(item) {
            const textWords = document.querySelectorAll('#cardText .text-word');
            textWords.forEach(word => {
                word.addEventListener('click', () => {
                    // Don't allow interaction if already matched
                    if (word.classList.contains('matched')) {
                        return;
                    }
                    
                    if (selectedVocabIndex === null) {
                        return;
                    }
                    
                    // Check if word has explicit vocab index from markup
                    const wordVocabIndex = word.getAttribute('data-vocab-index');
                    
                    if (wordVocabIndex !== null) {
                        // Use explicit index from markup
                        const expectedIndex = parseInt(wordVocabIndex);
                        
                        // Don't allow matching if vocab item is already matched
                        if (matchedPairs.has(expectedIndex)) {
                            return;
                        }
                        
                        if (selectedVocabIndex === expectedIndex) {
                            // Mark as matched
                            matchedPairs.add(expectedIndex);
                            word.classList.add('matched');
                            
                            // Apply color based on label ID (modulo 6)
                            const colorIndex = expectedIndex % 6;
                            const colors = [
                                { bg: 'rgba(0, 102, 204, 0.15)', text: '#0066CC' },
                                { bg: 'rgba(255, 102, 0, 0.15)', text: '#FF6600' },
                                { bg: 'rgba(0, 204, 204, 0.15)', text: '#00CCCC' },
                                { bg: 'rgba(204, 0, 204, 0.15)', text: '#CC00CC' },
                                { bg: 'rgba(0, 204, 0, 0.15)', text: '#00CC00' },
                                { bg: 'rgba(204, 153, 0, 0.15)', text: '#CC9900' }
                            ];
                            word.style.backgroundColor = colors[colorIndex].bg;
                            word.style.color = colors[colorIndex].text;
                            
                            // Also highlight the corresponding vocab item with same color
                            const vocabItem = document.querySelector(`#cardVocab .vocab-item[data-label-id="${expectedIndex}"]`);
                            if (vocabItem) {
                                vocabItem.classList.add('matched-pair', 'matched');
                                vocabItem.style.backgroundColor = colors[colorIndex].bg;
                                vocabItem.style.color = colors[colorIndex].text;
                                vocabItem.style.cursor = 'default';
                                vocabItem.style.pointerEvents = 'none';
                            }
                            
                            // Clear selection
                            selectedVocabIndex = null;
                            document.querySelectorAll('#cardVocab .vocab-item').forEach(item => {
                                if (!item.classList.contains('matched-pair')) {
                                    item.classList.remove('selected');
                                }
                            });
                        } else {
                            // Wrong match - show red feedback briefly
                            word.style.background = 'rgba(244, 67, 54, 0.2)';
                            word.style.color = '#000000';
                            setTimeout(() => {
                                word.style.background = '';
                                word.style.color = '';
                            }, 500);
                        }
                    } else {
                        // Fallback to old method (text matching) for backward compatibility
                        const cbracketItems = item.cbracketstuff.split(',').map(item => item.trim());
                        const expectedMatch = cbracketItems[selectedVocabIndex];
                        
                        // Get the clicked text (remove any trailing punctuation for comparison)
                        const clickedText = word.getAttribute('data-match-text');
                        const normalizedClicked = clickedText.replace(/[，。！？、,\.!?;:]/g, '').trim();
                        const normalizedExpected = expectedMatch.replace(/[，。！？、,\.!?;:]/g, '').trim();
                        
                        // Don't allow matching if vocab item is already matched
                        if (matchedPairs.has(selectedVocabIndex)) {
                            return;
                        }
                        
                        // Check if it matches (case-insensitive, ignoring punctuation)
                        if (expectedMatch && normalizedClicked.toLowerCase() === normalizedExpected.toLowerCase()) {
                            // Mark as matched
                            matchedPairs.add(selectedVocabIndex);
                            word.classList.add('matched');
                            
                            // Apply color based on label ID (modulo 6)
                            const colorIndex = selectedVocabIndex % 6;
                            const colors = [
                                { bg: 'rgba(0, 102, 204, 0.15)', text: '#0066CC' },
                                { bg: 'rgba(255, 102, 0, 0.15)', text: '#FF6600' },
                                { bg: 'rgba(0, 204, 204, 0.15)', text: '#00CCCC' },
                                { bg: 'rgba(204, 0, 204, 0.15)', text: '#CC00CC' },
                                { bg: 'rgba(0, 204, 0, 0.15)', text: '#00CC00' },
                                { bg: 'rgba(204, 153, 0, 0.15)', text: '#CC9900' }
                            ];
                            word.style.backgroundColor = colors[colorIndex].bg;
                            word.style.color = colors[colorIndex].text;
                            
                            // Also highlight the corresponding vocab item with same color
                            const vocabItem = document.querySelector(`#cardVocab .vocab-item[data-label-id="${selectedVocabIndex}"]`);
                            if (vocabItem) {
                                vocabItem.classList.add('matched-pair', 'matched');
                                vocabItem.style.backgroundColor = colors[colorIndex].bg;
                                vocabItem.style.color = colors[colorIndex].text;
                                vocabItem.style.cursor = 'default';
                                vocabItem.style.pointerEvents = 'none';
                            }
                            
                            // Clear selection
                            selectedVocabIndex = null;
                            document.querySelectorAll('#cardVocab .vocab-item').forEach(item => {
                                if (!item.classList.contains('matched-pair')) {
                                    item.classList.remove('selected');
                                }
                            });
                        } else {
                            // Wrong match - show red feedback briefly
                            word.style.background = 'rgba(244, 67, 54, 0.2)';
                            word.style.color = '#000000';
                            setTimeout(() => {
                                word.style.background = '';
                                word.style.color = '';
                            }, 500);
                        }
                    }
                });
            });
        }

        function setupEtextToggles() {
            const toggles = document.querySelectorAll('.etext-toggle');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const lineId = this.getAttribute('data-line-id');
                    const reveal = document.getElementById(lineId);
                    
                    if (reveal) {
                        const isVisible = reveal.style.display !== 'none';
                        if (isVisible) {
                            reveal.style.display = 'none';
                            this.textContent = '▸';
                        } else {
                            reveal.style.display = 'block';
                            this.textContent = '▾';
                        }
                    }
                });
            });
        }

        function setupCtextToggles() {
            const toggles = document.querySelectorAll('.ctext-toggle');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const lineId = this.getAttribute('data-line-id');
                    const reveal = document.getElementById(lineId);
                    
                    if (reveal) {
                        const isVisible = reveal.style.display !== 'none';
                        if (isVisible) {
                            reveal.style.display = 'none';
                            this.textContent = '▸';
                        } else {
                            reveal.style.display = 'block';
                            this.textContent = '▾';
                        }
                    }
                });
            });
        }

        function formatText(text) {
            // Replace line breaks with paragraphs
            return text.split('\n').map(line => {
                if (line.trim()) {
                    return `<p>${line}</p>`;
                }
                return '';
            }).join('');
        }

        function formatTextWithBlanks(text, evocab, ctext = null) {
            if (!text) return '';
            
            // Split both etext and ctext by newlines
            const etextLines = text.split('\n');
            const ctextLines = ctext ? fillBlanksInCtext(ctext).split('\n') : [];
            
            // Pattern for blanks: [answer:index] where answer is the correct text to display
            const blankPattern = /\[([^\]]+):(\d+)\]/g;
            
            // Process each line with line index
            return etextLines.map((line, lineIndex) => {
                if (!line.trim()) return '';
                
                const lineId = `etext-line-${lineIndex}`;
                const ctextLine = ctextLines[lineIndex] || '';
                const hasCtext = ctextLine.trim() !== '';
                
                // Check if line contains blank markup
                let processed;
                if (blankPattern.test(line)) {
                    // Reset regex
                    blankPattern.lastIndex = 0;
                    
                    // Replace blanks with clickable spans
                    processed = line.replace(blankPattern, (match, answerText, vocabIndex) => {
                        return `<span class="blank" data-vocab-index="${vocabIndex}" data-answer-text="${answerText}">&nbsp;</span>`;
                    });
                } else {
                    // No blanks, but check if we need to auto-detect vocab words in text
                    // This handles cases where words appear in different forms (e.g., "faded" vs "fade")
                    if (evocab) {
                        const evocabItems = evocab.split(',').map(item => item.trim());
                        processed = line;
                        
                        // Try to match each vocab word (case-insensitive, handle variations)
                        evocabItems.forEach((vocab, index) => {
                            // Create regex to match the word and common variations (past tense, plural, etc.)
                            const baseWord = vocab.toLowerCase().replace(/[()]/g, '').trim();
                            // Match the word as-is, or with common suffixes: -ed, -ing, -s, -es, -er, -est
                            const wordPattern = new RegExp(`\\b(${baseWord}|${baseWord}ed|${baseWord}ing|${baseWord}s|${baseWord}es|${baseWord}er|${baseWord}est)\\b`, 'gi');
                            
                            // Check if this word appears in the line (but not already marked as blank)
                            if (wordPattern.test(line) && !processed.includes(`[${vocab}:${index}]`)) {
                                // Don't auto-mark if it's already in a blank - let the explicit markup take precedence
                                // This is just for reference, we'll keep the original text as-is
                            }
                        });
                    } else {
                        processed = line;
                    }
                }
                
                // Add "▸" button and ctext reveal if ctext is available
                let html = '';
                if (hasCtext) {
                    html += `<p class="etext-line-wrapper">
                        <span class="ctext-toggle" data-line-id="${lineId}" style="cursor: pointer; margin-right: 8px; color: var(--color-text-secondary); user-select: none; font-size: inherit;">▸</span>
                        <span class="etext-line">${processed}</span>
                        <div class="ctext-reveal" id="${lineId}" style="display: none; font-size: 0.85em; color: var(--color-text-secondary); margin-top: 4px; margin-left: 20px; font-style: italic;">${ctextLine}</div>
                    </p>`;
                } else {
                    html = `<p>${processed}</p>`;
                }
                
                return html;
            }).join('');
        }

        function formatVocab(vocabText, lang) {
            const lines = vocabText.split(',').map(item => item.trim()).filter(item => item);
            
            // Create vocab items with label IDs (using index as label ID)
            const vocabItemsWithLabel = lines.map((line, originalIndex) => {
                const labelId = originalIndex; // Use index as label ID
                // Check selection using original index
                let isSelected = '';
                if (lang === 'cantonese' && selectedVocabIndex === originalIndex) {
                    isSelected = 'selected';
                } else if (lang === 'english' && selectedEnglishVocabIndex === originalIndex) {
                    isSelected = 'selected';
                }
                return {
                    html: `<div class="vocab-item ${isSelected}" data-vocab-index="${originalIndex}" data-label-id="${labelId}" data-lang="${lang}">${line}</div>`,
                    originalIndex: originalIndex,
                    labelId: labelId
                };
            });
            
            // Shuffle for random display order (but keep label IDs in data-label-id)
            const shuffled = vocabItemsWithLabel.sort(() => Math.random() - 0.5);
            
            // Return shuffled HTML but with correct label IDs preserved
            return `<div class="vocab-list">${shuffled.map(item => item.html).join('')}</div>`;
        }

        // Helper function to fill blanks in etext (replace [word:index] with word)
        function fillBlanksInEtext(etext) {
            if (!etext) return '';
            const blankPattern = /\[([^\]]+):(\d+)\]/g;
            return etext.replace(blankPattern, (match, answerText, vocabIndex) => {
                return answerText;
            });
        }

        // Helper function to fill blanks in ctext (replace [word:index] with word)
        function fillBlanksInCtext(ctext) {
            if (!ctext) return '';
            const blankPattern = /\[([^\]]+):(\d+)\]/g;
            return ctext.replace(blankPattern, (match, textContent, vocabIndex) => {
                return textContent;
            });
        }

        function formatTextWithMatches(text, cbracketstuff, etext = null) {
            if (!text) return '';
            
            // Split both ctext and etext by newlines
            const ctextLines = text.split('\n');
            const etextLines = etext ? fillBlanksInEtext(etext).split('\n') : [];
            
            // Check if text uses markup syntax [text:index]
            // Pattern: [text content:vocab index]
            const markupPattern = /\[([^\]]+):(\d+)\]/g;
            
            // Process each line with line index
            return ctextLines.map((line, lineIndex) => {
                if (!line.trim()) return '';
                
                const lineId = `ctext-line-${lineIndex}`;
                const etextLine = etextLines[lineIndex] || '';
                const hasEtext = etextLine.trim() !== '';
                
                // Check if line contains markup
                let processed;
                if (markupPattern.test(line)) {
                    // Reset regex
                    markupPattern.lastIndex = 0;
                    
                    // Replace markup with clickable spans
                    // vocabIndex from markup is the label ID
                    processed = line.replace(markupPattern, (match, textContent, vocabIndex) => {
                        return `<span class="text-word" data-vocab-index="${vocabIndex}" data-label-id="${vocabIndex}" data-match-text="${textContent}">${textContent}</span>`;
                    });
                } else {
                    // No markup - use old method for backward compatibility
                    if (!cbracketstuff) {
                        processed = line;
                    } else {
                        // Get all possible matches from cbracketstuff
                        const matches = cbracketstuff.split(',').map(item => item.trim()).filter(item => item);
                        
                        // Create a regex pattern to match any of these words/phrases
                        // Sort by length (longest first) to match longer phrases first
                        const sortedMatches = matches.sort((a, b) => b.length - a.length);
                        const pattern = sortedMatches.map(match => {
                            // Escape special regex characters
                            return match.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        }).join('|');
                        
                        if (pattern) {
                            const regex = new RegExp(`(${pattern})`, 'gi');
                            // Replace matches with clickable spans (without vocab index)
                            processed = line.replace(regex, (match) => {
                                return `<span class="text-word" data-match-text="${match}">${match}</span>`;
                            });
                        } else {
                            processed = line;
                        }
                    }
                }
                
                // Add "▸" button and etext reveal if etext is available
                let html = '';
                if (hasEtext) {
                    html += `<p class="ctext-line-wrapper">
                        <span class="etext-toggle" data-line-id="${lineId}" style="cursor: pointer; margin-right: 8px; color: var(--color-text-secondary); user-select: none; font-size: inherit;">▸</span>
                        <span class="ctext-line">${processed}</span>
                        <div class="etext-reveal" id="${lineId}" style="display: none; font-size: 0.85em; color: var(--color-text-secondary); margin-top: 4px; margin-left: 20px; font-style: italic;">${etextLine}</div>
                    </p>`;
                } else {
                    html = `<p>${processed}</p>`;
                }
                
                return html;
            }).join('');
        }

        // Initialize
        // Add click handler to card title
        document.getElementById('cardTitle').addEventListener('click', toggleLanguage);
        // Load first topic
        if (topics.length > 0) {
            loadTopic(topics[0]);
        }
    </script>
